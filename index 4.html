fn shadow(ro: vec3f, rd: vec3f, dist: f32, L: Lgt) -> f32 {

  if (L.pat < 0.5) { return 1.0; }
  let pd = select(8.0, 1.6, L.pat < 1.5);
  let P0 = L.pos - L.dir * pd;
  let tn = dot(P0 - ro, rd);
  if (tn < 0.0 || tn > dist) { return 1.0; }
  let q = ro + rd * tn;
  let u1 = normalize(cross(L.dir, select(vec3f(0.0, 1.0, 0.0), vec3f(1.0, 0.0, 0.0), L.dir.y < 0.9)));
  let u2 = cross(L.dir, u1);
  let lx = dot(q - P0, u1);
  let lz = dot(q - P0, u2);
  if (L.pat < 1.5) {
    let d2 = abs(fract(lx / 0.62) - 0.5) * 2.0;
    return step(0.35, d2);
  }
  let r = length(vec2f(lx, lz));
  let a = atan(lz, lx);
  let pet = step(0.42, abs(sin(3.0 * a))) * smoothstep(1.9, 1.7, r) * smoothstep(0.5, 0.7, r);
  let cen = smoothstep(0.42, 0.38, r);
  let ring = smoothstep(2.3, 2.15, r) * smoothstep(1.95, 2.1, r);
  return clamp(pet + cen + ring, 0.0, 1.0);
}
fn direct(p: vec3f, nn: vec3f) -> vec3f {
  var c = vec3f(0.0);
  for (var i = 0u; i < 8u; i = i + 1u) {
    if (f32(i) >= NLA.x) { break; }
    let L = LGT[i];
    let Lv = L.pos - p;
    let d = length(Lv);
    let ld = Lv / max(d, 0.001);
    let ndl = dot(nn, ld);
    if (ndl <= 0.0) { continue; }
    var att = ndl / (1.0 + 0.028 * d * d);
    if (L.cosO < 0.99) {
      let sa = dot(-ld, L.dir);
      if (sa < L.cosO) { att = 0.0; }
      else {
        let f = smoothstep(L.cosO, 1.0, sa);
        att = att * f * f;
      }
    }
    var sh = 1.0;
    if (L.rad > 0.02 && (L.pat > 0.5 || d < 9.0)) {
      let h1 = h13(vec3f(f32(i), CAM.time, 7.3));
      let h2 = h13(vec3f(f32(i) + 3.1, CAM.time, 1.7));
      let jp = L.pos + vec3f((h1 * 2.0 - 1.0) * L.rad, (h2 * 2.0 - 1.0) * L.rad, (h1 + h2 - 1.0) * L.rad * 0.5);
      sh = shadow(p + nn * 0.02, normalize(jp - p), d, L);
    }
    c = c + L.col * att * sh;
  }
  return c;
}
fn fogBeam(p: vec3f) -> vec3f {
  var c = vec3f(0.0);
  if (CAM.fog.z > 0.01 && NLA.y >= 0.0 && NLA.y < 8.0) {
    let L = LGT[u32(NLA.y + 0.5)];
    let wv = p - L.pos;
    let ax = dot(wv, L.dir);
    let perp = wv - L.dir * ax;
    let w = length(perp);
    let b = exp(-w * w * 5.0) * exp(-max(-ax, 0.0) * 0.22) * CAM.fog.z;
