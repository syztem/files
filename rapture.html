<script type="text/plain" id="wk">
class FR extends AudioWorkletProcessor {
  constructor(o) {
    super();
    const po = o.processorOptions;
    this.x = new WebAssembly.Instance(new WebAssembly.Module(po.b), {}).exports;
    this.x.s_init(sampleRate);
    this.bar = po.bar | 0;
    this.x.s_seek(this.bar);
    this.mx = this.x.s_max();
    this.p = this.x.s_out();
    this.n = 0;
    this.on = !!po.go;
    this.sent = false;
    this.port.onmessage = e => {
      if (e.data === "go") { this.x.s_seek(0); this.on = true; this.sent = false; }
      else if (e.data === "stop") { this.on = false; }
    };
  }
  views(n) {
    this.n = n;
    this.l = new Float32Array(this.x.memory.buffer, this.p, n);
    this.r = new Float32Array(this.x.memory.buffer, this.p + this.mx * 4, n);
  }
  process(i, o) {
    const out = o[0];
    if (!this.on || !out || !out[0]) return true;
    const L = out[0];
    const n = L.length;
    if (n !== this.n) this.views(n);
    if (!this.sent) { this.sent = true; this.port.postMessage(currentFrame); }
    this.x.s_render(n);
    L.set(this.l);
    if (out[1]) out[1].set(this.r);
    return true;
  }
}
registerProcessor("proc", FR);
</script>

<script type="text/plain" id="w-common">
@group(0) @binding(0) var<uniform> u: U;
@group(0) @binding(1) var nt: texture_3d<f32>;
@group(0) @binding(2) var sr: sampler;
const PI = 3.14159265;
const TAU = 6.2831853;
fn h1(n: f32) -> f32 { return fract(sin(n * 127.1 + 0.37) * 43758.5453); }
fn h21(p: vec2f) -> f32 { var p3 = fract(vec3f(p.x, p.y, p.x) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
fn n3(p: vec3f) -> vec4f { return textureSampleLevel(nt, sr, p, 0.0); }
fn r2(a: f32) -> mat2x2f { let c = cos(a); let s = sin(a); return mat2x2f(c, s, -s, c); }
fn sech2(x: f32) -> f32 { let t = tanh(x); return 1.0 - t * t; }
fn tpos(s: f32) -> vec3f {
  let a = u.tp[0]; let b = u.tp[1]; let c = u.tp[2]; let d = u.tp[3];
  let x = a.x * (sin(a.y * s + a.z) - sin(a.z)) + a.w * sin(b.x * s);
  let y = b.y * s + b.z * sin(b.w * s) + c.x * 0.5 * (1.0 + tanh((s - c.y) / c.z)) + c.w * 0.5 * (1.0 + tanh((s - d.x) / d.y));
  return vec3f(x, y, -s);
}
fn tder(s: f32) -> vec3f {
  let a = u.tp[0]; let b = u.tp[1]; let c = u.tp[2]; let d = u.tp[3];
  let x = a.x * a.y * cos(a.y * s + a.z) + a.w * b.x * cos(b.x * s);
  let y = b.y + b.z * b.w * cos(b.w * s) + c.x * 0.5 * sech2((s - c.y) / c.z) / c.z + c.w * 0.5 * sech2((s - d.x) / d.y) / d.y;
  return vec3f(x, y, -1.0);
}
fn tf(p: vec3f) -> vec3f {
  var s = -p.z;
  for (var i = 0; i < 2; i++) {
    let D = tder(s);
    s += dot(p - tpos(s), D) / dot(D, D);
  }
  let P = tpos(s);

const GX = 32;
const GY = 16;
const GZ = 32;
fn shE(i: u32, n: vec3f) -> vec3f {

fn slotOf(c: vec3f) -> u32 {

fn giAt(p: vec3f, n: vec3f, fb: vec3f) -> vec3f {
