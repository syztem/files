<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Roadster Ramp</title>
<script src="https://unpkg.com/htmx.org@2.0.4"></script>
<style>
:root{--bg:#04060a;--fg:#cfe3ff;--acc:#ff2f45;--acc2:#49d6ff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);
font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;-webkit-font-smoothing:antialiased}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#vig{position:fixed;inset:0;pointer-events:none;
background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,0) 42%,rgba(0,0,0,.62) 100%)}
#hud{position:fixed;inset:0;pointer-events:none;z-index:3}
#hud button{pointer-events:auto}
#top{position:absolute;left:18px;top:16px}
#ttl{font-size:15px;letter-spacing:.34em;font-weight:700;color:#eaf2ff;text-shadow:0 0 18px rgba(90,160,255,.55)}
#st{margin-top:6px;display:inline-block;padding:3px 9px;border:1px solid rgba(120,180,255,.35);
border-radius:3px;font-size:10px;letter-spacing:.18em;background:rgba(10,18,32,.66);color:#9fd0ff}
.sil{position:absolute;left:14px;top:112px;width:118px;height:86px;
border:1px solid rgba(110,160,230,.16);border-radius:6px;background:rgba(8,13,22,.55)}
#silr{position:absolute;inset:0;display:grid;place-items:center;transition:transform .08s linear}
#silr svg{fill:#bfe0ff;opacity:.85;filter:drop-shadow(0 0 6px rgba(90,170,255,.6))}
.gauges{position:absolute;left:16px;bottom:16px;display:flex;gap:12px}
.gauge{position:relative;width:92px;height:92px;border-radius:50%;
background:conic-gradient(from 220deg,var(--c) calc(var(--p,0)*280deg),rgba(130,175,255,.10) 0)}
.gauge::before{content:"";position:absolute;inset:6px;border-radius:50%;
background:rgba(6,10,18,.9);border:1px solid rgba(120,170,255,.16)}
.core{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.core .l{font-size:7.5px;letter-spacing:.12em;opacity:.55}
.core .v{font-size:16px;font-weight:700;color:#fff;line-height:1;font-variant-numeric:tabular-nums}
.core .u{font-size:8px;opacity:.5}
#panel{position:absolute;right:16px;top:16px;width:250px;padding:12px 14px;
border:1px solid rgba(110,160,230,.22);border-radius:8px;background:rgba(7,12,20,.82);
backdrop-filter:blur(6px)}
#panel h4{margin:0 0 6px;font-size:10px;letter-spacing:.2em;color:#9fd0ff}
#panel p{margin:0 0 8px;font-size:10.5px;opacity:.62;line-height:1.5}
#panel .big{font-size:24px;font-weight:700;color:#fff;line-height:1.1}
#panel .bar{height:3px;margin-top:8px;background:rgba(120,170,255,.14);border-radius:2px;overflow:hidden}
#panel .bar i{display:block;height:100%;background:linear-gradient(90deg,#ff2f45,#49d6ff)}
#ctrls{position:absolute;right:16px;bottom:16px;display:flex;flex-direction:column;gap:6px;align-items:stretch}
#ch{display:flex;flex-direction:column;gap:6px;margin-top:10px}
button{pointer-events:auto;font:inherit;font-size:10px;letter-spacing:.13em;color:#cfe3ff;
background:rgba(14,22,36,.88);border:1px solid rgba(110,160,230,.3);border-radius:4px;
padding:7px 11px;cursor:pointer;text-align:left;transition:background .12s,border-color .12s}
button:hover{background:rgba(30,50,80,.95);border-color:rgba(150,200,255,.6)}
button.on{border-color:var(--acc);color:#ffd7dc;background:rgba(60,14,22,.85)}
@media(max-width:760px){
.sil{display:none}
.gauge{width:70px;height:70px}
.core .v{font-size:13px}
#panel{width:190px}
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vig"></div>
<div id="hud">
<div id="top">
<div id="ttl">ROADSTER RAMP</div>
<div id="st">CONSTRAINED</div>
</div>
<div class="sil"><div id="silr">
<svg viewBox="-32 -24 64 48" width="104" height="78">
<path d="M-25 7 L-25 -3 L-13 -5 L-4 -13 L11 -13 L19 -5 L25 -3 L25 7 Z"/>
<circle cx="-14" cy="8" r="6.5"/><circle cx="14" cy="8" r="6.5"/>
</svg>
</div></div>
<div class="gauges">
<div class="gauge" id="g1" style="--c:#ff2f45;--p:0"><div class="core"><span class="l">DOWNFORCE</span><span class="v">0</span><span class="u">kg</span></div></div>
<div class="gauge" id="g2" style="--c:#49d6ff;--p:0"><div class="core"><span class="l">PITCH</span><span class="v">0</span><span class="u">deg</span></div></div>
<div class="gauge" id="g3" style="--c:#9d7bff;--p:0"><div class="core"><span class="l">ALTITUDE</span><span class="v">0</span><span class="u">ft</span></div></div>
<div class="gauge" id="g4" style="--c:#ffd34a;--p:0"><div class="core"><span class="l">G-FORCE</span><span class="v">0.0</span><span class="u">g</span></div></div>
</div>
<div id="panel"><h4>CHALLENGES</h4><p>Drive the ramp, hold the inversion, release and land it clean.</p></div>
<div id="ctrls">
<button data-act="demo">DEMO AUTOPLAY</button>
<button data-act="release">RELEASE</button>
<button data-act="cam">CAMERA</button>
<button data-act="reset">RESET</button>
<button data-act="assist">ASSIST ON</button>
<button data-act="lineup">LINEUP OFF</button>
<div id="ch">
<button data-frag="c1">INVERTED HOLD</button>
<button data-frag="c2">SOFT LANDING</button>
<button data-frag="c3">KICKFLIP</button>
<button data-frag="c4">PEAK LOADS</button>
</div>
</div>
</div>
<script type="importmap">
{"imports":{
"three":"https://unpkg.com/three@0.170.0/build/three.module.js",
"three/webgpu":"https://unpkg.com/three@0.170.0/build/three.webgpu.js",
"three/addons/":"https://unpkg.com/three@0.170.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three/webgpu';
import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';

const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const smoothstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};

const canvas=$('#c');
const renderer=new THREE.WebGPURenderer({canvas,antialias:false,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.1;

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x04060a);
scene.fog=new THREE.FogExp2(0x04060a,0.0072);

const camera=new THREE.PerspectiveCamera(52,innerWidth/innerHeight,0.1,700);
camera.position.set(30,17,34);
const camLook=new THREE.Vector3(0,10,0);
camLook.copy(camLook);

const hemi=new THREE.HemisphereLight(0x35507f,0x05070c,0.55);scene.add(hemi);
const key=new THREE.DirectionalLight(0xbcd6ff,1.4);key.position.set(-26,36,28);scene.add(key);
const fill=new THREE.DirectionalLight(0xff6a2e,0.55);fill.position.set(30,10,-24);scene.add(fill);
const spot=new THREE.SpotLight(0xff2f45,190,95,0.78,0.7,2);
spot.position.set(0,27,0);spot.target.position.set(0,20,0);
scene.add(spot);scene.add(spot.target);

function noiseTex(size,base,spread,rep){
const cv=document.createElement('canvas');cv.width=cv.height=size;
const g=cv.getContext('2d');
const img=g.createImageData(size,size);
for(let i=0;i<size*size;i++){
const v=clamp(base+(Math.random()-0.5)*spread,0,255);
img.data[i*4]=v;img.data[i*4+1]=v;img.data[i*4+2]=v;img.data[i*4+3]=255;
}
g.putImageData(img,0,0);
const t=new THREE.CanvasTexture(cv);
t.wrapS=t.wrapT=THREE.RepeatWrapping;
t.repeat.set(rep,rep);
t.colorSpace=THREE.SRGBColorSpace;
t.anisotropy=1;
return t;
}
function softTex(){
const s=64,cv=document.createElement('canvas');cv.width=cv.height=s;
const g=cv.getContext('2d');
const grd=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
grd.addColorStop(0,'rgba(255,255,255,1)');
grd.addColorStop(0.32,'rgba(255,255,255,0.46)');
grd.addColorStop(1,'rgba(255,255,255,0)');
g.fillStyle=grd;g.fillRect(0,0,s,s);
const t=new THREE.CanvasTexture(cv);
t.colorSpace=THREE.SRGBColorSpace;
return t;
}
function flameTex(){
const w=32,h=128,cv=document.createElement('canvas');
cv.width=w;cv.height=h;
const g=cv.getContext('2d');
const grd=g.createLinearGradient(0,0,0,h);
grd.addColorStop(0,'rgba(255,255,255,1)');
grd.addColorStop(0.22,'rgba(255,226,160,0.92)');
grd.addColorStop(0.58,'rgba(255,116,32,0.42)');
grd.addColorStop(1,'rgba(255,60,0,0)');
g.fillStyle=grd;g.fillRect(0,0,w,h);
const t=new THREE.CanvasTexture(cv);
t.colorSpace=THREE.SRGBColorSpace;
return t;
}

const groundMat=new THREE.MeshStandardMaterial({
color:0x0b1018,roughness:0.94,metalness:0.05,
map:noiseTex(128,26,26,60)
});
const ground=new THREE.Mesh(new THREE.PlaneGeometry(700,700),groundMat);
ground.rotation.x=-Math.PI/2;
ground.position.y=-0.06;
scene.add(ground);

const R=10.6,W=6.0,TH=0.2,HT=TH/2,HW=W/2,RIDE=HT+0.02;
const THMAX=195*Math.PI/180;
const cpts=[];
const lead=[-26,-22,-18,-14,-10.5,-7.5,-5,-3,-1.5,-0.5];
for(let i=0;i<lead.length;i++)cpts.push(new THREE.Vector3(lead[i],0,0));
const NARC=64;
for(let i=1;i<=NARC;i++){
const a=THMAX*i/NARC;
cpts.push(new THREE.Vector3(R*Math.sin(a),R-R*Math.cos(a),0));
}
const curve=new THREE.CatmullRomCurve3(cpts,false,'centripetal',0.5);
curve.arcLengthDivisions=1200;
curve.updateArcLengths();
const CLEN=curve.getLength();

function buildRamp(){
const M=160;
const pos=new Float32Array((M+1)*4*3);
const uv=new Float32Array((M+1)*4*2);
const idx=[];
const P=new THREE.Vector3(),T=new THREE.Vector3(),U=new THREE.Vector3();
for(let i=0;i<=M;i++){
const u=i/M;
curve.getPointAt(u,P);
curve.getTangentAt(u,T);
U.set(-T.y,T.x,0).normalize();
const ix=P.x+U.x*HT,iy=P.y+U.y*HT;
const ox=P.x-U.x*HT,oy=P.y-U.y*HT;
const o=i*4;
pos[o*3]=ix;pos[o*3+1]=iy;pos[o*3+2]=HW;
pos[o*3+3]=ix;pos[o*3+4]=iy;pos[o*3+5]=-HW;
pos[o*3+6]=ox;pos[o*3+7]=oy;pos[o*3+8]=-HW;
pos[o*3+9]=ox;pos[o*3+10]=oy;pos[o*3+11]=HW;
const v=u*CLEN/6;
uv[o*2]=0;uv[o*2+1]=v;
uv[o*2+2]=1;uv[o*2+3]=v;
uv[o*2+4]=1;uv[o*2+5]=v;
uv[o*2+6]=0;uv[o*2+7]=v;
}
for(let i=0;i<M;i++){
for(let e=0;e<4;e++){
const a=i*4+e,b=i*4+(e+1)%4,c=(i+1)*4+(e+1)%4,d=(i+1)*4+e;
idx.push(a,b,c,a,c,d);
}
}
const g=new THREE.BufferGeometry();
g.setAttribute('position',new THREE.BufferAttribute(pos,3));
g.setAttribute('uv',new THREE.BufferAttribute(uv,2));
g.setIndex(idx);
g.computeVertexNormals();
return g;
}
const rampTex=noiseTex(128,44,40,4);
const rampMat=new THREE.MeshStandardMaterial({
color:0x2a2f38,roughness:0.86,metalness:0.08,
map:rampTex,side:THREE.DoubleSide
});
const ramp=new THREE.Mesh(buildRamp(),rampMat);
scene.add(ramp);

function buildEdges(){
const M=160;
const pos=new Float32Array((M+1)*4*3);
const idx=[];
const P=new THREE.Vector3(),T=new THREE.Vector3(),U=new THREE.Vector3();
for(let i=0;i<=M;i++){
const u=i/M;
curve.getPointAt(u,P);
curve.getTangentAt(u,T);
U.set(-T.y,T.x,0).normalize();
const bx=P.x+U.x*(HT+0.03),by=P.y+U.y*(HT+0.03);
const o=i*4;
pos[o*3]=bx;pos[o*3+1]=by;pos[o*3+2]=HW-0.03;
pos[o*3+3]=bx;pos[o*3+4]=by;pos[o*3+5]=HW-0.36;
pos[o*3+6]=bx;pos[o*3+7]=by;pos[o*3+8]=-HW+0.36;
pos[o*3+9]=bx;pos[o*3+10]=by;pos[o*3+11]=-HW+0.03;
}
for(let i=0;i<M;i++){
const a=i*4,b=i*4+1,c=(i+1)*4+1,d=(i+1)*4;
idx.push(a,b,c,a,c,d);
const e=i*4+2,f=i*4+3,g=(i+1)*4+3,h=(i+1)*4+2;
idx.push(e,f,g,e,g,h);
}
const g=new THREE.BufferGeometry();
g.setAttribute('position',new THREE.BufferAttribute(pos,3));
g.setIndex(idx);
g.computeVertexNormals();
return g;
}
const edgeMat=new THREE.MeshBasicMaterial({color:0xff2438,toneMapped:false,side:THREE.DoubleSide});
const edges=new THREE.Mesh(buildEdges(),edgeMat);
scene.add(edges);

const strutMat=new THREE.MeshStandardMaterial({color:0x93a2b6,metalness:0.88,roughness:0.34});
const strutGeo=new THREE.CylinderGeometry(1,1,1,6,1,false);
const struts=new THREE.Group();
scene.add(struts);
const UPY=new THREE.Vector3(0,1,0);
function beam(ax,ay,az,bx,by,bz,r){
const dx=bx-ax,dy=by-ay,dz=bz-az;
const len=Math.sqrt(dx*dx+dy*dy+dz*dz);
if(len<0.01)return;
const m=new THREE.Mesh(strutGeo,strutMat);
m.position.set(ax+dx*0.5,ay+dy*0.5,az+dz*0.5);
const dir=new THREE.Vector3(dx/len,dy/len,dz/len);
m.quaternion.setFromUnitVectors(UPY,dir);
m.scale.set(r,len,r);
struts.add(m);
}
beam(0,0,3.5,0,R,3.5,0.24);
beam(0,0,-3.5,0,R,-3.5,0.24);
for(let k=0;k<=17;k++){
const a=0.42+ (THMAX-0.42)*k/17;
const px=R*Math.sin(a),py=R-R*Math.cos(a);
const ux=-Math.sin(a),uy=Math.cos(a);
const sx=px-ux*HT,sy=py-uy*HT;
if(sy<0.5)continue;
beam(0,R,3.45,sx,sy,2.85,0.13);
beam(0,R,-3.45,sx,sy,-2.85,0.13);
}

const car=new THREE.Group();
scene.add(car);
const bodyMat=new THREE.MeshStandardMaterial({color:0xe8eef7,metalness:0.72,roughness:0.2});
const darkMat=new THREE.MeshStandardMaterial({color:0x15181f,metalness:0.5,roughness:0.55});
const glassMat=new THREE.MeshStandardMaterial({color:0x0a1018,metalness:0.95,roughness:0.06});
const tailMat=new THREE.MeshBasicMaterial({color:0xff2a2a,toneMapped:false});
const headMat=new THREE.MeshBasicMaterial({color:0xdcebff,toneMapped:false});
const b1=new THREE.Mesh(new THREE.BoxGeometry(1.86,0.46,4.2),bodyMat);b1.position.y=0.63;car.add(b1);
const b2=new THREE.Mesh(new THREE.BoxGeometry(1.96,0.34,3.9),darkMat);b2.position.y=0.36;car.add(b2);
const b3=new THREE.Mesh(new THREE.BoxGeometry(1.5,0.44,1.9),glassMat);b3.position.set(0,1.02,-0.1);car.add(b3);
const wheelGeo=new THREE.CylinderGeometry(0.34,0.34,0.26,12);
wheelGeo.rotateZ(Math.PI/2);
const wpos=[[0.94,0.34,1.36],[-0.94,0.34,1.36],[0.94,0.34,-1.36],[-0.94,0.34,-1.36]];
for(let i=0;i<4;i++){
const w=new THREE.Mesh(wheelGeo,darkMat);
w.position.set(wpos[i][0],wpos[i][1],wpos[i][2]);
car.add(w);
}
const tl1=new THREE.Mesh(new THREE.BoxGeometry(0.62,0.1,0.06),tailMat);tl1.position.set(0.56,0.74,-2.12);car.add(tl1);
const tl2=new THREE.Mesh(new THREE.BoxGeometry(0.62,0.1,0.06),tailMat);tl2.position.set(-0.56,0.74,-2.12);car.add(tl2);
const hl1=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.09,0.06),headMat);hl1.position.set(0.6,0.72,2.12);car.add(hl1);
const hl2=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.09,0.06),headMat);hl2.position.set(-0.6,0.72,2.12);car.add(hl2);

const fTex=flameTex();
const coneGeo=new THREE.ConeGeometry(0.17,1,8,1,true);
const nozzles=[
{px:0.5,py:0.24,pz:1.5,dx:0,dy:-1,dz:0,k:0},
{px:-0.5,py:0.24,pz:1.5,dx:0,dy:-1,dz:0,k:0},
{px:0.5,py:0.24,pz:-1.5,dx:0,dy:-1,dz:0,k:0},
{px:-0.5,py:0.24,pz:-1.5,dx:0,dy:-1,dz:0,k:0},
{px:0.98,py:1.0,pz:0.9,dx:1,dy:0,dz:0,k:1},
{px:-0.98,py:1.0,pz:0.9,dx:-1,dy:0,dz:0,k:1},
{px:0.98,py:1.0,pz:-0.9,dx:1,dy:0,dz:0,k:1},
{px:-0.98,py:1.0,pz:-0.9,dx:-1,dy:0,dz:0,k:1}
];
const plumes=[];
const _nv=new THREE.Vector3();
for(let i=0;i<nozzles.length;i++){
const n=nozzles[i];
const mat=new THREE.MeshBasicMaterial({
map:fTex,transparent:true,opacity:0,depthWrite:false,
blending:THREE.AdditiveBlending,side:THREE.DoubleSide,toneMapped:false
});
const m=new THREE.Mesh(coneGeo,mat);
const dir=new THREE.Vector3(n.dx,n.dy,n.dz).normalize();
m.position.set(n.px+dir.x*0.5,n.py+dir.y*0.5,n.pz+dir.z*0.5);
_nv.copy(dir).negate();
m.quaternion.setFromUnitVectors(UPY,_nv);
m.visible=false;
car.add(m);
plumes.push({m:m,mat:mat,k:n.k,i:0,t:0});
}

const VN=200;
const vPos=new Float32Array(VN*3);
const vCol=new Float32Array(VN*3);
const vvx=new Float32Array(VN);
const vvy=new Float32Array(VN);
const vvz=new Float32Array(VN);
const vLife=new Float32Array(VN);
const vMax=new Float32Array(VN);
const vTint=new Float32Array(VN);
for(let i=0;i<VN;i++)vPos[i*3+1]=-1000;
const vGeo=new THREE.BufferGeometry();
vGeo.setAttribute('position',new THREE.BufferAttribute(vPos,3));
vGeo.setAttribute('color',new THREE.BufferAttribute(vCol,3));
const vaporMat=new THREE.PointsMaterial({
size:1.5,map:softTex(),vertexColors:true,transparent:true,
depthWrite:false,blending:THREE.AdditiveBlending,sizeAttenuation:true
});
const vapor=new THREE.Points(vGeo,vaporMat);
vapor.frustumCulled=false;
scene.add(vapor);
let vCur=0;
function spawnVapor(x,y,z,n,spread,up,tint){
for(let i=0;i<n;i++){
const k=vCur;vCur=(vCur+1)%VN;
const a=Math.random()*Math.PI*2;
const r=Math.random()*spread;
vvx[k]=Math.cos(a)*r;
vvz[k]=Math.sin(a)*r;
vvy[k]=Math.random()*up+0.4;
vPos[k*3]=x+Math.cos(a)*0.6;
vPos[k*3+1]=y+Math.random()*0.35;
vPos[k*3+2]=z+Math.sin(a)*0.6;
vLife[k]=1.0+Math.random()*0.9;
vMax[k]=vLife[k];
vTint[k]=tint?1:0;
}
}
function updateVapor(dt){
let any=false;
for(let i=0;i<VN;i++){
if(vLife[i]<=0)continue;
any=true;
vLife[i]-=dt;
if(vLife[i]<=0){
vLife[i]=0;
vCol[i*3]=0;vCol[i*3+1]=0;vCol[i*3+2]=0;
vPos[i*3+1]=-1000;
continue;
}
vvy[i]-=2.2*dt;
const d=1-1.5*dt;
vvx[i]*=d;vvz[i]*=d;vvy[i]*=1-0.9*dt;
vPos[i*3]+=vvx[i]*dt;
vPos[i*3+1]+=vvy[i]*dt;
vPos[i*3+2]+=vvz[i]*dt;
if(vPos[i*3+1]<0.06){vPos[i*3+1]=0.06;vvy[i]*=-0.14;}
const f=vLife[i]/vMax[i];
const b=f*f*0.85;
if(vTint[i]>0.5){vCol[i*3]=b*0.24;vCol[i*3+1]=b*0.66;vCol[i*3+2]=b*1.0;}
else{vCol[i*3]=b*0.74;vCol[i*3+1]=b*0.84;vCol[i*3+2]=b*1.0;}
}
if(any){
vGeo.attributes.position.needsUpdate=true;
vGeo.attributes.color.needsUpdate=true;
}
}

const lineup=new THREE.Group();
lineup.visible=false;
scene.add(lineup);
const lm=new THREE.MeshStandardMaterial({color:0x8d95a5,metalness:0.62,roughness:0.34});
const lm2=new THREE.MeshStandardMaterial({color:0x232830,metalness:0.5,roughness:0.52});
const lspecs=[
{x:-18,w:2.6,h:3.3,l:9.2,cab:2.4},
{x:-23,w:2.2,h:1.9,l:5.6,cab:1.6},
{x:-27.5,w:2.0,h:1.7,l:4.7,cab:1.5},
{x:-31.5,w:1.9,h:1.5,l:4.5,cab:1.4},
{x:-35.5,w:2.0,h:1.3,l:4.4,cab:1.2}
];
for(let i=0;i<lspecs.length;i++){
const s=lspecs[i];
const body=new THREE.Mesh(new THREE.BoxGeometry(s.w,s.h,s.l),lm);
body.position.set(s.x,s.h/2+0.35,0);
lineup.add(body);
const cab=new THREE.Mesh(new THREE.BoxGeometry(s.w*0.86,s.cab,s.l*0.42),lm2);
cab.position.set(s.x,s.h+0.35+s.cab/2-0.1,-s.l*0.06);
lineup.add(cab);
}

const _p=new THREE.Vector3(),_t=new THREE.Vector3(),_u=new THREE.Vector3(),_r=new THREE.Vector3();
const _m1=new THREE.Matrix4(),_q1=new THREE.Quaternion(),_q2=new THREE.Quaternion();
const _v1=new THREE.Vector3(),_v2=new THREE.Vector3(),_v3=new THREE.Vector3();
const _tq=new THREE.Vector3(),_acc=new THREE.Vector3();

const carPos=new THREE.Vector3();
const carQuat=new THREE.Quaternion();
const carUp=new THREE.Vector3(0,1,0);
const carFwd=new THREE.Vector3(0,0,1);
const vel=new THREE.Vector3();
const prevVel=new THREE.Vector3();
const angVel=new THREE.Vector3();

let state='constrained';
let s=0,u=0,speed=0,pitchDeg=0,downforce=0,gForce=0,gSmooth=0;
let mainThrust=0,attMag=0,throttle=0;
let released=false,rollAcc=0,kickDone=false,landTimer=0,time=0,hudT=0;
let auto=false,autoT=0,assist=true,camMode=0;
let perfLevel=2,perfAcc=0,perfFrames=0,perfChecked=false;
const orbit={a:0.9,p:0.36,r:26};
let dragging=false,lx=0,ly=0;

const keys={};

let best={hold:0,soft:0,kick:0,g:0,df:0};
try{const raw=localStorage.getItem('rr_best');if(raw){const o=JSON.parse(raw);if(o&&typeof o==='object')best=Object.assign(best,o);}}catch(e){}
function saveBest(){try{localStorage.setItem('rr_best',JSON.stringify(best));}catch(e){}}

function poseOnCurve(){
curve.getPointAt(u,_p);
curve.getTangentAt(u,_t);
_u.set(-_t.y,_t.x,0).normalize();
_r.crossVectors(_u,_t).normalize();
carPos.copy(_p).addScaledVector(_u,RIDE);
_m1.makeBasis(_r,_u,_t);
carQuat.setFromRotationMatrix(_m1);
car.position.copy(carPos);
car.quaternion.copy(carQuat);
}

function doRelease(){
if(state!=='constrained')return;
curve.getTangentAt(u,_t);
state='free';
released=true;
rollAcc=0;
kickDone=false;
autoT=0;
vel.copy(_t).multiplyScalar(speed);
vel.y+=0.4;
angVel.set(0,0,0);
prevVel.copy(vel);
}

function resetRun(){
state='constrained';
s=0;u=0;speed=0;
vel.set(0,0,0);prevVel.set(0,0,0);angVel.set(0,0,0);
mainThrust=0;attMag=0;rollAcc=0;released=false;kickDone=false;
autoT=0;landTimer=0;
poseOnCurve();
}

function attitudeTorque(out){
_v1.set(vel.x,0,vel.z);
if(_v1.lengthSq()<0.25){
carFwd.set(0,0,1).applyQuaternion(carQuat);
_v1.set(carFwd.x,0,carFwd.z);
}
if(_v1.lengthSq()<0.01)_v1.set(1,0,0);
_v1.normalize();
_v2.set(0,1,0).cross(_v1).normalize();
_v3.crossVectors(_v1,_v2).normalize();
_m1.makeBasis(_v2,_v3,_v1);
_q1.setFromRotationMatrix(_m1);
_q2.copy(carQuat).invert().premultiply(_q1);
let w=_q2.w;
if(w<0){_q2.x=-_q2.x;_q2.y=-_q2.y;_q2.z=-_q2.z;_q2.w=-_q2.w;w=-w;}
const sn=Math.sqrt(Math.max(0,1-w*w));
if(sn<1e-4){out.set(0,0,0);return;}
const ang=2*Math.acos(clamp(w,-1,1));
out.set(_q2.x/sn,_q2.y/sn,_q2.z/sn).multiplyScalar(ang*16);
out.addScaledVector(angVel,-7);
const l=out.length();
if(l>16)out.multiplyScalar(16/l);
}

function manualTorque(out){
out.set(
((keys.ArrowUp?1:0)-(keys.ArrowDown?1:0)),
0,
((keys.ArrowLeft?1:0)-(keys.ArrowRight?1:0))
);
if(out.lengthSq()>0)out.normalize().multiplyScalar(9);
}

function updateConstrained(dt){
curve.getTangentAt(u,_t);
speed+=(throttle*15-9.81*_t.y-0.7*speed)*dt;
speed=clamp(speed,-20,26);
s+=speed*dt;
let over=false;
if(s<0){s=0;if(speed<0)speed=0;}
if(s>CLEN){s=CLEN;over=true;}
u=s/CLEN;
poseOnCurve();
carUp.set(0,1,0).applyQuaternion(carQuat);
pitchDeg=Math.acos(clamp(carUp.y,-1,1))*180/Math.PI;
vel.copy(_t).multiplyScalar(speed);
downforce=4700*Math.min(1,Math.abs(speed)/22)*(0.15+0.85*smoothstep(50,165,pitchDeg));
if(over||(s>CLEN-0.35&&pitchDeg>100))doRelease();
}

function land(){
const impact=vel.y;
const upright=carUp.y;
state='landed';
landTimer=0;
spawnVapor(carPos.x,0.28,carPos.z,80,4.6,2.4,0);
if(impact>-5.0&&upright>0.55&&released){
const sc=Math.max(0,-impact);
if(best.soft===0||sc<best.soft){best.soft=sc;saveBest();swapPanel('c2');}
}
vel.set(0,0,0);
angVel.set(0,0,0);
mainThrust=0;
}

function updateFree(dt){
carUp.set(0,1,0).applyQuaternion(carQuat);
carFwd.set(0,0,1).applyQuaternion(carQuat);

if(assist)attitudeTorque(_tq);else manualTorque(_tq);
angVel.addScaledVector(_tq,dt);
angVel.multiplyScalar(Math.max(0,1-2.2*dt));

const w=angVel.length();
if(w>1e-5){
_v1.copy(angVel).multiplyScalar(1/w);
_q1.setFromAxisAngle(_v1,w*dt);
carQuat.premultiply(_q1).normalize();
}
attMag=Math.min(1,_tq.length()*0.07);

let mt=0;
if(assist){
const agl=carPos.y;
if(carUp.y>0.3&&vel.y<0.5&&agl<18){
const tv=-Math.max(0.8,agl*0.85);
mt=clamp((tv-vel.y)*0.22,0,1);
}
if(agl<0.4)mt=Math.max(mt,0.9);
}else{
mt=keys.Space?1:0;
}
mainThrust+=(mt-mainThrust)*Math.min(1,dt*10);

carUp.set(0,1,0).applyQuaternion(carQuat);
carFwd.set(0,0,1).applyQuaternion(carQuat);

vel.y-=9.81*dt;
vel.addScaledVector(carUp,mainThrust*30*dt);
vel.multiplyScalar(Math.max(0,1-0.05*dt));
carPos.addScaledVector(vel,dt);

rollAcc+=Math.abs(angVel.dot(carFwd))*dt;

if(lineup.visible&&!kickDone&&carPos.x<-17&&carPos.x>-38&&carPos.y>4.5&&rollAcc>6.28){
kickDone=true;
if(rollAcc>best.kick){best.kick=rollAcc;saveBest();}
spawnVapor(carPos.x,carPos.y-0.6,carPos.z,14,1.6,0.6,1);
swapPanel('c3');
}

car.position.copy(carPos);
car.quaternion.copy(carQuat);

if(carPos.y<=0.02){
carPos.y=0.02;
car.position.copy(carPos);
land();
}
}

function updateLanded(dt){
landTimer+=dt;
if(landTimer>1.7)resetRun();
}

function updatePlumes(dt){
for(let i=0;i<plumes.length;i++){
const p=plumes[i];
let target=0;
if(state==='free'||state==='landed'){
if(p.k===0)target=mainThrust;
else target=attMag;
}
p.t+=(target-p.t)*Math.min(1,dt*14);
if(p.t<0.015){
p.m.visible=false;
continue;
}
p.m.visible=true;
p.mat.opacity=Math.min(1,p.t*1.15);
p.m.scale.set(0.7+p.t*0.7,0.45+p.t*1.6,0.7+p.t*0.7);
}
}

function updateCamera(dt){
const k=1-Math.exp(-dt*4.5);
if(camMode===0){
_v1.set(carPos.x+11,carPos.y+5.6,carPos.z+15);
_v2.set(carPos.x,carPos.y+1.2,carPos.z);
}else if(camMode===1){
_v1.set(37,15.5,31);
_v2.set(-2,11,0);
}else{
const r=orbit.r;
_v1.set(
carPos.x+Math.sin(orbit.a)*Math.cos(orbit.p)*r,
carPos.y+Math.sin(orbit.p)*r,
carPos.z+Math.cos(orbit.a)*Math.cos(orbit.p)*r
);
_v2.set(carPos.x,carPos.y+0.8,carPos.z);
}
camera.position.lerp(_v1,k);
camLook.lerp(_v2,k);
camera.lookAt(camLook);
}

const g1=$('#g1'),g2=$('#g2'),g3=$('#g3'),g4=$('#g4');
const g1v=g1.querySelector('.v'),g2v=g2.querySelector('.v'),g3v=g3.querySelector('.v'),g4v=g4.querySelector('.v');
const stEl=$('#st'),silr=$('#silr');

function updateHud(dt){
hudT+=dt;
if(hudT<0.1)return;
hudT=0;
const altFt=carPos.y*3.28084;
g1v.textContent=String(Math.round(downforce));
g2v.textContent=String(Math.round(pitchDeg));
g3v.textContent=String(Math.round(altFt));
g4v.textContent=gSmooth.toFixed(1);
g1.style.setProperty('--p',clamp(downforce/5000,0,1).toFixed(3));
g2.style.setProperty('--p',clamp(pitchDeg/180,0,1).toFixed(3));
g3.style.setProperty('--p',clamp(altFt/75,0,1).toFixed(3));
g4.style.setProperty('--p',clamp(gSmooth/5,0,1).toFixed(3));
silr.style.transform='rotate('+(-pitchDeg).toFixed(1)+'deg)';
stEl.textContent=state==='constrained'?'CONSTRAINED':(state==='free'?'FREE FLIGHT':'LANDED');
}

function checkChallenges(dt){
if(state==='constrained'){
if(pitchDeg>158&&carPos.y>17&&downforce>3400){
holdT+=dt;
if(holdT>best.hold){best.hold=holdT;saveBest();}
}else holdT=0;
if(downforce>best.df){best.df=downforce;saveBest();}
}
if(gSmooth>best.g){best.g=gSmooth;saveBest();}
}
let holdT=0;

function frame(){
const now=performance.now();
let dt=(now-lastT)/1000;
lastT=now;
if(dt>0.05)dt=0.05;
if(dt<=0)dt=0.0001;
time+=dt;

throttle=0;
if(state==='constrained'){
throttle=((keys.KeyW||keys.ArrowUp)?1:0)-((keys.KeyS||keys.ArrowDown)?1:0);
if(auto){
if(pitchDeg>=165){throttle=0;autoT+=dt;if(autoT>1.4)doRelease();}
else{throttle=1;autoT=0;}
}
}

if(state==='constrained')updateConstrained(dt);
else if(state==='free')updateFree(dt);
else updateLanded(dt);

_acc.subVectors(prevVel,vel).multiplyScalar(1/dt);
const g=_acc.length()/9.81;
gSmooth+=(g-gSmooth)*Math.min(1,dt*6);
prevVel.copy(vel);

if(state==='constrained'&&Math.abs(speed)>6&&Math.random()<0.55){
spawnVapor(carPos.x,carPos.y+0.1,carPos.z,1,0.5,0.3,1);
}

updatePlumes(dt);
updateVapor(dt);
updateCamera(dt);
updateHud(dt);
checkChallenges(dt);

const pulse=0.5+0.5*Math.sin(time*2.6);
edgeMat.color.setRGB(0.65+0.35*pulse,0.05+0.05*pulse,0.09+0.07*pulse);
spot.intensity=150+70*pulse;

if(!perfChecked){
perfAcc+=dt;perfFrames++;
if(perfAcc>3){
const fps=perfFrames/perfAcc;
perfChecked=true;
if(fps<52){perfLevel=1;$('#vig').style.display='none';vaporMat.size=1.15;}
if(fps<36){perfLevel=0;vaporMat.size=0.9;struts.visible=false;}
}
}

renderer.render(scene,camera);
}
let lastT=performance.now();

const frags={
c1:()=>`<h4>INVERTED HOLD</h4><p>Hold over 158&deg; pitch above 17 m with 3400+ kg suction.</p><div class="big">${best.hold.toFixed(2)} s</div><div class="bar"><i style="width:${clamp(best.hold/5,0,1)*100}%"></i></div>`,
c2:()=>`<h4>SOFT LANDING</h4><p>Release at the apex, flip upright with thrusters, touch down under 5 m/s.</p><div class="big">${best.soft>0?best.soft.toFixed(2)+' m/s':'--'}</div><div class="bar"><i style="width:${best.soft>0?clamp(1-best.soft/5,0,1)*100:0}%"></i></div>`,
c3:()=>`<h4>KICKFLIP</h4><p>Enable the lineup, clear the row and complete a full 360&deg; roll.</p><div class="big">${best.kick>0?(best.kick*57.2958).toFixed(0)+'&deg;':'--'}</div><div class="bar"><i style="width:${clamp(best.kick/12.566,0,1)*100}%"></i></div>`,
c4:()=>`<h4>PEAK LOADS</h4><p>Maximum recorded suction and deceleration during a run.</p><div class="big">${Math.round(best.df)} kg</div><p style="margin-top:6px">Peak G &mdash; ${best.g.toFixed(2)} g</p><div class="bar"><i style="width:${clamp(best.g/6,0,1)*100}%"></i></div>`
};

function swapPanel(key){
const fn=frags[key];
if(!fn)return;
const html=fn();
const panel=$('#panel');
if(typeof htmx==='undefined'||!htmx||!htmx.ajax){panel.innerHTML=html;return;}
const url=URL.createObjectURL(new Blob([html],{type:'text/html'}));
const free=()=>setTimeout(()=>URL.revokeObjectURL(url),4000);
let p=null;
try{p=htmx.ajax('GET',url,{target:'#panel',swap:'innerHTML'});}catch(e){}
if(p&&typeof p.then==='function'){
p.then(free,()=>{panel.innerHTML=html;free();});
}else{
free();
}
}

document.querySelectorAll('#ch button').forEach(b=>{
b.addEventListener('click',()=>swapPanel(b.dataset.frag));
});

const actBtns=document.querySelectorAll('#ctrls button[data-act]');
actBtns.forEach(b=>{
b.addEventListener('click',()=>{
const a=b.dataset.act;
if(a==='demo'){auto=!auto;b.classList.toggle('on',auto);autoT=0;}
else if(a==='release'){doRelease();}
else if(a==='cam'){camMode=(camMode+1)%3;}
else if(a==='reset'){auto=false;document.querySelector('[data-act="demo"]').classList.remove('on');resetRun();}
else if(a==='assist'){assist=!assist;b.classList.toggle('on',!assist);b.textContent=assist?'ASSIST ON':'ASSIST OFF';}
else if(a==='lineup'){lineup.visible=!lineup.visible;b.classList.toggle('on',lineup.visible);b.textContent=lineup.visible?'LINEUP ON':'LINEUP OFF';}
});
});

addEventListener('keydown',e=>{
keys[e.code]=true;
if(e.code==='ArrowUp'||e.code==='ArrowDown'||e.code==='ArrowLeft'||e.code==='ArrowRight'||e.code==='Space')e.preventDefault();
if(e.code==='KeyC')camMode=(camMode+1)%3;
if(e.code==='KeyR'){auto=false;document.querySelector('[data-act="demo"]').classList.remove('on');resetRun();}
if(e.code==='KeyX')doRelease();
});
addEventListener('keyup',e=>{keys[e.code]=false;});

canvas.addEventListener('pointerdown',e=>{dragging=true;lx=e.clientX;ly=e.clientY;});
addEventListener('pointerup',()=>{dragging=false;});
addEventListener('pointermove',e=>{
if(!dragging)return;
orbit.a-=(e.clientX-lx)*0.006;
orbit.p=clamp(orbit.p+(e.clientY-ly)*0.005,-0.35,1.4);
lx=e.clientX;ly=e.clientY;
});
addEventListener('wheel',e=>{orbit.r=clamp(orbit.r+e.deltaY*0.02,6,110);},{passive:true});

addEventListener('resize',()=>{
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
});

async function loadEnv(){
try{
const loader=new RGBELoader();
const tex=await loader.loadAsync('https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/2k/moonless_golf_2k.hdr');
tex.mapping=THREE.EquirectangularReflectionMapping;
scene.environment=tex;
}catch(e){}
}

poseOnCurve();
resetRun();
swapPanel('c4');

let ok=true;
try{await renderer.init();}catch(e){ok=false;}
if(ok){
loadEnv();
renderer.setAnimationLoop(frame);
}
</script>
