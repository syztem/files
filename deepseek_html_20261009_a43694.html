<style>
:root{color-scheme:dark}
*{box-sizing:border-box;margin:0}

.bar{width:min(340px,62vw);height:1px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:14px}

.msg{font:400 11px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#5f6879;letter-spacing:.2em;min-height:1em}

.fine{font:400 10px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.24em;color:#79839a;text-transform:uppercase}
.gate{align-self:end;margin-bottom:max(9vh,40px)}
.gate .ttl,.gate .sub{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.play{pointer-events:none}
.hint{position:fixed;left:0;right:0;bottom:24px;animation:hint 3.4s ease forwards}

@media (prefers-reduced-motion:reduce){.st,.hint,.bar i{animation:none;transition:none}}

<script type="text/plain" id="wk">
class FR extends AudioWorkletProcessor {
  constructor(o) {
    super();
    const po = o.processorOptions;
    this.x = new WebAssembly.Instance(new WebAssembly.Module(po.b), {}).exports;
    this.x.s_init(sampleRate);
    this.bar = po.bar | 0;
    this.x.s_seek(this.bar);
    this.mx = this.x.s_max();
    this.p = this.x.s_out();
    this.n = 0;
    this.on = !!po.go;
    this.sent = false;
    this.port.onmessage = e => {
      if (e.data === "go") { this.x.s_seek(0); this.on = true; this.sent = false; }
      else if (e.data === "stop") { this.on = false; }
    };
  }
  views(n) {
    this.n = n;
    this.l = new Float32Array(this.x.memory.buffer, this.p, n);
    this.r = new Float32Array(this.x.memory.buffer, this.p + this.mx * 4, n);
  }
  process(i, o) {
    const out = o[0];
    if (!this.on || !out || !out[0]) return true;
    const L = out[0];
    const n = L.length;
    if (n !== this.n) this.views(n);
    if (!this.sent) { this.sent = true; this.port.postMessage(currentFrame); }
    this.x.s_render(n);
    L.set(this.l);
    if (out[1]) out[1].set(this.r);
    return true;
  }
}
registerProcessor("proc", FR);
</script>
<script type="text/plain" id="wm">
onmessage = e => {
  const x = new WebAssembly.Instance(e.data.m, {}).exports;
  for (const id of e.data.ids) {
    const nv = x.m_build(id);
    const ni = x.m_ni();
    const v = new Float32Array(x.memory.buffer, x.m_vp(), nv * 8).slice();
    const ix = new Uint32Array(x.memory.buffer, x.m_ip(), ni).slice();
    postMessage({ id, v, ix }, [v.buffer, ix.buffer]);
  }
};
</script>
<script type="text/plain" id="w-common">
struct F { vp: mat4x4f, ivp: mat4x4f, cam: vec4f, fog: vec4f, env: vec4f, sun: vec4f, sunc: vec4f, pl: vec4f, plc: vec4f, au: vec4f, au2: vec4f, res: vec4f, tint: vec4f, pp: vec4f, pp2: vec4f, pp3: vec4f, pc0: vec4f, pc1: vec4f }
struct D { m: mat4x4f, col: vec4f, mat: vec4f, def: vec4f, ins: vec4f, ext: vec4f, uvx: vec4f, aux: vec4f }
const TAU = 6.2831853;
const PI = 3.14159265;
fn h11(n: f32) -> f32 { return fract(sin(n * 127.1 + 311.7) * 43758.5453); }
fn hsv(h: f32) -> vec3f { return clamp(abs(fract(h + vec3f(0.0, 0.6667, 0.3333)) * 6.0 - 3.0) - 1.0, vec3f(0.0), vec3f(1.0)); }
fn rotY(a: f32) -> mat3x3f { let c = cos(a); let s = sin(a); return mat3x3f(vec3f(c, 0.0, -s), vec3f(0.0, 1.0, 0.0), vec3f(s, 0.0, c)); }
fn rotX(a: f32) -> mat3x3f { let c = cos(a); let s = sin(a); return mat3x3f(vec3f(1.0, 0.0, 0.0), vec3f(0.0, c, s), vec3f(0.0, -s, c)); }
</script>
<script type="text/plain" id="w-bind">
@group(0) @binding(0) var<uniform> f: F;
@group(0) @binding(1) var envT: texture_2d_array<f32>;
@group(0) @binding(2) var texA: texture_2d_array<f32>;
@group(0) @binding(3) var nrmA: texture_2d_array<f32>;
@group(0) @binding(4) var sL: sampler;
@group(0) @binding(5) var sR: sampler;
@group(0) @binding(6) var<storage, read> inst: array<vec4f>;
@group(0) @binding(7) var<storage, read> seg: array<vec4f>;
@group(0) @binding(8) var<storage, read> parts: array<vec4f>;
@group(1) @binding(0) var<uniform> d: D;
fn envUV(r: vec3f) -> vec2f { return vec2f(atan2(r.z, r.x) * 0.15915494 + 0.5 + f.env.z, acos(clamp(r.y, -1.0, 1.0)) * 0.31830989); }
fn envS(r: vec3f, lod: f32) -> vec3f { return textureSampleLevel(envT, sL, envUV(r), i32(f.env.x), lod).rgb * f.env.y * f.tint.rgb; }
fn fogc(c: vec3f, wp: vec3f) -> vec3f { let dd = length(wp - f.cam.xyz); return mix(c, f.fog.rgb, 1.0 - exp(-dd * f.fog.w)); }
</script>
<script type="text/plain" id="w-mesh">
struct VO { @builtin(position) pos: vec4f, @location(0) wp: vec3f, @location(1) n: vec3f, @location(2) uv: vec2f, @location(3) @interpolate(flat) h: f32 }
fn disp(p: vec3f) -> f32 {
  let t = f.res.w * d.def.w;
  let q = p * d.def.z;
  let a = sin(q.x + t) * sin(q.y * 1.3 - t * 1.1) * sin(q.z * 0.9 + t * 0.7);
  let b = sin(q.y * 2.3 + t * 1.7 + q.x) * cos(q.z * 1.7 - t * 0.9);
  return d.def.y * (a + 0.35 * b) * (1.0 + 1.6 * f.au.x * d.aux.x);
}
@vertex fn vs(@location(0) p: vec3f, @location(1) n: vec3f, @location(2) uv: vec2f, @builtin(instance_index) ii: u32) -> VO {
  var lp = p;
  var ln = n;
  let dm = i32(d.def.x);
  if (dm == 1) {
    let up = select(vec3f(0.0, 1.0, 0.0), vec3f(1.0, 0.0, 0.0), abs(n.y) > 0.9);
    let t1 = normalize(cross(n, up));
    let t2 = cross(n, t1);
    let e = 0.012;
    let p0 = n * (1.0 + disp(n));
    let pa = normalize(n + t1 * e);
    let pb = normalize(n + t2 * e);
    let p1 = pa * (1.0 + disp(pa));
    let p2 = pb * (1.0 + disp(pb));
    lp = p0;
    ln = normalize(cross(p1 - p0, p2 - p0));
    if (dot(ln, n) < 0.0) { ln = -ln; }
  } else if (dm == 2) {
    let r = rotY(lp.y * d.def.y * sin(f.res.w * d.def.w));
    lp = r * lp;
    ln = r * ln;
  }
  var off = vec3f(0.0);
  var sc = vec3f(1.0);
  var R = mat3x3f(vec3f(1.0, 0.0, 0.0), vec3f(0.0, 1.0, 0.0), vec3f(0.0, 0.0, 1.0));
  var hue = 0.0;
  let im = i32(d.ins.y);
  let k = f32(ii);
  let t = f.res.w;
  if (im == 1) {
    let b = u32(d.ins.x) + ii * 2u;
    let a0 = inst[b];
    let a1 = inst[b + 1u];
    off = a0.xyz;
    hue = a0.w;
    sc = a1.xyz;
    R = rotY(a1.w);
  } else if (im == 2) {
    let cnt = d.ins.z;
    let ang = k / cnt * TAU + t * d.ins.w;
    let rad = d.ext.x * (1.0 + 0.06 * sin(k * 2.0 + t * 3.0));
    off = vec3f(cos(ang) * rad, sin(k * 0.73 + t * 1.3) * d.ext.y, sin(ang) * rad);
    R = rotY(-ang) * rotX(t * 1.7 * d.ext.w + k);
    sc = vec3f(d.ext.z * (1.0 + 0.45 * f.au.x * d.aux.x * step(0.5, fract(k * 0.5))));
    hue = k / cnt;
  } else if (im == 3) {
    let hh = vec3f(h11(k), h11(k + 17.0), h11(k + 41.0));
    let span = d.ext.x;
    var z = hh.z * span + t * d.ext.y;
    z = z - floor(z / span) * span;
    off = vec3f((hh.x - 0.5) * d.ext.z, (hh.y - 0.5) * d.ext.z * 0.5 + d.ext.z * 0.25, z - span * 0.85);
    R = rotY(t * (hh.x - 0.5) * 2.0 + k) * rotX(t * (hh.y - 0.5) * 2.0 + k * 0.3);
    sc = vec3f(d.ext.w * (0.4 + hh.x));
    hue = hh.y;
  }
  let lw = R * (lp * sc) + off;
  let wp = (d.m * vec4f(lw, 1.0)).xyz;
  let wn = normalize((d.m * vec4f(R * (ln / sc), 0.0)).xyz);
  var o: VO;
  o.pos = f.vp * vec4f(wp, 1.0);
  o.wp = wp;
  o.n = wn;
  o.uv = uv;
  o.h = hue;
  return o;
}
@fragment fn fs(v: VO, @builtin(front_facing) ff: bool) -> @location(0) vec4f {
  let N0 = normalize(v.n);
  var uv = v.uv;
  if (d.aux.w > 0.5) {
    uv = select(vec2f(select(v.wp.x, v.wp.z, abs(N0.x) > 0.5), v.wp.y), v.wp.xz, abs(N0.y) > 0.5);
  }
  uv = uv * d.uvx.x + vec2f(d.uvx.y, d.uvx.z) * f.res.w;
  let gx = dpdx(uv);
  let gy = dpdy(uv);
  let px = dpdx(v.wp);
  let py = dpdy(v.wp);
  var N = N0;
  if (!ff) { N = -N; }
  let V = normalize(f.cam.xyz - v.wp);
  let mode = i32(d.mat.x);
  let L = normalize(f.sun.xyz);
  let li = i32(d.mat.z);
  var tx = vec4f(1.0);
  var nm = vec3f(0.0, 0.0, 1.0);
  if (li >= 0) {
    tx = textureSampleGrad(texA, sR, uv, li, gx, gy);
    nm = textureSampleGrad(nrmA, sR, uv, li, gx, gy).xyz * 2.0 - 1.0;
  }
  let dp2p = cross(py, N);
  let dp1p = cross(N, px);
  let T = dp2p * gx.x + dp1p * gy.x;
  let B = dp2p * gx.y + dp1p * gy.y;
  let im = inverseSqrt(max(max(dot(T, T), dot(B, B)), 1e-20));
  let TBN = mat3x3f(T * im, B * im, N);
  var Nn = N;
  if (li >= 0 && d.aux.y > 0.0) { Nn = normalize(TBN * vec3f(nm.xy * d.aux.y, max(nm.z, 0.05))); }
  let ndv = max(dot(Nn, V), 0.0);
  let fr = pow(1.0 - ndv, 5.0);
  let pal = mix(vec3f(1.0), 0.35 + 1.2 * hsv(v.h * 0.35 + f.tint.w), step(0.001, d.uvx.w) * d.uvx.w);
  let base = d.col.rgb * pal;
  let pulse = 1.0 + d.aux.x * f.au.x;
  let Hs = normalize(L + V);
  let plv = f.pl.xyz - v.wp;
  let pld = length(plv);
  let pll = plv / max(pld, 1e-4);
  let plA = 1.0 / (1.0 + (pld * pld) / (f.pl.w * f.pl.w));
  let Hp = normalize(pll + V);
  var c = vec3f(0.0);
  if (mode == 0) {
    let R = reflect(-V, Nn);
    let e = envS(R, d.mat.y * 7.0);
    let fres = 0.55 + 0.45 * fr;
    let tm = mix(vec3f(1.0), tx.rgb, d.aux.z);
    c = e * base * tm * fres;
    c += f.sunc.rgb * pow(max(dot(Nn, Hs), 0.0), 160.0) * 3.0 * base;
    c += f.plc.rgb * plA * pow(max(dot(Nn, Hp), 0.0), 90.0) * 3.0;
    c += base * d.mat.w * pulse;
  } else if (mode == 1) {
    let alb = base * tx.rgb;
    let amb = envS(Nn, 8.0) * 0.6;
    let dif = max(dot(Nn, L), 0.0) * f.sunc.rgb;
    let pdf = max(dot(Nn, pll), 0.0) * plA * f.plc.rgb;
    let R = reflect(-V, Nn);
    c = alb * (amb + dif + pdf) + envS(R, 4.0) * (0.04 + 0.6 * fr) * d.mat.y;
    let wc = mix(vec3f(1.0, 0.68, 0.38), vec3f(0.55, 0.8, 1.0), step(0.6, fract(v.h * 13.0 + floor(uv.y * 3.0) * 0.37)));
    c += wc * tx.a * d.mat.w * (0.85 + 0.15 * pulse);
  } else if (mode == 2) {
    c = base * d.col.a * pulse;
  } else if (mode == 3) {
    let alb = base * tx.rgb;
    let amb = envS(Nn, 7.0) * 0.25;
    let pdf = max(dot(Nn, pll), 0.0) * plA * f.plc.rgb;
    let psp = pow(max(dot(Nn, Hp), 0.0), 60.0) * plA * f.plc.rgb * d.mat.y;
    let R = reflect(-V, Nn);
    c = alb * (amb + pdf) + psp + envS(R, 3.0) * 0.15 * fr;
    let qq = v.uv * vec2f(12.0, 32.0);
    let q = fract(qq);
    let fw = max(fwidth(qq), vec2f(1e-4));
    let band = (1.0 - smoothstep(0.012, 0.03 + fw.y, abs(q.y - 0.55))) * (1.0 - smoothstep(0.35, 0.45 + fw.x, abs(q.x - 0.5))) * clamp(0.04 / fw.y, 0.0, 1.0);
    let chase = 0.35 + 0.65 * pow(0.5 + 0.5 * sin(v.wp.z * 0.35 + f.res.w * 9.0), 4.0);
    c += d.ext.rgb * band * d.aux.z * chase * pulse;
  } else {
    let Rf = reflect(-V, vec3f(0.0, 1.0, 0.0));
    let e = envS(Rf, 2.5) * (0.05 + 0.55 * fr);
    c = tx.rgb * envS(vec3f(0.0, 1.0, 0.0), 9.0) * 0.4 + e + base * tx.a * d.col.a * pulse;
  }
  c = fogc(c, v.wp);
  return vec4f(c, 1.0);
}
</script>
<script type="text/plain" id="w-sky">
struct SO { @builtin(position) p: vec4f, @location(0) q: vec2f }
@vertex fn vs(@builtin(vertex_index) i: u32) -> SO {
  var o: SO;
  let x = f32(i32(i & 1u) * 4 - 1);
  let y = f32(i32(i >> 1u) * 4 - 1);
  o.p = vec4f(x, y, 1.0, 1.0);
  o.q = vec2f(x, y);
  return o;
}
fn h3(p: vec3f) -> f32 { var q = fract(p * 0.1031); q += dot(q, q.zyx + 31.32); return fract((q.x + q.y) * q.z); }
fn stars(dir: vec3f, sc: f32) -> vec3f {
  let p = dir * sc;
  let ip = floor(p);
  var c = vec3f(0.0);
  for (var z = 0; z < 2; z++) { for (var y = 0; y < 2; y++) { for (var x = 0; x < 2; x++) {

@group(0) @binding(0) var<uniform> f: F;
@group(0) @binding(1) var<storage, read_write> P: array<vec4f>;

fn fld(p: vec3f, t: f32) -> vec3f {

  p = vec4f(p.xyz + v.xyz * dt, p.w);

  P[i * 2u + 1u] = v;

<script type="text/plain" id="w-noise">
const TAU = 6.2831853;
const PI = 3.14159265;
fn h2(p: vec2f) -> f32 { var p3 = fract(vec3f(p.x, p.y, p.x) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
fn wrapv(i: vec2f, per: vec2f) -> vec2f { return i - per * floor(i / per); }
fn vn(uv: vec2f, per: vec2f, sd: f32) -> f32 {
  let p = uv * per;
  let i = floor(p);
  let ff = fract(p);
  let u = ff * ff * (3.0 - 2.0 * ff);
  let o = sd * 37.0;
  let a = h2(wrapv(i, per) + o);
  let b = h2(wrapv(i + vec2f(1.0, 0.0), per) + o);
  let c = h2(wrapv(i + vec2f(0.0, 1.0), per) + o);
  let e = h2(wrapv(i + vec2f(1.0, 1.0), per) + o);
  return mix(mix(a, b, u.x), mix(c, e, u.x), u.y);
}
fn fbm(uv: vec2f, per: vec2f, oct: i32, sd: f32) -> f32 {
  var s = 0.0;
  var a = 0.5;
  var n = 0.0;
  var q = per;
  for (var k = 0; k < 10; k++) {
    if (k >= oct) { break; }
    s += a * vn(uv, q, sd + f32(k) * 1.618);
    n += a;
    a *= 0.5;
    q *= 2.0;
  }
  return s / n;
}
fn cells(uv: vec2f, per: f32, sd: f32) -> vec4f {
  let p = uv * per;
  let i = floor(p);
  let ff = fract(p);
  var f1 = 9.0;
  var f2 = 9.0;
  var id = 0.0;
  for (var y = -1; y <= 1; y++) {
    for (var x = -1; x <= 1; x++) {
      let o = vec2f(f32(x), f32(y));
      let cid = wrapv(i + o, vec2f(per));
      let r = vec2f(h2(cid + sd), h2(cid + sd + 19.19));

    }

  return vec4f(f1, f2 - f1, id, f2);
}

struct TU { layer: u32, start: u32, count: u32, size: u32 }

      case 6: { sp--; st[sp - 1] = st[sp - 1] * st[sp]; }

  const url = URL.createObjectURL(new Blob([src("wk")], { type: "text/javascript" }));
  await actx.audioWorklet.addModule(url);
  URL.revokeObjectURL(url);
  node = new AudioWorkletNode(actx, "proc", { numberOfInputs: 0, numberOfOutputs: 1, outputChannelCount: [2], processorOptions: { b: BYTES.buffer.slice(0), bar: 0, go: false } });
  node.port.onmessage = e => { t0 = e.data / actx.sampleRate; };
  node.connect(actx.destination);
}
function begin() {
  if (!ready || playing) return;
  if (!actx) actx = new AudioContext({ latencyHint: "playback" });
  actx.resume();
  const el = HT;
  if (el.requestFullscreen && !document.fullscreenElement) el.requestFullscreen({ navigationUI: "hide" }).catch(() => {});
  playing = true;
  phase = "play";
  t0 = -1;
  quitting = false;
  resetParts();
  ensureAudio().then(() => node.port.postMessage("go")).catch(() => { t0 = actx.currentTime; });
  if (!window.htmx) { shell.innerHTML = VIEW.play(); sync(); }
  loop();
}
function finish() {
  if (!playing) return;
  playing = false;
  if (node) node.port.postMessage("stop");
  if (actx) actx.suspend();
  if (document.fullscreenElement) { quitting = true; document.exitFullscreen().catch(() => {}); }
  next("end");
}
document.addEventListener("click", e => { if (e.target.closest && e.target.closest("[data-go]")) begin(); }, true);
addEventListener("keydown", e => { if (e.key === "Escape" && playing) finish(); });
document.addEventListener("fullscreenchange", () => { if (!document.fullscreenElement && playing && !quitting) finish(); quitting = false; });
function onState(s) {
  HT.dataset.phase = s;
  if (s === "gate") { phase = "gate"; gate0 = performance.now(); loop(); const b = shell.querySelector(".go"); if (b) b.focus({ preventScroll: true }); }
  else if (s === "play") { phase = "play"; loop(); }
  else if (s === "end") { phase = "end"; const b = shell.querySelector(".go"); if (b) b.focus({ preventScroll: true }); }
  else phase = s;
}

async function boot() {
  if (!navigator.gpu) return next("nogpu");
  const ad = await navigator.gpu.requestAdapter({ powerPreference: "high-performance" });
  if (!ad) return next("nogpu");
  dev = await ad.requestDevice();
  dev.lost.then(() => { if (phase !== "nogpu") { playing = false; next("fail"); } });
  gctx = cv.getContext("webgpu");
  fmt = navigator.gpu.getPreferredCanvasFormat();
  gctx.configure({ device: dev, format: fmt, alphaMode: "opaque" });
  prog(0.04, "compiling wasm");
  BYTES = Uint8Array.from(atob(src("wasm").replace(/\s+/g, "").replace(/-/g, "+").replace(/_/g, "/")), c => c.charCodeAt(0));
  const wm = await WebAssembly.compile(BYTES);
  X = (await WebAssembly.instantiate(wm, {})).exports;
  SONG = X.song_secs();
  prog(0.1, "building meshes");
  const meshP = buildMeshes(wm);
  sLin = dev.createSampler({ magFilter: "linear", minFilter: "linear", mipmapFilter: "linear", addressModeU: "repeat", addressModeV: "clamp-to-edge" });
  const sRep = dev.createSampler({ magFilter: "linear", minFilter: "linear", mipmapFilter: "linear", addressModeU: "repeat", addressModeV: "repeat", maxAnisotropy: 8 });
  sClamp = dev.createSampler({ magFilter: "linear", minFilter: "linear", addressModeU: "clamp-to-edge", addressModeV: "clamp-to-edge" });
  const ms = await meshP;
  prog(0.32, "uploading geometry");
  let nv = 0, ni = 0;
  for (const m of ms) { nv += m.v.length / 8; ni += m.ix.length; }
  const va = new Float32Array(nv * 8), ia = new Uint32Array(ni);
  nv = 0; ni = 0;
  for (let id = 0; id < ms.length; id++) {
    const m = ms[id];
    va.set(m.v, nv * 8); ia.set(m.ix, ni);
    MESH[id] = { f: ni, n: m.ix.length, b: nv };
    nv += m.v.length / 8; ni += m.ix.length;
  }
  VB = dev.createBuffer({ size: va.byteLength, usage: U.VERTEX | U.COPY_DST });
  dev.queue.writeBuffer(VB, 0, va);
  IB = dev.createBuffer({ size: ia.byteLength, usage: U.INDEX | U.COPY_DST });
  dev.queue.writeBuffer(IB, 0, ia);
  const cc = X.c_build(1);
  CITY = { nt: cc & 0xffff, nb: cc >>> 16 };
  const ci = new Float32Array(X.memory.buffer, X.c_ptr(), (CITY.nt + CITY.nb) * 8).slice();
  INSTB = dev.createBuffer({ size: Math.max(64, ci.byteLength), usage: U.STORAGE | U.COPY_DST });
  dev.queue.writeBuffer(INSTB, 0, ci);
  for (const [tw, bx] of [[towersA, boxesA], [towersB, boxesB]]) {
    tw.n = CITY.nt; s4(tw.s, O.ins, 0, 1, CITY.nt, 0);
    bx.n = CITY.nb; s4(bx.s, O.ins, CITY.nt * 2, 1, CITY.nb, 0);
  }
  const sg = new Float32Array(SEGS);
  SEGB = dev.createBuffer({ size: sg.byteLength, usage: U.STORAGE | U.COPY_DST });
  dev.queue.writeBuffer(SEGB, 0, sg);
  PINIT = new Float32Array(NP * 8);
  for (let i = 0; i < NP; i++) {
    const a = Math.random() * Math.PI * 2, r = 1 + Math.pow(Math.random(), 0.7) * 9;
    PINIT[i * 8] = Math.cos(a) * r; PINIT[i * 8 + 1] = (Math.random() - 0.5) * 0.6; PINIT[i * 8 + 2] = Math.sin(a) * r; PINIT[i * 8 + 3] = 1;
    PINIT[i * 8 + 7] = Math.random();
  }
  PARTB = dev.createBuffer({ size: PINIT.byteLength, usage: U.STORAGE | U.COPY_DST });
  resetParts();
  FUB = dev.createBuffer({ size: FU.byteLength, usage: U.UNIFORM | U.COPY_DST });
  DUB = dev.createBuffer({ size: DUF.byteLength, usage: U.UNIFORM | U.COPY_DST });
  PUB = dev.createBuffer({ size: PUF.byteLength, usage: U.UNIFORM | U.COPY_DST });
  await genTextures();
  prog(0.78, "compiling shaders");
  await pipelines();
  const av = t => t.createView({ dimension: "2d-array" });
  BG0 = dev.createBindGroup({ layout: BGL0, entries: [
    { binding: 0, resource: { buffer: FUB } }, { binding: 1, resource: av(envT) }, { binding: 2, resource: av(texA) }, { binding: 3, resource: av(nrmA) },
    { binding: 4, resource: sLin }, { binding: 5, resource: sRep }, { binding: 6, resource: { buffer: INSTB } }, { binding: 7, resource: { buffer: SEGB } }, { binding: 8, resource: { buffer: PARTB } }
  ] });
  BGD = dev.createBindGroup({ layout: BGL1, entries: [{ binding: 0, resource: { buffer: DUB, size: 176 } }] });
  BGSIM = dev.createBindGroup({ layout: PSIM.getBindGroupLayout(0), entries: [{ binding: 0, resource: { buffer: FUB } }, { binding: 1, resource: { buffer: PARTB } }, { binding: 2, resource: { buffer: SEGB } }] });
  prog(0.9, "warming up every scene");
  for (let i = 0; i < SC.length; i++) {
    draw((SC[i].from + 0.5) * BAR, 1 / 60);
    await done();
    prog(0.9 + 0.1 * (i + 1) / SC.length, "warming up every scene");
  }
  resetParts();
  ready = true;
  prog(1, "ready");
  next("gate");
}
boot().catch(() => next("fail"));
