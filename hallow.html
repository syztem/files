if(t<16){const b=Math.floor(t/2);word=MON[b];const u=t-b*2;sc=12+kick*60+Math.exp(-u*5)*90+(t>14.6?Math.pow((t-14.6)/1.4,2)*500:0);bf=0.004+0.02*Math.abs(Math.sin(t*0.4));col=b%2?'#e8e0cf':'#ff2034';sz=b==4||b==6?11:14}
else if(t<20){word='IT WAS ALWAYS YOU';const u=t-16;sc=Math.max(0,8-u*8)+Math.sin(t*3)*2;bf=0.01;mir=1-ss(18,19,t);sz=7.4}
else if(t<28){const ws=['YOU','WERE','NEVER','ALONE'];word=ws[Math.min(3,Math.floor((t-20)/2))];sc=10+kick*60;bf=0.006+0.004*Math.sin(t);sz=16}
else{word='HALLOW';const u=t-28;sc=Math.max(0,300*Math.exp(-u*5))+6;bf=0.008;col='#ff0a1e';sz=18;blur=u>2.6?(u-2.6)*6:0}
if(word!==cw){cw=word;w.textContent=word}
mt.setAttribute('baseFrequency',(bf).toFixed(4)+' '+(bf*3.2).toFixed(4));md.setAttribute('scale',sc.toFixed(1));mb.setAttribute('stdDeviation',blur.toFixed(2));
w.style.fontSize=sz+'vw';w.style.color=col;
w.style.transform=`translate(-50%,-50%) perspective(1200px) rotateY(${(mir*180).toFixed(1)}deg) scale(${1+kick*0.04})`;
w.style.textShadow=col==='#e8e0cf'?'0 0 .08em rgba(255,255,255,.35)':'0 0 .12em rgba(255,0,20,.6)';
const bo=t<16?0.18+kick*0.2:t<20?0.0:t<28?0.55:0.0;bg.style.opacity=bo.toFixed(3);
bt.setAttribute('baseFrequency',(0.01+0.004*Math.sin(t*0.7)).toFixed(4)+' '+(0.06+0.02*Math.sin(t*0.5)).toFixed(4));bd.setAttribute('scale',(30+kick*80).toFixed(0));
$('#s8').style.background=t>=16&&t<20?`radial-gradient(ellipse 34vw 42vh at 50% 50%,#1b1d22 0%,#0a0b0e 70%,#000 71%,#000 100%)`:'#000';
$('#s8').style.opacity=t>=30.5?(1-ss(30.5,31.8,t)).toFixed(3):1}}})();

const SS=[S1,S2,S3,S4,S5,S6,S7,S8];
const els=['#s1','#s2','#s3','#s4','#s5','#s6','#s7','#s8'].map($);
const EB=new Float64Array(8);const BS=new SY(8000);
const fl=$('#fl'),ti=$('#ti'),tn=$('#tn'),tt=$('#tt'),wh=$('#wh');
const SCARE=[70,118,166,196];
const WH=[[13.0,'WAKE'],[41.0,'BEHIND'],[63.0,'CLOSER'],[89.0,'HELP ME'],[109.0,'TURN'],[133.0,'IT SEES'],[157.0,'HERE'],[179.0,'STAY']];
let cur=-1,lastWh='';
function frame(T){
const E=BS.bands(T,EB);
let ci=0;for(let i=0;i<8;i++)if(T>=SEG[i][0])ci=i;
if(ci!==cur){if(cur>=0)els[cur].style.visibility='hidden';cur=ci;els[ci].style.visibility='visible';SS[ci].reset();tn.textContent=ROM[ci];tt.textContent=SEG[ci][2]}
const t=T-SEG[ci][0];SS[ci].draw(t,T,E);
let f=0;for(const s of SCARE){const u=T-s;if(u>=0&&u<0.6)f=Math.max(f,Math.exp(-u*9))}
fl.style.opacity=f.toFixed(3);fl.style.background=f>0.5?'#fff':'#b00010';
DE.style.setProperty('--shake',f>0.05?((hs(Math.floor(T*30))-0.5)*40*f).toFixed(1)+'px':'0px');
let w='';for(const x of WH)if(T>=x[0]&&T<x[0]+0.067)w=x[1];
if(w!==lastWh){lastWh=w;wh.textContent=w;wh.style.display=w?'flex':'none'}
ti.style.opacity=(ss(0.4,1.0,t)*(1-ss(3.4,4.2,t))*0.9).toFixed(3);
DE.dataset.ch=ci}
async function boot(){
for(const s of SS){try{await s.init()}catch(e){FB.push('init-'+s.name)}}
if(!HOU)FB.push('no-paintworklet');if(!VT)FB.push('no-viewtransitions');if(!RP)FB.push('no-registerproperty');
DE.dataset.fallbacks=FB.join(',')||'none';
$('#cap').textContent=(HOU?'':'paint worklet unavailable: canvas fallback. ')+(VT?'':'view transitions unavailable: manual morph. ');
for(const e of els)e.style.visibility='hidden'}
let actx=null,node=null,t0=0,startPerf=0,silent=false;
async function startAudio(){
try{actx=new AudioContext({sampleRate:48000,latencyHint:'playback'});
const src=SYNSRC+`
class P extends AudioWorkletProcessor{constructor(){super();this.s=new Synth(sampleRate);this.f=0;this.go=false;this.end=Math.floor(sampleRate*this.s.LEN);this.port.onmessage=e=>{if(e.data==='go'){this.go=true;this.port.postMessage(currentTime)}}}
process(i,o){const L=o[0][0],R=o[0][1]||o[0][0];if(!this.go)return true;const n=L.length;
if(this.f<this.end){this.s.render(L,R,this.f,Math.min(n,this.end-this.f))}this.f+=n;return true}}
registerProcessor('hallow-synth',P);`;
await actx.audioWorklet.addModule(URL.createObjectURL(new Blob([src],{type:'text/javascript'})));
node=new AudioWorkletNode(actx,'hallow-synth',{numberOfInputs:0,outputChannelCount:[2]});node.connect(actx.destination);
await new Promise(r=>{node.port.onmessage=e=>{t0=e.data;r()};node.port.postMessage('go')});
await actx.resume();
}catch(e){silent=true;FB.push('audio-silent');DE.dataset.fallbacks=FB.join(',');startPerf=performance.now()}}
function clock(){return silent?(performance.now()-startPerf)/1000:actx.currentTime-t0}
function loop(){const T=clock();if(T>=END+0.3){DE.dataset.phase='end';if(actx)actx.suspend();$('#gate').style.display='flex';$('#go').textContent='AGAIN';return}
frame(Math.max(0,T));requestAnimationFrame(loop)}
if(RENDER){DE.classList.add('render');boot().then(()=>{window.__step=async T=>{frame(T);await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));return DE.dataset.ch};DE.dataset.phase='ready'})}
else{DE.dataset.phase='boot';boot().then(()=>{DE.dataset.phase='gate';$('#go').onclick=async()=>{$('#gate').style.display='none';if(cur>=0)els[cur].style.visibility='hidden';cur=-1;if(actx){try{await actx.close()}catch(e){}}actx=null;await startAudio();DE.dataset.phase='play';requestAnimationFrame(loop)}})}
</script>
