<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumina v3.0 // Personal OS</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
    <!-- GridStack CSS -->
    <link href="https://cdn.jsdelivr.net/npm/gridstack@10.1.2/dist/gridstack.min.css" rel="stylesheet"/>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* Pure Inky Black Foundation */
        body {
            background-color: #000000;
            color: #e2e8f0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            overflow-x: hidden;
        }

        /* Ultra-Premium Glassmorphism */
        .glass-card {
            background: rgba(10, 10, 12, 0.45);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 1rem;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .glass-card:hover {
            border-color: rgba(255, 255, 255, 0.12);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.02);
        }

        /* GridStack Custom Styling Override */
        .grid-stack-item-content {
            background: none !important;
            inset: 4px !important;
        }

        /* Custom Drag Handle Style */
        .drag-handle {
            cursor: grab;
        }
        .drag-handle:active {
            cursor: grabbing;
        }
    </style>
</head>
<body class="relative min-h-screen select-none">

    <!-- Three.js Ambient XMB Wave Canvas -->
    <div class="fixed inset-0 z-0 pointer-events-none overflow-hidden">
        <canvas id="xmb-wave-canvas" class="w-full h-full"></canvas>
    </div>

    <!-- Main Dashboard UI Layer -->
    <main class="relative z-10 max-w-[1800px] mx-auto px-6 py-6">
        
        <!-- Top Navigation Bar -->
        <header class="flex justify-between items-center mb-8 px-2">
            <div>
                <h1 class="text-xl font-light tracking-widest text-white/90">LUMINA <span class="text-xs font-bold bg-white/10 px-2 py-0.5 rounded ml-1 text-white/60">v3.0</span></h1>
                <p id="live-date" class="text-xs text-white/40 tracking-wider mt-0.5">FRIDAY, JULY 17, 2026</p>
            </div>
            <div class="flex gap-3">
                <button onclick="resetLayout()" class="glass-card px-3 py-1.5 text-xs text-white/60 hover:text-white flex items-center gap-2 cursor-pointer">
                    <i class="fa-solid fa-arrows-rotate"></i> Reset Grid
                </button>
            </div>
        </header>

        <!-- GridStack Grid Container -->
        <div class="grid-stack">
            <!-- Widgets will be dynamically managed/loaded here -->
        </div>

    </main>

    <!-- Core CDNs: Three.js and GridStack -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gridstack@10.1.2/dist/gridstack.all.js"></script>

    <script>
        // ==========================================
        // 1. DEFAULT DASHBOARD LAYOUT & DEFINITIONS
        // ==========================================
        const DEFAULT_LAYOUT = [
            { id: 'widget-clock', x: 0, y: 0, w: 4, h: 2, content: `
                <div class="glass-card p-6 h-full flex flex-col justify-between relative group">
                    <div class="flex justify-between items-start text-white/30 text-xs tracking-wider">
                        <span><i class="fa-regular fa-clock mr-1.5"></i>TIME</span>
                        <i class="fa-solid fa-grip-vertical drag-handle opacity-0 group-hover:opacity-100 transition-opacity p-1"></i>
                    </div>
                    <div class="my-auto">
                        <div id="clock-display" class="text-5xl font-extralight tracking-tight text-white/90">00:00:00</div>
                    </div>
                </div>` 
            },
            { id: 'widget-weather', x: 4, y: 0, w: 4, h: 2, content: `
                <div class="glass-card p-6 h-full flex flex-col justify-between relative group">
                    <div class="flex justify-between items-start text-white/30 text-xs tracking-wider">
                        <span><i class="fa-solid fa-cloud-sun mr-1.5"></i>ENVIRONMENT</span>
                        <i class="fa-solid fa-grip-vertical drag-handle opacity-0 group-hover:opacity-100 transition-opacity p-1"></i>
                    </div>
                    <div class="flex items-center justify-between mt-3">
                        <div>
                            <div class="text-4xl font-light text-white/90">72°F</div>
                            <div class="text-xs text-white/50 tracking-wide mt-1">Clear Sky • Los Angeles</div>
                        </div>
                        <i class="fa-solid fa-sun text-4xl text-amber-400/80 animate-pulse"></i>
                    </div>
                </div>` 
            },
            { id: 'widget-news', x: 8, y: 0, w: 4, h: 4, content: `
                <div class="glass-card p-6 h-full flex flex-col justify-between relative group">
                    <div class="flex justify-between items-start text-white/30 text-xs tracking-wider mb-3">
                        <span><i class="fa-solid fa-rss mr-1.5"></i>INTELLIGENCE FEED</span>
                        <i class="fa-solid fa-grip-vertical drag-handle opacity-0 group-hover:opacity-100 transition-opacity p-1"></i>
                    </div>
                    <div class="flex-1 overflow-y-auto space-y-3 pr-1 text-sm text-white/70">
                        <div class="border-b border-white/5 pb-2 hover:text-white transition-colors cursor-pointer">
                            <p class="font-light">Breakthrough in Ambient Computing Fabrics</p>
                            <span class="text-[10px] text-white/30">Hacker News • 12m ago</span>
                        </div>
                        <div class="border-b border-white/5 pb-2 hover:text-white transition-colors cursor-pointer">
                            <p class="font-light">Designing Interface Systems for Low-Power Displays</p>
                            <span class="text-[10px] text-white/30">TechCrunch • 2h ago</span>
                        </div>
                        <div class="hover:text-white transition-colors cursor-pointer">
                            <p class="font-light">The Philosophy of Quiet UX and Digital Sanctuaries</p>
                            <span class="text-[10px] text-white/30">Medium • 5h ago</span>
                        </div>
                    </div>
                </div>` 
            },
            { id: 'widget-sys', x: 0, y: 2, w: 8, h: 2, content: `
                <div class="glass-card p-6 h-full flex flex-col justify-between relative group">
                    <div class="flex justify-between items-start text-white/30 text-xs tracking-wider">
                        <span><i class="fa-solid fa-sliders mr-1.5"></i>V3.0 MATRIX TELEMETRY</span>
                        <i class="fa-solid fa-grip-vertical drag-handle opacity-0 group-hover:opacity-100 transition-opacity p-1"></i>
                    </div>
                    <div class="grid grid-cols-3 gap-4 my-auto text-center">
                        <div>
                            <div class="text-xs text-white/40 mb-1">GRID INTERACTIVE</div>
                            <div class="text-sm font-medium text-emerald-400">READY</div>
                        </div>
                        <div>
                            <div class="text-xs text-white/40 mb-1">VFX RENDERING</div>
                            <div class="text-sm font-medium text-cyan-400">WebGL 60FPS</div>
                        </div>
                        <div>
                            <div class="text-xs text-white/40 mb-1">LOCAL RUNTIME</div>
                            <div class="text-sm font-medium text-white/80">STANDALONE</div>
                        </div>
                    </div>
                </div>` 
            }
        ];

        // ==========================================
        // 2. GRIDSTACK INTERACTIVE ENGINE (WITH SAFARI/FIREFOX FIX)
        // ==========================================
        let grid;

        function initGrid() {
            grid = GridStack.init({
                cellHeight: 110,
                column: 12,
                margin: 0,
                handle: '.drag-handle',
                animate: true,
                float: true
            });

            let savedLayout = null;
            
            // SAFARI/FIREFOX FIX: Safely attempt to read localStorage
            try {
                savedLayout = localStorage.getItem('lumina_v3_layout');
            } catch (e) {
                console.warn("Local storage blocked by browser (normal for file:// in Safari/Firefox). Using default layout.");
            }

            const layoutData = savedLayout ? JSON.parse(savedLayout) : DEFAULT_LAYOUT;

            grid.removeAll();
            
            layoutData.forEach(w => {
                const widgetTemplate = layoutData === DEFAULT_LAYOUT ? w : DEFAULT_LAYOUT.find(d => d.id === w.id);
                if (widgetTemplate) {
                    grid.addWidget({
                        id: w.id,
                        x: w.x,
                        y: w.y,
                        w: w.w,
                        h: w.h,
                        content: widgetTemplate.content
                    });
                }
            });

            grid.on('change', function(event, items) {
                saveLayout();
            });
        }

        function saveLayout() {
            const items = grid.getGridItems().map(el => {
                const n = el.gridstackNode;
                return { id: n.id, x: n.x, y: n.y, w: n.w, h: n.h };
            });
            
            // SAFARI/FIREFOX FIX: Safely attempt to write to localStorage
            try {
                localStorage.setItem('lumina_v3_layout', JSON.stringify(items));
            } catch (e) {
                // Fails silently in Safari/Firefox on file:// paths
            }
        }

        function resetLayout() {
            try {
                localStorage.removeItem('lumina_v3_layout');
            } catch (e) {}
            initGrid();
        }

        // ==========================================
        // 3. THREE.JS PS3 XMB PARTICLE WAVE ENGINE
        // ==========================================
        let scene, camera, renderer, particleSystem;
        const particleCount = 2800;
        let isWindowActive = true;

        function initXMBWave() {
            const canvas = document.getElementById('xmb-wave-canvas');
            
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 40;

            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const opacities = new Float32Array(particleCount);
            const sizes = new Float32Array(particleCount);

            for (let i = 0; i < particleCount; i++) {
                const x = (i / particleCount) * 120 - 60; 
                positions[i * 3] = x;
                positions[i * 3 + 1] = 0; 
                positions[i * 3 + 2] = (Math.random() - 0.5) * 15; 

                const distanceFromCenter = Math.abs(x) / 60; 
                opacities[i] = Math.max(0.02, (1.0 - distanceFromCenter) * (0.15 + Math.random() * 0.4));
                sizes[i] = Math.random() * 1.5 + 0.5;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('alpha', new THREE.BufferAttribute(opacities, 1));

            const material = new THREE.ShaderMaterial({
                transparent: true,
                depthWrite: false,
                blending: THREE.AdditiveBlending,
                vertexShader: `
                    attribute float alpha;
                    varying float vAlpha;
                    void main() {
                        vAlpha = alpha;
                        vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                        gl_PointSize = (12.0 / -mvPosition.z);
                        gl_Position = projectionMatrix * mvPosition;
                    }
                `,
                fragmentShader: `
                    varying float vAlpha;
                    void main() {
                        float dist = length(gl_PointCoord - vec2(0.5, 0.5));
                        if (dist > 0.5) discard;
                        float intensity = 1.0 - (dist * 2.0);
                        gl_FragColor = vec4(0.75, 0.88, 1.0, vAlpha * intensity);
                    }
                `
            });

            particleSystem = new THREE.Points(geometry, material);
            scene.add(particleSystem);

            animateWave();
        }

        let clock = new THREE.Clock();

        function animateWave() {
            if (!isWindowActive) return; 
            
            requestAnimationFrame(animateWave);

            const elapsedTime = clock.getElapsedTime();
            const positions = particleSystem.geometry.attributes.position.array;

            for (let i = 0; i < particleCount; i++) {
                const idx = i * 3;
                const x = positions[idx];
                const z = positions[idx + 2];

                const wave1 = Math.sin(x * 0.08 + elapsedTime * 0.35) * 5.0;
                const wave2 = Math.cos(x * 0.18 - elapsedTime * 0.6) * 2.5;
                const wave3 = Math.sin(z * 0.15 + elapsedTime * 0.2) * 2.0;
                
                positions[idx + 1] = wave1 + wave2 + wave3;
            }

            particleSystem.geometry.attributes.position.needsUpdate = true;
            particleSystem.rotation.y = Math.sin(elapsedTime * 0.03) * 0.08;

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            if (!camera || !renderer) return;
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        document.addEventListener('visibilitychange', () => {
            isWindowActive = !document.hidden;
            if (isWindowActive) {
                clock.getDelta(); 
                animateWave();
            }
        });

        // ==========================================
        // 4. CORE UTILITIES & SYSTEM TICKERS
        // ==========================================
        function startSystemTickers() {
            function updateClock() {
                const now = new Date();
                const hours = String(now.getHours()).padStart(2, '0');
                const minutes = String(now.getMinutes()).padStart(2, '0');
                const seconds = String(now.getSeconds()).padStart(2, '0');
                
                const clockEl = document.getElementById('clock-display');
                if (clockEl) clockEl.textContent = `${hours}:${minutes}:${seconds}`;
                
                const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
                const dateEl = document.getElementById('live-date');
                if (dateEl) dateEl.textContent = now.toLocaleDateString('en-US', options).toUpperCase();
            }
            setInterval(updateClock, 1000);
            updateClock();
        }

        // Initialize execution setup sequence on load
        window.addEventListener('DOMContentLoaded', () => {
            initGrid();
            initXMBWave();
            startSystemTickers();
        });
    </script>
</body>
</html>
