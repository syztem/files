<style>

html,body{height:100%;background:#030407;overflow:hidden;overscroll-behavior:none}
body{color:rgb(var(--ink));font-family:var(--serif);-webkit-font-smoothing:antialiased;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;opacity:0;transition:opacity 2.4s ease}
html.live canvas{opacity:1}
.hello{position:fixed;inset:0;border:0;background:none;color:inherit;font:inherit;cursor:pointer;outline:none;-webkit-tap-highlight-color:transparent}
.cap{position:absolute;left:50%;bottom:max(8.5vh,calc(2.4rem + env(safe-area-inset-bottom)));display:flex;align-items:center;gap:1.15rem;white-space:nowrap;translate:-50% 0;animation:rise 1.8s cubic-bezier(.16,.84,.24,1) .45s both}
.name{font-style:italic;font-size:clamp(1rem,1.35vw,1.28rem);line-height:1;letter-spacing:.015em;color:rgba(var(--ink),.86);text-shadow:0 0 18px rgba(255,190,140,.25)}
.hello[data-face="n"] .name{font-style:normal}
.rule{width:clamp(2rem,4vw,3.4rem);height:1px;background:linear-gradient(90deg,rgba(var(--ink),0),rgba(var(--ink),.5),rgba(var(--ink),0))}
.idx{font:500 .64rem/1 ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:.34em;color:rgba(var(--ink),.4);font-variant-numeric:tabular-nums}
.hello:focus-visible .cap{outline:1px solid rgba(var(--ink),.35);outline-offset:.8rem;border-radius:2px}
.hint{position:fixed;left:50%;bottom:max(3.6vh,calc(1rem + env(safe-area-inset-bottom)));translate:-50% 0;font:500 .58rem/1 ui-sans-serif,-apple-system,"Helvetica Neue",Arial,sans-serif;letter-spacing:.46em;text-indent:.46em;text-transform:uppercase;color:rgba(var(--ink),.3);pointer-events:none;animation:fade 2.6s ease 3.2s both;transition:opacity 1.6s ease}
.hint b{font-weight:inherit}
.hint .t{display:none}
@media (hover:none){.hint .m{display:none}.hint .t{display:inline}}
html.met .hint{opacity:0}
.snd{position:fixed;top:max(1.6rem,calc(.9rem + env(safe-area-inset-top)));right:max(1.7rem,calc(1rem + env(safe-area-inset-right)));z-index:2;display:flex;align-items:center;gap:.6rem;padding:.6rem .2rem .6rem .7rem;border:0;background:none;color:rgba(var(--ink),.34);font:500 .56rem/1 ui-sans-serif,-apple-system,"Helvetica Neue",Arial,sans-serif;letter-spacing:.42em;text-transform:uppercase;cursor:pointer;outline:none;transition:color .8s ease;animation:fade 2.6s ease 3.6s both;-webkit-tap-highlight-color:transparent}
.snd.now{animation:none}
.snd:hover,.snd:focus-visible,.snd[aria-pressed="true"]{color:rgba(var(--ink),.7)}
.snd:focus-visible{outline:1px solid rgba(var(--ink),.3);outline-offset:.3rem;border-radius:2px}
.snd i{display:flex;align-items:flex-end;gap:2px;height:9px}
.snd i b{width:1px;height:3px;background:currentColor;transition:height .6s ease}
.snd[aria-pressed="true"] i b{animation:eq 2.2s ease-in-out infinite alternate}
.snd i b:nth-child(2){animation-delay:-.7s!important}.snd i b:nth-child(3){animation-delay:-1.5s!important}
@keyframes eq{0%{height:2px}100%{height:9px}}

.ink::after{content:"";display:inline-block;width:1px;height:1em;margin-left:.15em;vertical-align:-.15em;background:currentColor;animation:caret 1.1s steps(1) infinite}
html.typing .ink{opacity:1}
html.typing .hint{opacity:0}
@keyframes caret{50%{opacity:0}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
@keyframes rise{from{opacity:0;translate:-50% .7rem;filter:blur(8px)}}

<body>
<main>
<h1 class="sr">hello, world</h1>
<button id="hello" class="hello" type="button" hx-get="hello/1" hx-trigger="click, every 11s" hx-swap="outerHTML" data-phrase="hello, world" data-lang="en" data-face="i" data-dir="ltr" data-i="0" data-tone="0" aria-label="hello, world. English. Next language"><span class="cap"><span class="name" lang="en">English</span><span class="rule"></span><span class="idx">01 / 24</span></span></button>
<button id="snd" class="snd" type="button" hx-get="sound/1" hx-swap="outerHTML" aria-pressed="false" aria-label="Sound off. Turn ambient sound on">sound<i aria-hidden="true"><b></b><b></b><b></b></i></button>
<p class="hint" aria-hidden="true"><b class="m">click · hold · press space</b><b class="t">tap · hold</b></p>
<p id="ink" class="ink" aria-hidden="true"></p>
<p id="said" class="sr" aria-live="polite"></p>
</main>
<script>
(() => {
  const L = [
    ["en", "English", "hello, world", "i"],
    ["fr", "Français", "bonjour, le monde", "i"],
    ["ja", "日本語", "こんにちは、世界", "n"],
    ["es", "Español", "hola, mundo", "i"],
    ["hi", "हिन्दी", "नमस्ते दुनिया", "n"],
    ["de", "Deutsch", "hallo, Welt", "i"],
    ["ar", "العربية", "مرحبا بالعالم", "n", "rtl"],
    ["it", "Italiano", "ciao, mondo", "i"],
    ["ru", "Русский", "привет, мир", "n"],
    ["pt", "Português", "olá, mundo", "i"],
    ["zh", "中文", "你好，世界", "n"],
    ["el", "Ελληνικά", "γειά σου, κόσμε", "n"],
    ["ko", "한국어", "안녕, 세상", "n"],
    ["tr", "Türkçe", "merhaba, dünya", "i"],
    ["he", "עברית", "שלום, עולם", "n", "rtl"],
    ["vi", "Tiếng Việt", "xin chào, thế giới", "i"],
    ["sw", "Kiswahili", "habari, dunia", "i"],
    ["haw", "ʻŌlelo Hawaiʻi", "aloha, honua", "i"],
    ["th", "ไทย", "สวัสดีชาวโลก", "n"],
    ["sv", "Svenska", "hej, världen", "i"],
    ["pl", "Polski", "witaj, świecie", "i"],
    ["ga", "Gaeilge", "dia duit, a dhomhain", "i"],
    ["uk", "Українська", "привіт, світе", "n"],
    ["fi", "Suomi", "hei, maailma", "i"]
  ];
  const still = matchMedia("(prefers-reduced-motion: reduce)");
  const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const trig = () => (still.matches ? "click" : "click, every 11s");
  const view = i => {
    const [lang, name, text, face, dir = "ltr"] = L[i];
    const n = String(i + 1).padStart(2, "0");
    return `<button id="hello" class="hello" type="button" hx-get="hello/${(i + 1) % L.length}" hx-trigger="${trig()}" hx-swap="outerHTML" data-phrase="${esc(text)}" data-lang="${lang}" data-face="${face}" data-dir="${dir}" data-i="${i}" data-tone="${((i * 0.618034) % 1).toFixed(3)}" aria-label="${esc(text)}. ${esc(name)}. Next language"><span class="cap"><span class="name" lang="${lang}" dir="${dir}">${esc(name)}</span><span class="rule"></span><span class="idx">${n} / ${L.length}</span></span></button>`;
  };
  const snd = on => `<button id="snd" class="snd now" type="button" hx-get="sound/${on ? 0 : 1}" hx-swap="outerHTML" aria-pressed="${on}" aria-label="Sound ${on ? "on" : "off"}. Turn ambient sound ${on ? "off" : "on"}">sound<i aria-hidden="true"><b></b><b></b><b></b></i></button>`;
  const mine = t => {
    const i = Number(document.getElementById("hello")?.dataset.i) || 0;
    const dir = /[\u0590-\u08ff]/.test(t) ? "rtl" : "ltr";
    const face = /^[\p{Script=Latin}\p{P}\p{N}\s]+$/u.test(t) ? "i" : "n";
    return `<button id="hello" class="hello" type="button" hx-get="hello/${(i + 1) % L.length}" hx-trigger="${trig()}" hx-swap="outerHTML" data-phrase="${esc(t)}" data-lang="x" data-face="${face}" data-dir="${dir}" data-i="${i}" data-tone="${Math.random().toFixed(3)}" aria-label="${esc(t)}. Yours. Next language"><span class="cap"><span class="name">yours</span><span class="rule"></span><span class="idx">✦</span></span></button>`;
  };
  const codes = L.map(l => l[0]);
  const at = () => Number(document.getElementById("hello")?.dataset.i) || 0;
  let pend = null;
  document.addEventListener("htmx:config:request", e => {
    const ctx = e.detail.ctx;
    const sm = /sound\/([01])$/.exec(ctx.request.action || "");
    if (sm) {
      ctx.fetch = async () => new Response(snd(sm[1] === "1"), { status: 200, headers: { "Content-Type": "text/html; charset=utf-8" } });
      return;
    }
    const w = /hello\/w\/([^/?#]+)$/.exec(ctx.request.action || "");
    if (w) {
      const t = decodeURIComponent(w[1]).slice(0, 28);
      pend = { auto: false, nav: true };
      ctx.fetch = async () => new Response(mine(t), { status: 200, headers: { "Content-Type": "text/html; charset=utf-8" } });
      return;
    }
    const m = /hello\/(\d+)$/.exec(ctx.request.action || "");
    if (!m) return;
    const auto = ctx.sourceEvent?.type === "every";
    if (auto && (document.hidden || document.documentElement.matches(".busy, .held, .typing"))) {
      e.preventDefault();
      return;
    }
    const i = Number(m[1]) % L.length;
    if (pend && pend.i === i && performance.now() - pend.at < 1500) { e.preventDefault(); return; }
    pend = { auto, nav: ctx.hw === "nav", i, at: performance.now() };
    ctx.fetch = async () => new Response(view(i), { status: 200, headers: { "Content-Type": "text/html; charset=utf-8" } });
  });
  document.addEventListener("htmx:after:swap", e => {
    if (e.detail?.ctx?.target?.id === "snd" || !pend) return;
    const b = document.getElementById("hello");
    document.getElementById("said").textContent = b ? b.dataset.phrase : "";
    want = -1;
    if (!b || pend.nav) { pend = null; return; }
    const i = at(), url = "#" + codes[i];
    if (pend.auto) history.replaceState({ hw: i }, "", url);
    else history.pushState({ hw: i }, "", url);
    pend = null;
  });
  let want = -1;
  const go = (i, hw) => {
    i = (i + L.length) % L.length;
    if (hw === "nav" && (i === at() || i === want)) return;
    want = i;
    htmx.ajax("GET", `hello/${i}`, { target: "#hello", swap: "outerHTML", hw });
  };
  const fromHash = () => Math.max(0, codes.indexOf(decodeURIComponent(location.hash.slice(1)).toLowerCase()));
  addEventListener("popstate", () => go(fromHash(), "nav"));
  addEventListener("hashchange", () => go(fromHash(), "nav"));
  addEventListener("keydown", e => {
    if (e.key === "ArrowLeft" && !e.repeat && !document.documentElement.classList.contains("typing")) { e.preventDefault(); go(at() - 1, "push"); }
  });
  const i0 = fromHash();
  if (i0) document.getElementById("hello").outerHTML = view(i0);
  if (still.matches) document.getElementById("hello").setAttribute("hx-trigger", trig());
})();
</script>

  inside = e.pointerType !== "touch" || e.buttons > 0;
  lastMove = performance.now();
}, { passive: true });
addEventListener("pointerdown", e => {
  ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  inside = true; kick = 1.6; lastMove = performance.now();
  downX = e.clientX; downY = e.clientY;
  clearTimeout(holdT);
  holdT = setTimeout(() => { held = true; root.classList.add("held", "met"); audio.swell(true); }, 380);
}, { passive: true });
addEventListener("pointermove", e => { if (!held && Math.hypot(e.clientX - downX, e.clientY - downY) > 24) clearTimeout(holdT); }, { passive: true });
addEventListener("pointerup", e => { endHold(); askTilt(); if (e.pointerType === "touch") inside = false; }, { passive: true });
addEventListener("pointercancel", () => { endHold(); inside = false; });
document.addEventListener("pointerleave", () => { inside = false; });
addEventListener("blur", () => { endHold(); inside = false; });
let typed = "", mT = 0, mK = "";
const inkEl = document.getElementById("ink");
const show = () => { inkEl.textContent = typed; };
const stopTyping = () => { typed = ""; show(); root.classList.remove("typing"); };
const startTyping = () => { root.classList.add("typing", "met"); document.activeElement?.blur?.(); };
addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (root.classList.contains("typing")) {
    if (e.key === "Escape") { e.preventDefault(); stopTyping(); }
    else if (e.key === "Enter") {
      e.preventDefault();
      const s = typed.trim();
      stopTyping();
      if (s) htmx.ajax("GET", "hello/w/" + encodeURIComponent(s), { target: "#hello", swap: "outerHTML", hw: "nav" });
    }
    else if (e.key === "Backspace") { e.preventDefault(); typed = typed.slice(0, -1); show(); if (!typed) stopTyping(); }
    else if (e.key.length === 1) { e.preventDefault(); if (typed.length < 28) typed += e.key; show(); }
    return;
  }
  if (e.repeat) return;
  if (e.key.length === 1 && /\p{L}/u.test(e.key)) {
    e.preventDefault();
    if (!mT && e.key.toLowerCase() === "m") {
      audio.prime();
      mK = e.key;
      mT = setTimeout(() => { mT = 0; document.getElementById("snd")?.click(); }, 420);
      return;
    }
    if (mT) { clearTimeout(mT); mT = 0; typed = mK; }
    startTyping();
    typed += e.key;
    show();
    return;
  }
  const b = document.getElementById("hello");
  if (!b) return;
  if ((e.key === " " || e.key === "Enter") && document.activeElement !== b && document.activeElement?.id !== "snd") { e.preventDefault(); b.click(); }
  else if (e.key === "ArrowRight") { e.preventDefault(); b.click(); }
});

let raf = 0, last = 0, cx = 0, cy = 0, ema = 16, slow = 0, fast = 0, down = -1e9, live = N;
const tune = () => {
  live = T + Math.floor((N - T) * [1, 0.8, 0.6, 0.45][q]);
  geo.setDrawRange(0, live);
  size();
  root.dataset.q = String(q);
};
function frame(now) {
  raf = requestAnimationFrame(frame);
  const raw = now - last;
  const dt = Math.min(Math.max(raw / 1000, 0), 1 / 30);
  if (raw > 0 && raw < 250) {
    ema += (raw - ema) * 0.05;
    slow = ema > 24 ? slow + dt : 0;
    fast = ema < 13 ? fast + dt : 0;
    if (slow > 2 && q < 3) { q++; slow = 0; ema = 16; down = now; tune(); }
    else if (fast > 8 && q > 0 && now - down > 30000) { q--; fast = 0; tune(); }
  }
  last = now;
  t += dt;
  const calm = still.matches;
  const breath = Math.sin(t * (Math.PI * 2 / 7.5));
  const idle = now - lastMove > 2600;
  root.classList.toggle("busy", inside && !idle);
  kick *= Math.exp(-dt * 2.2);
  hold += ((held ? 1 : 0) - hold) * Math.min(dt * (held ? 2.2 : 3.5), 1);
  push += ((inside && !held ? (idle ? 0.35 : 0.8) + kick : 0) - push) * Math.min(dt * 6, 1);

  const dx = calm ? 0 : Math.sin(t * 0.071) * 0.7 + ndc.x * (inside ? 0.25 : 0) + tilt.x * 0.6;
  const dy = calm ? 0 : Math.sin(t * 0.053 + 1.3) * 0.32 + ndc.y * (inside ? 0.14 : 0) - tilt.y * 0.36;
  cx += (dx - cx) * Math.min(dt * 1.4, 1);
  cy += (dy - cy) * Math.min(dt * 1.4, 1);
  cam.position.set(cx, cy, DIST - (calm ? 0 : 0.25 * Math.sin(t * 0.037)));
  cam.lookAt(0, 0.05, 0);
  cam.updateMatrixWorld();

  ray.setFromCamera(ndc, cam);
  if (ray.ray.intersectPlane(plane, hit)) aim.lerp(hit, Math.min(dt * 14, 1));

  const hr = Math.min(viewSize()[0] * 0.2, 1.7);
  const streak = calm ? 0 : X.step(live, dt, t, aim.x, aim.y, aim.z, push, breath, 1, tone, q < 3 ? T : 0, 0.07, hold, hr);
  if (calm) X.step(live, dt, t, aim.x, aim.y, aim.z, push, breath * 0.4, 0.35, tone, 0, 0, hold * 0.6, hr);
  trails.visible = streak > T * 0.004;
  if (trails.visible) trailBuf.needsUpdate = true;
  TU.uTone.value = tone;
  TU.uTrail.value += ((trails.visible ? 1 : 0) - TU.uTrail.value) * Math.min(dt * 4, 1);
  aPos.needsUpdate = true;
  aHeat.needsUpdate = true;
  aMix.needsUpdate = true;
  aTone.needsUpdate = true;

  U.uTime.value = t;
  U.uBreath.value = breath;
  U.uFocus.value = cam.position.distanceTo(new THREE.Vector3(0, 0.05, 0));
  U.uGain.value += (gain * (1 - 0.4 * hold) - U.uGain.value) * Math.min(dt * 3, 1);
  U.uScale.value += (scale - U.uScale.value) * Math.min(dt * 3, 1);
  const su = sky.material.uniforms;
  su.uTime.value = t;
  su.uBreath.value = breath;
  su.uGrain.value = calm ? 0 : 1;
  su.uPtr.value.set(ndc.x * 0.5 * cam.aspect, ndc.y * 0.5);
  renderer.render(scene, cam);
}
const run = () => {
  if (document.hidden) { cancelAnimationFrame(raf); raf = 0; return; }
  if (!raf) { last = performance.now(); raf = requestAnimationFrame(frame); }
};
document.addEventListener("visibilitychange", run);
run();
requestAnimationFrame(() => root.classList.add("live"));
</script>
