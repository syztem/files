@group(0) @binding(1) var nt: texture_3d<f32>;
@group(0) @binding(2) var sr: sampler;
const PI = 3.14159265;
const TAU = 6.2831853;
var<private> FP: f32 = 0.0;
var<private> PA: f32 = 0.001;
fn h1(n: f32) -> f32 { return fract(sin(n * 127.1 + 0.37) * 43758.5453); }
fn h21(p: vec2f) -> f32 { var p3 = fract(vec3f(p.x, p.y, p.x) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
fn h31(p: vec3f) -> f32 { var p3 = fract(p * 0.1031); p3 += dot(p3, p3.zyx + 31.32); return fract((p3.x + p3.y) * p3.z); }
fn nl(p: vec3f, k: f32) -> vec4f { return textureSampleLevel(nt, sr, p * k, clamp(log2(max(FP * k * 64.0, 1.0)), 0.0, 6.0)); }
fn n0(p: vec3f) -> vec4f { return textureSampleLevel(nt, sr, p, 0.0); }
fn aaf(w: f32) -> f32 { return clamp(1.0 - FP / max(w, 1e-4) * 0.5, 0.0, 1.0); }
fn line(d: f32, w: f32) -> f32 { let f = max(FP, 1e-4); return (1.0 - smoothstep(w - f, w + f, d)) * aaf(w * 2.0); }
fn stripe(x: f32, k: f32) -> f32 {
  let w = max(FP * k, 1e-4);
  let tw = abs(fract(x) - 0.5) * 2.0;
  let v = smoothstep(0.5 - w, 0.5 + w, tw);
  return mix(v, 0.5, smoothstep(0.15, 0.4, w));
}
fn r2(a: f32) -> mat2x2f { let c = cos(a); let s = sin(a); return mat2x2f(c, s, -s, c); }
fn sat(x: f32) -> f32 { return clamp(x, 0.0, 1.0); }
fn sdBox(p: vec3f, b: vec3f) -> f32 { let q = abs(p) - b; return length(max(q, vec3f(0.0))) + min(max(q.x, max(q.y, q.z)), 0.0); }
fn sdRB(p: vec3f, b: vec3f, r: f32) -> f32 { return sdBox(p, b - vec3f(r)) - r; }
fn sdB2(p: vec2f, b: vec2f) -> f32 { let q = abs(p) - b; return length(max(q, vec2f(0.0))) + min(max(q.x, q.y), 0.0); }
fn sdCap(p: vec3f, a: vec3f, b: vec3f, r: f32) -> f32 { let pa = p - a; let ba = b - a; let h = sat(dot(pa, ba) / dot(ba, ba)); return length(pa - ba * h) - r; }
fn sdTor(p: vec3f, R: f32, r: f32) -> f32 { return length(vec2f(length(p.xz) - R, p.y)) - r; }
fn sdCylY(p: vec3f, r: f32, h: f32, rr: f32) -> f32 { let d = vec2f(length(p.xz) - r + rr, abs(p.y) - h + rr); return min(max(d.x, d.y), 0.0) + length(max(d, vec2f(0.0))) - rr; }
fn sdEll(p: vec3f, r: vec3f) -> f32 { let k0 = length(p / r); let k1 = length(p / (r * r)); return k0 * (k0 - 1.0) / max(k1, 1e-5); }
fn sdOct(p0: vec2f, r: f32) -> f32 {
  let k = vec3f(-0.9238795325, 0.3826834323, 0.4142135623);
  var p = abs(p0);
  p -= 2.0 * min(dot(vec2f(k.x, k.y), p), 0.0) * vec2f(k.x, k.y);
  p -= 2.0 * min(dot(vec2f(-k.x, k.y), p), 0.0) * vec2f(-k.x, k.y);
  p -= vec2f(clamp(p.x, -k.z * r, k.z * r), r);
  return length(p) * sign(p.y);
}
fn smin(a: f32, b: f32, k: f32) -> f32 { let h = max(k - abs(a - b), 0.0) / k; return min(a, b) - h * h * k * 0.25; }
fn smax(a: f32, b: f32, k: f32) -> f32 { return -smin(-a, -b, k); }
fn U2(a: vec2f, b: vec2f) -> vec2f { return select(a, b, b.x < a.x); }
fn ry(p: vec3f, a: f32) -> vec3f { let q = r2(a) * p.xz; return vec3f(q.x, p.y, q.y); }
fn rx(p: vec3f, a: f32) -> vec3f { let q = r2(a) * p.yz; return vec3f(p.x, q.x, q.y); }
fn rz(p: vec3f, a: f32) -> vec3f { let q = r2(a) * p.xy; return vec3f(q.x, q.y, p.z); }
fn raxis(p: vec3f, ax: vec3f, a: f32) -> vec3f { let c = cos(a); let s = sin(a); return p * c + cross(ax, p) * s + ax * dot(ax, p) * (1.0 - c); }

fn rHulk(p: vec3f) -> vec2f {
  let q = vec3f(abs(p.x), p.y, p.z);
  var d = sdRB(p - vec3f(0.0, 0.15, 0.0), vec3f(0.95, 1.05, 0.72), 0.32);
  d = smin(d, sdRB(p - vec3f(0.0, 0.3, 0.5), vec3f(0.68, 0.62, 0.32), 0.18), 0.2);
  d = smin(d, length(q - vec3f(1.15, 0.8, 0.0)) - 0.55, 0.3);
  d = smin(d, sdCap(q, vec3f(1.3, 0.6, 0.0), vec3f(1.42, -0.5, 0.45), 0.3), 0.2);
  d = smin(d, sdCap(q, vec3f(0.45, -0.85, 0.0), vec3f(0.55, -1.75, 0.15), 0.28), 0.25);
  d = smin(d, sdRB(p - vec3f(0.0, 1.35, 0.12), vec3f(0.44, 0.3, 0.42), 0.15), 0.18);
  var r = vec2f(d, 0.0);
  let g = sdCap(q, vec3f(1.42, -0.55, 0.3), vec3f(1.42, -0.6, 1.55), 0.22);
  let gi = max(g, -sdCap(q, vec3f(1.42, -0.6, 1.2), vec3f(1.42, -0.6, 2.0), 0.12));
  r = U2(r, vec2f(gi, 2.0));
  r = U2(r, vec2f(sdRB(q - vec3f(0.0, -0.1, -0.78), vec3f(0.5, 0.45, 0.12), 0.08), 2.0));
  let e = sdRB(p - vec3f(0.0, 1.38, 0.52), vec3f(0.33, 0.07, 0.06), 0.035);
  r = U2(r, vec2f(e, 1.0));
  return r;
}
fn rDrone(p: vec3f) -> vec2f {
  let q = vec3f(abs(p.x), p.y, p.z);
  var d = sdEll(p, vec3f(0.85, 0.62, 1.25));
  d = smin(d, sdRB(p - vec3f(0.0, 0.55, -0.25), vec3f(0.06, 0.32, 0.6), 0.05), 0.15);
  d = smin(d, sdRB(q - vec3f(0.75, -0.05, -0.2), vec3f(0.35, 0.08, 0.55), 0.06), 0.12);
  let eyeS = length(p - vec3f(0.0, 0.05, 1.08)) - 0.34;
  d = smax(d, -(length(p - vec3f(0.0, 0.05, 1.2)) - 0.4), 0.06);
  var r = vec2f(d, 0.0);
  var c = sdCap(q, vec3f(0.5, -0.25, 0.7), vec3f(0.85, -0.38, 1.55), 0.14);
  c = smin(c, sdCap(q, vec3f(0.85, -0.38, 1.55), vec3f(0.5, -0.32, 2.05), 0.1), 0.08);
  r = U2(r, vec2f(c, 2.0));
  r = U2(r, vec2f(sdTor(rx(p - vec3f(0.0, 0.0, -1.15), 1.5708), 0.42, 0.11), 3.0));
  r = U2(r, vec2f(eyeS, 1.0));
  return r;
}
fn rSph(p: vec3f) -> vec2f {
  let q = vec3f(abs(p.x), p.y, p.z);
  var d = length(p) - 1.15;
  d = smax(d, -(length(p - vec3f(0.0, 0.0, 1.25)) - 0.62), 0.08);
  var r = vec2f(d, 0.0);
  r = U2(r, vec2f(sdTor(p, 1.16, 0.1), 3.0));
  r = U2(r, vec2f(sdCap(q, vec3f(0.55, 0.85, -0.2), vec3f(0.85, 1.45, -0.45), 0.07), 2.0));
  r = U2(r, vec2f(length(p - vec3f(0.0, 0.0, 0.78)) - 0.42, 1.0));
  return r;
}
fn rBoss(p: vec3f, t: f32) -> vec2f {
  var d = length(p) - 2.1;
  d = smax(d, -(length(p - vec3f(0.0, 0.0, 2.25)) - 1.05), 0.12);
  var r = vec2f(d, 0.0);
  let pr = rz(p, t * 0.9);
  r = U2(r, vec2f(sdTor(rx(pr, 1.5708), 3.05, 0.3), 3.0));
  var a = pr;
  let ang = atan2(a.y, a.x);
  let sec = round(ang / 1.5708) * 1.5708;
  a = rz(a, -sec);
  r = U2(r, vec2f(sdRB(a - vec3f(3.05, 0.0, 0.0), vec3f(0.35, 0.55, 0.55), 0.12), 2.0));
  let k = rz(p, 0.7854);
  let kq = vec3f(abs(k.x), abs(k.y), k.z);
  var c = sdCap(kq, vec3f(1.2, 1.2, 0.8), vec3f(1.8, 1.8, 2.4), 0.24);
  c = smin(c, sdCap(kq, vec3f(1.8, 1.8, 2.4), vec3f(1.15, 1.15, 3.4), 0.17), 0.12);
  r = U2(r, vec2f(c, 2.0));
  r = U2(r, vec2f(sdCylY(rx(p - vec3f(0.0, 0.0, -2.0), 1.5708), 0.9, 0.35, 0.1), 2.0));
  r = U2(r, vec2f(length(p - vec3f(0.0, 0.0, 1.55)) - 0.92, 1.0));

}
fn rTur(p: vec3f, yaw: f32, pit: f32) -> vec2f {

  r = U2(r, vec2f(sdCylY(p - vec3f(0.0, 0.45, 0.0), 0.75, 0.25, 0.1), 3.0));

  d = smin(d, sdRB(h - vec3f(0.0, 0.0, 0.1), vec3f(0.95, 0.38, 0.55), 0.16), 0.2);

  r = U2(r, vec2f(sdRB(h - vec3f(0.0, 0.12, 0.62), vec3f(0.22, 0.08, 0.06), 0.03), 1.0));
  return r;
}
fn robots(p: vec3f) -> vec2f {
  var r = vec2f(1e5, 0.0);
  let n = i32(u.nl.y);
  for (var i = 0; i < n; i++) {
    let a = u.R[i * 2];
    let o = u.R[i * 2 + 1];
    if (o.z <= 0.0) { continue; }
    let ty = i32(a.w + 0.5);
    let bnd = select(select(2.6, 5.4, ty == 3), 2.8, ty >= 4);
    let v = p - a.xyz;
    let bd = length(v) - bnd * o.z;
    if (bd > max(r.x, 0.6)) { continue; }
    var q: vec2f;
    if (ty >= 4) {
      var w = v;
      if (ty == 5) { w = vec3f(w.x, -w.y, w.z); }
      q = rTur(w / o.z, o.x, o.y);
    } else {
      let l = rx(ry(v, o.x), o.y) / o.z;
      if (ty == 0) { q = rHulk(l); }
      else if (ty == 1) { q = rDrone(l); }
      else if (ty == 2) { q = rSph(l); }
      else { q = rBoss(l, u.tm.x); }
    }
    q.x *= o.z;
    q.y = 100.0 + f32(i) * 10.0 + q.y;
    r = U2(r, q);
  }
  return r;
}
fn shipL(p: vec3f) -> vec2f {
  let q = vec3f(abs(p.x), p.y, p.z);
  var d = sdRB(p - vec3f(0.0, 0.0, -0.2), vec3f(0.78, 0.34, 1.45), 0.24);
  d = smin(d, sdEll(p - vec3f(0.0, -0.02, 1.15), vec3f(0.62, 0.28, 1.05)), 0.25);
  d = smin(d, sdRB(q - vec3f(0.95, -0.05, -0.45), vec3f(0.45, 0.07, 0.8), 0.05), 0.12);
  var r = vec2f(d, 80.0);
  var pd = sdRB(q - vec3f(1.38, -0.05, -0.15), vec3f(0.36, 0.3, 1.35), 0.14);
  pd = smin(pd, sdEll(q - vec3f(1.38, -0.05, 1.1), vec3f(0.3, 0.26, 0.6)), 0.15);
  r = U2(r, vec2f(pd, 83.0));
  r = U2(r, vec2f(max(sdCap(q, vec3f(1.38, -0.12, 1.2), vec3f(1.38, -0.12, 2.25), 0.09), -sdCap(q, vec3f(1.38, -0.12, 2.0), vec3f(1.38, -0.12, 3.0), 0.05)), 83.0));
  r = U2(r, vec2f(sdEll(p - vec3f(0.0, 0.3, 0.45), vec3f(0.38, 0.22, 0.75)), 81.0));
  r = U2(r, vec2f(sdCylY(rx(q - vec3f(0.38, 0.0, -1.62), 1.5708), 0.22, 0.12, 0.05), 82.0));
  r = U2(r, vec2f(sdCylY(rx(q - vec3f(1.38, -0.05, -1.5), 1.5708), 0.2, 0.08, 0.04), 82.0));
  r = U2(r, vec2f(sdRB(p - vec3f(0.0, 0.42, -0.95), vec3f(0.05, 0.22, 0.5), 0.04), 83.0));

}
fn shipW(p: vec3f) -> vec2f {
  if (u.ship.w <= 0.0) { return vec2f(1e5, 0.0); }
  let v = p - u.ship.xyz;
  let bd = length(v) - 3.2;
  if (bd > 0.8) { return vec2f(bd, 80.0); }
  let f = u.shf.xyz;
  let up = u.shu.xyz;
  let rt = cross(up, f);
  return shipL(vec3f(dot(v, rt), dot(v, up), dot(v, f)));

fn debris(p: vec3f) -> vec2f {
  var r = vec2f(1e5, 0.0);
  let n = i32(u.nd.x);
  for (var i = 0; i < n; i++) {
    let a = u.D[i * 3];
    let b = u.D[i * 3 + 1];
    let c = u.D[i * 3 + 2];
    let v = p - a.xyz;
    let bd = length(v) - a.w * 1.8;
    if (bd > max(r.x, 0.5)) { continue; }
    let l = raxis(v, b.xyz, -b.w);
    var d: f32;
    if (c.y < 0.5) { d = sdRB(l, vec3f(a.w, a.w * 0.45, a.w * 0.7), a.w * 0.18); }
    else if (c.y < 1.5) { d = sdRB(l, vec3f(a.w * 0.3, a.w * 0.3, a.w * 1.4), a.w * 0.1); }

    r = U2(r, vec2f(d, 90.0 + f32(i)));
  }
  return r;
}
