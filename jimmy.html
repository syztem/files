<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beautiful Website</title>
    <style>
        /* Global styles */
        body {
            margin: 0;
            padding: 0;
        }
        canvas {
            width: 100%;
            height: 100vh;
            display: block;
        }
        /* End global styles */

        /* Three.js styles */
        #three-canvas {
            width: 100%;
            height: 100vh;
        }
        /* End Three.js styles */
    </style>
</head>
<body>
    <canvas id="three-canvas" style="width: 100%; height: 100%"></canvas>
    <script>
        // Set up the scene and the renderer
        let camera, scene, renderer, sphere;

        // Create the scene, camera, and the renderer
        const canvas = document.getElementById("three-canvas");
        camera = new THREE.PerspectiveCamera(45, canvas.width / canvas.height, 1, 2000);
        renderer = new THREE.WebGLRenderer({ canvas: canvas, antialiasing: true });
        scene = new THREE.Scene();

        // Create a basic sphere
        const geometry = new THREE.SphereGeometry(5, 60, 60);
        const material = new THREE.MeshPhongMaterial();
        sphere = new THREE.Mesh(geometry, material);

        // Add the sphere to the scene
        scene.add(sphere);

        // Set up the camera
        camera.position.z = 10;
        camera.position.x = 5;
        camera.position.y = 5;

        // Set up the renderer
        renderer.setSize(canvas.width, canvas.height);
        renderer.setClearColor(new THREE.Color(0x000000));
        renderer.setClearAlpha(1);
        renderer.setFaceCullingEnabled(false);

        // Render the scene
        function animate() {
            requestAnimationFrame(animate);
            sphere.rotation.x = Math.sin(Date.now() / 1000);
            renderer.render(scene, camera);
        }
        animate();

        // Add event listeners for resize and touch events
        window.addEventListener("resize", () => {
            camera.aspect = canvas.width / canvas.height;
            camera.updateProjectionMatrix();
            renderer.setSize(canvas.width, canvas.height);
        });
        window.addEventListener("touchstart", () => {
            // Toggle touch events
        });
        window.addEventListener("touchend", () => {
            // Toggle touch events
        });
    </script>
</body>
</html>
