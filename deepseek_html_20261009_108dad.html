<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>creek</title>
<style>
  html,body{margin:0;height:100%;background:#05080d;overflow:hidden}
  canvas{display:block}
  #enter{
    position:fixed;inset:0;z-index:2;display:grid;place-items:center;cursor:pointer;
    color:#8fa6bd;font:400 12px/1 ui-sans-serif,system-ui,-apple-system,sans-serif;
    letter-spacing:.42em;text-transform:uppercase;
    background:radial-gradient(120% 100% at 50% 50%,rgba(4,8,14,.10),rgba(4,8,14,.78));
    transition:opacity 1.6s ease;
  }
  #enter.off{opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="enter">click</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.webgpu.min.js",
    "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.webgpu.min.js",
    "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.tsl.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three/webgpu';
import {
  Fn, vec2, vec3, float, uv, positionLocal, positionWorld, cameraPosition,
  sin, cos, abs, max, pow, clamp, mix, normalize, dot, cross, reflect,
  exp, attribute, uniform
} from 'three/tsl';
import { pass } from 'three/tsl';
import { bloom } from 'three/addons/tsl/display/BloomNode.js';

/* ---------- deterministic random ---------- */
let _s = 20041117;
const rnd = () => (_s = (_s * 1664525 + 1013904223) >>> 0) / 4294967296;

/* ---------- shared maths (js mirror of tsl) ---------- */
const ssj = (a, b, x) => {
  const t = Math.min(1, Math.max(0, (x - a) / (b - a)));
  return t * t * (3 - 2 * t);
};
const creekXJS = (z) => Math.sin(z * 0.045) * 5.0 + Math.sin(z * 0.017 + 1.7) * 3.0;
const bankHJS = (x, z) => {
  const d = Math.abs(x - creekXJS(z));
  const t = ssj(1.5, 9.0, d);
  return -1.35 + t * 3.2
    + Math.sin(x * 0.21 + z * 0.13) * 0.28
    + Math.sin(x * 0.07 - z * 0.19) * 0.45
    + Math.sin(x * 0.53 + z * 0.41) * 0.07;
};

/* ---------- renderer ---------- */
const renderer = new THREE.WebGPURenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.AgXToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);
await renderer.init();

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x070c14);
scene.fog = new THREE.FogExp2(0x08111c, 0.0105);

const camera = new THREE.PerspectiveCamera(62, window.innerWidth / window.innerHeight, 0.08, 900);

/* ---------- uniforms ---------- */
const uTime = uniform(0);
const uDawn = uniform(0);
const uWin = uniform(0);

/* ---------- tsl helpers ---------- */
const ss = (a, b, x) => {
  const t = clamp(x.sub(float(a)).div(float(b - a)), 0.0, 1.0);
  return t.mul(t).mul(float(3.0).sub(t.mul(2.0)));
};

const fbm = (p, s) => {
  let v = float(0);
  let amp = 0.5, fr = 1.0;
  for (let i = 0; i < 3; i++) {
    const n = sin(p.x.mul(1.7 * fr).add(s + i * 2.3))
      .mul(sin(p.y.mul(2.1 * fr).add(s * 1.3 + i * 1.7)))
      .mul(sin(p.z.mul(1.9 * fr).add(s * 0.7 + i * 3.1)));
    v = v.add(n.mul(amp));
    amp *= 0.5;
    fr *= 2.13;
  }
  return v;
};

/* ---------- procedural terrain functions ---------- */
const creekX = Fn(([z]) => sin(z.mul(0.045)).mul(5.0).add(sin(z.mul(0.017).add(1.7)).mul(3.0)));

const bankH = Fn(([x, z]) => {
  const d = x.sub(creekX(z)).abs();
  const t = ss(1.5, 9.0, d);
  return float(-1.35).add(t.mul(3.2))
    .add(sin(x.mul(0.21).add(z.mul(0.13))).mul(0.28))
    .add(sin(x.mul(0.07).sub(z.mul(0.19))).mul(0.45))
    .add(sin(x.mul(0.53).add(z.mul(0.41))).mul(0.07));
});

const bedAlbedo = Fn(([x, z]) => {
  const h = bankH(x, z);
  const p = vec3(x, float(0.0), z);
  const n1 = fbm(p.mul(0.55), 3.3).mul(0.5).add(0.5);
  const n2 = fbm(p.mul(2.6), 9.1).mul(0.5).add(0.5);
  const gravel = vec3(0.30, 0.27, 0.22).mul(n2.mul(0.5).add(0.75));
  const sand = vec3(0.34, 0.29, 0.22);
  const wet = vec3(0.095, 0.105, 0.10);
  const moss = vec3(0.062, 0.13, 0.072);
  let c = mix(gravel, sand, n1);
  c = mix(c, wet, ss(-0.15, -1.3, h).mul(0.82));
  c = mix(c, moss.mul(n2.mul(0.5).add(0.75)), ss(0.15, 1.5, h).mul(0.85));
  return c;
});

/* ---------- banks ---------- */
const bankGeo = new THREE.PlaneGeometry(260, 260, 300, 300);
bankGeo.rotateX(-Math.PI / 2);
{
  const p = bankGeo.attributes.position;
  for (let i = 0; i < p.count; i++) {
    p.setY(i, bankHJS(p.getX(i), p.getZ(i)));
  }
  p.needsUpdate = true;
  bankGeo.computeVertexNormals();
}
const bankMat = new THREE.MeshStandardNodeMaterial({ roughness: 0.97, metalness: 0.0 });
bankMat.colorNode = bedAlbedo(positionWorld.x, positionWorld.z);
const bank = new THREE.Mesh(bankGeo, bankMat);
bank.receiveShadow = true;
scene.add(bank);

/* ---------- water ---------- */
const WAVES = [
  { d: [ 0.94,  0.34], a: 0.086, l: 7.0, s: 0.50, q: 0.60 },
  { d: [-0.42,  0.91], a: 0.048, l: 3.4, s: 0.78, q: 0.45 },
  { d: [ 0.66, -0.75], a: 0.024, l: 1.6, s: 1.15, q: 0.35 }
];

function gerstner(P, T) {
  let dx = float(0), dy = float(0), dz = float(0);
  let ax = float(1), ay = float(0), az = float(0);
  let bx = float(0), by = float(0), bz = float(1);
  for (const w of WAVES) {
    const k = (2 * Math.PI) / w.l;
    const qa = w.q * w.a;
    const w0 = k * w.s;
    const kx = k * w.d[0];
    const kz = k * w.d[1];
    const f = P.x.mul(kx).add(P.z.mul(kz)).sub(T.mul(w0));
    const S = sin(f);
    const C = cos(f);
    dx = dx.add(C.mul(qa * w.d[0]));
    dz = dz.add(C.mul(qa * w.d[1]));
    dy = dy.add(S.mul(w.a));
    ax = ax.sub(S.mul(qa * w.d[0] * kx));
    az = az.sub(S.mul(qa * w.d[1] * kx));
    ay = ay.add(C.mul(w.a * kx));
    bx = bx.sub(S.mul(qa * w.d[0] * kz));
    bz = bz.sub(S.mul(qa * w.d[1] * kz));
    by = by.add(C.mul(w.a * kz));
  }
  return {
    disp: vec3(P.x.add(dx), dy, P.z.add(dz)),
    nrm: normalize(cross(vec3(bx, by, bz), vec3(ax, ay, az)))
  };
}

const waterGeo = new THREE.PlaneGeometry(56, 240, 112, 480);
waterGeo.rotateX(-Math.PI / 2);

const waterMat = new THREE.MeshBasicNodeMaterial();
waterMat.transparent = true;
waterMat.depthWrite = false;
waterMat.fog = true;

waterMat.positionNode = gerstner(positionLocal, uTime).disp;

const wpos = positionWorld;
const wN = gerstner(wpos, uTime).nrm;
const wV = normalize(cameraPosition.sub(wpos));
const wBed = bankH(wpos.x, wpos.z);
const wDepth = clamp(wpos.y.sub(wBed), 0.0, 6.0);

const refrOff = vec2(wN.x, wN.z).mul(wDepth.mul(0.30));
const refrBed = bedAlbedo(wpos.x.add(refrOff.x), wpos.z.add(refrOff.y));

const bodyDeep = vec3(0.009, 0.028, 0.038);
const bodyShallow = vec3(0.052, 0.088, 0.088);
const body = mix(bodyShallow, bodyDeep, ss(0.0, 2.6, wDepth));
const clarity = exp(wDepth.mul(-0.75));

let wCol = mix(body, refrBed, clarity.mul(0.85));
wCol = wCol.mul(mix(float(0.28), float(1.0), ss(0.0, 0.62, wDepth)));

const fres = pow(float(1.0).sub(clamp(dot(wN, wV), 0.0, 1.0)), 5.0).mul(0.92).add(0.05);
const skyRefl = mix(vec3(0.020, 0.045, 0.075), vec3(0.20, 0.25, 0.33), uDawn);
wCol = mix(wCol, skyRefl, clamp(fres, 0.0, 1.0).mul(0.80));

const winEnv = vec3(float(-2.0), float(6.0), float(150.0));
const toWin = winEnv.sub(wpos);
const Lwin = normalize(toWin);
const wUp = vec3(0.0, 1.0, 0.0);
const wRt = normalize(cross(wUp, Lwin));
const wUpv = cross(Lwin, wRt);
const wR = reflect(wV.negate(), wN);
const eu = dot(wR, wRt);
const ev = dot(wR, wUpv);
const ew = dot(wR, Lwin);
const hwA = float(0.030);
const hhA = float(0.022);
const mu = float(1.0).sub(ss(hwA.mul(0.68), hwA, abs(eu)));
const mv = float(1.0).sub(ss(hhA.mul(0.68), hhA, abs(ev)));
const wSpec = mu.mul(mv).mul(ss(0.0, 0.012, ew)).mul(uWin).mul(16.0);
wCol = wCol.add(vec3(1.0, 0.78, 0.50).mul(wSpec));

waterMat.colorNode = wCol;
waterMat.opacityNode = float(1.0).sub(ss(-0.025, 0.055, wBed.sub(wpos.y)));

const water = new THREE.Mesh(waterGeo, waterMat);
water.renderOrder = 2;
scene.add(water);

/* ---------- stones ---------- */
const stoneGeo = new THREE.IcosahedronGeometry(1, 3);
{
  const p = stoneGeo.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    const n = 1
      + 0.20 * Math.sin(x * 2.3 + 1.1) * Math.sin(y * 2.7 + 0.4) * Math.sin(z * 3.1 + 2.2)
      + 0.12 * Math.sin(x * 4.1 + 0.3) * Math.sin(z * 3.7 + 1.0)
      + 0.07 * Math.sin(y * 6.2 + 0.7) * Math.sin(x * 5.3 + 2.0);
    p.setXYZ(i, x * n * 1.05, y * n * 0.80, z * n * 1.05);
  }
  p.needsUpdate = true;
  stoneGeo.computeVertexNormals();
}

const stoneMat = new THREE.MeshStandardNodeMaterial({ roughness: 0.88, metalness: 0.0 });
{
  const g = fbm(positionWorld.mul(1.15), 4.7).mul(0.5).add(0.5);
  const g2 = fbm(positionWorld.mul(4.2), 11.3).mul(0.5).add(0.5);
  const base = mix(vec3(0.115, 0.115, 0.108), vec3(0.255, 0.245, 0.225), g);
  stoneMat.colorNode = mix(base, vec3(0.055, 0.115, 0.065), ss(0.55, 0.98, g2).mul(0.55));
}

const STONES = 250;
const stones = new THREE.InstancedMesh(stoneGeo, stoneMat, STONES);
stones.castShadow = true;
stones.receiveShadow = true;
{
  const m = new THREE.Matrix4();
  const q = new THREE.Quaternion();
  const e = new THREE.Euler();
  const s3 = new THREE.Vector3();
  const p3 = new THREE.Vector3();
  for (let i = 0; i < STONES; i++) {
    const z = -105 + rnd() * 210;
    const side = rnd() < 0.5 ? -1 : 1;
    const off = 2.5 + Math.pow(rnd(), 1.6) * 15.0;
    const x = creekXJS(z) + side * off;
    const s = 0.28 + Math.pow(rnd(), 2.2) * (off > 9 ? 1.5 : 1.15);
    const y = bankHJS(x, z) + s * 0.42;
    p3.set(x, y, z);
    e.set(rnd() * 0.5, rnd() * 6.283, rnd() * 0.5);
    q.setFromEuler(e);
    s3.set(s * (0.80 + rnd() * 0.5), s * (0.60 + rnd() * 0.45), s * (0.80 + rnd() * 0.5));
    m.compose(p3, q, s3);
    stones.setMatrixAt(i, m);
  }
  stones.instanceMatrix.needsUpdate = true;
}
scene.add(stones);

/* ---------- diamond cards ---------- */
function buildCard(w, h) {
  const pos = [], nor = [], uvs = [];
  const A = [0, 0, 0];
  const Bx = [w, h * 0.5, 0], C = [0, h, 0], Dx = [-w, h * 0.5, 0];
  const Bz = [0, h * 0.5, w], Dz = [0, h * 0.5, -w];
  const push = (v) => {
    pos.push(v[0], v[1], v[2]);
    nor.push(0, 1, 0);
    uvs.push(0, v[1] / h);
  };
  push(A); push(Bx); push(C);
  push(A); push(C); push(Dx);
  push(A); push(C); push(Bx);
  push(A); push(Dx); push(C);
  push(A); push(Bz); push(C);
  push(A); push(C); push(Dz);
  push(A); push(C); push(Bz);
  push(A); push(Dz); push(C);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  return g;
}

const WIND_WX = 0.86, WIND_WZ = 0.51;

function makeSway(cardGeo, count, scaleMin, scaleMax, jitter) {
  const ph = new Float32Array(count);
  const wd = new Float32Array(count * 2);
  const m = new THREE.Matrix4();
  const q = new THREE.Quaternion();
  const e = new THREE.Euler();
  const s3 = new THREE.Vector3();
  const p3 = new THREE.Vector3();
  let placed = 0, guard = 0;
  while (placed < count && guard < count * 40) {
    guard++;
    const z = -108 + rnd() * 216;
    const side = rnd() < 0.5 ? -1 : 1;
    const off = 3.2 + Math.pow(rnd(), 0.75) * 24.0;
    const x = creekXJS(z) + side * off;
    const h = bankHJS(x, z);
    if (h < 0.16) continue;
    const s = scaleMin + rnd() * (scaleMax - scaleMin);
    p3.set(x + (rnd() - 0.5) * jitter, h - 0.04, z + (rnd() - 0.5) * jitter);
    const ry = rnd() * 6.283;
    e.set(0, ry, 0);
    q.setFromEuler(e);
    s3.set(s, s * (0.75 + rnd() * 0.7), s);
    m.compose(p3, q, s3);
    const c = Math.cos(ry), sn = Math.sin(ry);
    wd[placed * 2] = WIND_WX * c - WIND_WZ * sn;
    wd[placed * 2 + 1] = WIND_WX * sn + WIND_WZ * c;
    ph[placed] = rnd() * 90.0;
    placed++;
  }
  cardGeo.setAttribute('aPhase', new THREE.InstancedBufferAttribute(ph, 1));
  cardGeo.setAttribute('aWind', new THREE.InstancedBufferAttribute(wd, 2));
  return m;
}

const GRASS = 5200;
const grassGeo = buildCard(0.105, 1.0);
makeSway(grassGeo, GRASS, 0.30, 0.95, 3.0);

const grassMat = new THREE.MeshStandardNodeMaterial({ roughness: 0.92, metalness: 0.0 });
{
  const aPh = attribute('aPhase', 'float');
  const aWd = attribute('aWind', 'vec2');
  const yy = positionLocal.y;
  const sway = sin(uTime.mul(1.25).add(aPh)).mul(0.62)
    .add(sin(uTime.mul(0.68).add(aPh.mul(1.9))).mul(0.38));
  const bend = yy.mul(yy).mul(sway).mul(0.34);
  grassMat.positionNode = vec3(
    positionLocal.x.add(aWd.x.mul(bend)),
    positionLocal.y.sub(bend.mul(bend).mul(0.5)),
    positionLocal.z.add(aWd.y.mul(bend))
  );
  const gv = sin(positionWorld.x.mul(3.1)).mul(sin(positionWorld.z.mul(2.7))).mul(0.5).add(0.5);
  const base = mix(vec3(0.048, 0.092, 0.040), vec3(0.125, 0.195, 0.072), gv);
  grassMat.colorNode = mix(base, base.mul(1.9).add(vec3(0.02, 0.035, 0.012)), ss(0.30, 1.0, uv().y));
  grassMat.castShadow = true;
}
const grass = new THREE.InstancedMesh(grassGeo, grassMat, GRASS);
grass.castShadow = true;
grass.receiveShadow = true;
scene.add(grass);

const FLOWERS = 1100;
const flowerGeo = buildCard(0.135, 1.0);
makeSway(flowerGeo, FLOWERS, 0.16, 0.34, 5.0);
const fCol = new Float32Array(FLOWERS * 3);
const PETALS = [
  [0.86, 0.80, 0.66],
  [0.80, 0.44, 0.52],
  [0.90, 0.72, 0.34],
  [0.72, 0.62, 0.86],
  [0.92, 0.90, 0.86]
];
for (let i = 0; i < FLOWERS; i++) {
  const c = PETALS[(rnd() * PETALS.length) | 0];
  fCol[i * 3] = c[0];
  fCol[i * 3 + 1] = c[1];
  fCol[i * 3 + 2] = c[2];
}
flowerGeo.setAttribute('aCol', new THREE.InstancedBufferAttribute(fCol, 3));

const flowerMat = new THREE.MeshStandardNodeMaterial({ roughness: 0.78, metalness: 0.0 });
{
  const aPh = attribute('aPhase', 'float');
  const aWd = attribute('aWind', 'vec2');
  const aCol = attribute('aCol', 'vec3');
  const yy = positionLocal.y;
  const sway = sin(uTime.mul(1.55).add(aPh)).mul(0.6)
    .add(sin(uTime.mul(0.82).add(aPh.mul(1.6))).mul(0.4));
  const bend = yy.mul(yy).mul(sway).mul(0.26);
  flowerMat.positionNode = vec3(
    positionLocal.x.add(aWd.x.mul(bend)),
    positionLocal.y.sub(bend.mul(bend).mul(0.5)),
    positionLocal.z.add(aWd.y.mul(bend))
  );
  const leaf = vec3(0.055, 0.105, 0.045);
  flowerMat.colorNode = mix(leaf, aCol, ss(0.48, 0.78, uv().y));
}
const flowers = new THREE.InstancedMesh(flowerGeo, flowerMat, FLOWERS);
flowers.castShadow = true;
scene.add(flowers);

/* ---------- materials ---------- */
const stoneWallMat = new THREE.MeshStandardNodeMaterial({ roughness: 0.94, metalness: 0.0 });
{
  const g = fbm(positionWorld.mul(0.75), 6.1).mul(0.5).add(0.5);
  const g2 = fbm(positionWorld.mul(3.0), 13.7).mul(0.5).add(0.5);
  const base = mix(vec3(0.135, 0.135, 0.125), vec3(0.30, 0.285, 0.26), g);
  stoneWallMat.colorNode = mix(base, vec3(0.052, 0.105, 0.058), ss(0.35, 0.95, normalize(positionWorld).y).mul(ss(0.35, 0.85, g2)).mul(0.75));
}
const plasterMat = new THREE.MeshStandardNodeMaterial({ roughness: 0.95, metalness: 0.0 });
plasterMat.colorNode = mix(vec3(0.30, 0.27, 0.235), vec3(0.42, 0.37, 0.30), fbm(positionWorld.mul(1.8), 2.9).mul(0.5).add(0.5));
const roofMat = new THREE.MeshStandardNodeMaterial({ roughness: 0.98, metalness: 0.0, side: THREE.DoubleSide });
roofMat.colorNode = mix(vec3(0.048, 0.056, 0.052), vec3(0.10, 0.105, 0.085), fbm(positionWorld.mul(3.4), 8.8).mul(0.5).add(0.5));
const woodMat = new THREE.MeshStandardNodeMaterial({ roughness: 0.85, metalness: 0.0 });
woodMat.colorNode = vec3(0.072, 0.048, 0.030);
const frameMat = new THREE.MeshStandardNodeMaterial({ roughness: 0.9, metalness: 0.0 });
frameMat.colorNode = vec3(0.16, 0.13, 0.10);

const windowMat = new THREE.MeshStandardNodeMaterial({ roughness: 0.35, metalness: 0.0 });
windowMat.colorNode = vec3(0.10, 0.07, 0.04);
windowMat.emissiveNode = vec3(1.0, 0.62, 0.28).mul(uWin).mul(2.6);

/* ---------- prism ---------- */
function prism(W, H, D) {
  const x0 = -W / 2, x1 = W / 2, z0 = -D / 2, z1 = D / 2;
  const v = [
    x0, 0, z1, x1, 0, z1, 0, H, z1,
    x1, 0, z0, x0, 0, z0, 0, H, z0,
    x1, 0, z1, x1, 0, z0, 0, H, z0,
    x1, 0, z1, 0, H, z0, 0, H, z1,
    x0, 0, z0, x0, 0, z1, 0, H, z1,
    x0, 0, z0, 0, H, z1, 0, H, z0
  ];
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(v, 3));
  g.computeVertexNormals();
  return g;
}

/* ---------- cottage ---------- */
const COT_Z = 40;
const COT_X = creekXJS(COT_Z) + 13.6;
const COT_Y = bankHJS(COT_X, COT_Z);

const cottage = new THREE.Group();
cottage.position.set(COT_X, COT_Y - 0.35, COT_Z);
cottage.rotation.y = -Math.PI / 2;

const boxGeoCache = {};
const boxGeo = (w, h, d) => {
  const k = w + '_' + h + '_' + d;
  if (!boxGeoCache[k]) boxGeoCache[k] = new THREE.BoxGeometry(w, h, d);
  return boxGeoCache[k];
};

function part(parent, geo, mat, x, y, z, rx, ry, rz) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  if (rx) m.rotation.x = rx;
  if (ry) m.rotation.y = ry;
  if (rz) m.rotation.z = rz;
  m.castShadow = true;
  m.receiveShadow = true;
  parent.add(m);
  return m;
}

part(cottage, boxGeo(6.6, 3.3, 5.2), plasterMat, 0, 1.65, 0);
part(cottage, prism(7.4, 2.5, 5.9), roofMat, 0, 3.3, 0);
part(cottage, boxGeo(0.9, 2.1, 0.25), woodMat, -1.9, 1.05, 2.62);

const skyGeo = new THREE.SphereGeometry(500, 32, 16);

{
  const d = normalize(positionWorld.sub(cameraPosition));

  const lowCold = vec3(0.055, 0.085, 0.125);

  const lowWarm = vec3(0.30, 0.27, 0.29);

  const low = mix(lowCold, lowWarm, uDawn);
  const high = mix(highCold, highWarm, uDawn);

  const sunDir = normalize(vec3(float(-0.36), float(0.22), float(0.91)));
  const g = max(dot(d, sunDir), 0.0);
  c = c.add(vec3(1.0, 0.55, 0.26).mul(pow(g, 5.0)).mul(uDawn).mul(0.85));
  skyMat.colorNode = c;
}

/* ---------- animation ---------- */
const clock = new THREE.Clock(false);
let elapsed = 0;
const posV = new THREE.Vector3();
const tgtV = new THREE.Vector3();
const aV = new THREE.Vector3();
const bV = new THREE.Vector3();

const cSunCold = new THREE.Color(0x24365c);
const cSunWarm = new THREE.Color(0xffb877);
const cSkyCold = new THREE.Color(0x14203a);
const cSkyWarm = new THREE.Color(0x94aac6);
const cGndCold = new THREE.Color(0x06090b);
const cGndWarm = new THREE.Color(0x2b2a1f);
const cFogCold = new THREE.Color(0x070f1a);
const cFogWarm = new THREE.Color(0x39404f);

renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.1);
  elapsed += dt;

  const t = (elapsed % LOOP) / LOOP;
  uTime.value = elapsed;

  const dawn = ssj(0.12, 0.60, t) * (1.0 - ssj(0.86, 1.0, t));
  const win = ssj(0.20, 0.42, t) * (1.0 - ssj(0.94, 1.0, t));
  uDawn.value = dawn;
  uWin.value = win;

  path.getPointAt(t, posV);
  camera.position.copy(posV);
  camera.position.y += Math.sin(elapsed * 2.15) * 0.022;

  path.getPointAt((t + 0.038) % 1, tgtV);
  camera.lookAt(tgtV);

  path.getPointAt((t + 0.020) % 1, aV);
  path.getPointAt((t + 0.062) % 1, bV);
  const a0 = Math.atan2(aV.x - posV.x, aV.z - posV.z);
  const a1 = Math.atan2(bV.x - aV.x, bV.z - aV.z);
  let da = a1 - a0;
  while (da > Math.PI) da -= Math.PI * 2;
  while (da < -Math.PI) da += Math.PI * 2;
  const roll = THREE.MathUtils.clamp(da * 1.5, -0.12, 0.12);
  camera.rotateZ(roll + Math.sin(elapsed * 0.9) * 0.012);

  sky.position.copy(camera.position);

  sun.color.copy(cSunCold).lerp(cSunWarm, dawn);
  sun.intensity = 0.12 + dawn * 2.0;
  sun.target.position.set(camera.position.x, 0, camera.position.z);
  sun.position.set(camera.position.x - 42, 30, camera.position.z + 54);

  hemi.color.copy(cSkyCold).lerp(cSkyWarm, dawn);
  hemi.groundColor.copy(cGndCold).lerp(cGndWarm, dawn);
  hemi.intensity = 0.34 + dawn * 0.95;

  scene.fog.color.copy(cFogCold).lerp(cFogWarm, dawn);
  scene.background.copy(scene.fog.color);
  renderer.toneMappingExposure = 1.05 + dawn * 0.18;

  post.render();
});

/* ---------- audio ---------- */
function startAudio() {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  const ctx = new AC();
  if (ctx.state === 'suspended') ctx.resume();

  const n = Math.floor(ctx.sampleRate * 4);
  const buf = ctx.createBuffer(1, n, ctx.sampleRate);
  const d = buf.getChannelData(0);
  let last = 0;
  for (let i = 0; i < n; i++) {
    const w = Math.random() * 2 - 1;
    last = (last + 0.021 * w) / 1.021;
    d[i] = last * 3.4 + w * 0.055;
  }
  const src = ctx.createBufferSource();
  src.buffer = buf;
  src.loop = true;

  const hp = ctx.createBiquadFilter();
  hp.type = 'highpass';
  hp.frequency.value = 110;

  const lp = ctx.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.value = 880;
  lp.Q.value = 0.35;

  const g = ctx.createGain();
  g.gain.value = 0.0001;

  src.connect(hp);
  hp.connect(lp);
  lp.connect(g);
  g.connect(ctx.destination);
  src.start();

  g.gain.exponentialRampToValueAtTime(0.040, ctx.currentTime + 7.0);

  const lfo = ctx.createOscillator();
  lfo.type = 'sine';
  lfo.frequency.value = 0.058;
  const lg = ctx.createGain();
  lg.gain.value = 240;
  lfo.connect(lg);
  lg.connect(lp.frequency);
  lfo.start();

  const o = ctx.createOscillator();
  o.type = 'sine';
  o.frequency.value = 57.5;
  const og = ctx.createGain();
  og.gain.value = 0.0001;
  o.connect(og);
  og.connect(ctx.destination);
  o.start();
  og.gain.exponentialRampToValueAtTime(0.011, ctx.currentTime + 9.0);
}

/* ---------- start ---------- */
const enter = document.getElementById('enter');
let begun = false;
function begin() {
  if (begun) return;
  begun = true;
  enter.classList.add('off');
  clock.start();
  try {
    startAudio();
  } catch (e) {
    /* silent */
  }
}
enter.addEventListener('click', begin);
window.addEventListener('keydown', begin);
window.addEventListener('touchstart', begin, { passive: true });
