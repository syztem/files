    else if (window.__eholoDebug) window.__eholoDebug('frame', (err && (err.stack || err.message)) || err);
  }
});
</script>
</head>
<body>
<noscript><p class="note">This piece needs JavaScript. Turn it on, or open this page in a current Chrome, Edge, Safari or Firefox.</p></noscript>
<p class="note" id="boot" role="status"></p>
<script>
(function () {
  var note = document.getElementById('boot'), failed = false;
  function show(text) { if (note.isConnected) note.textContent = text; }
  setTimeout(function () { if (!window.__eholo && !failed) show('Loading…'); }, 700);
  addEventListener('load', function () {
    if (window.__eholo) return;
    failed = true;
    show('This piece could not load three.js from cdn.jsdelivr.net. Check your connection or any content blocker, then reload. It also needs a current Chrome, Edge, Safari or Firefox.');
  });
})();
</script>

<pre class="perf dbg" id="dbg" hidden role="log" aria-label="Errors"></pre>
<script>
(function () {
  if (!/[?&]debug=1(&|$)/.test(location.search)) return;
  var box = document.getElementById('dbg'), n = 0;
  function show(kind, msg) {
    if (++n > 60) return;
    box.hidden = false;
    box.textContent += kind + ': ' + String(msg).slice(0, 800) + '\n';
  }
  window.__eholoDebug = show;
  addEventListener('error', function (e) {
    var el = e.target;
    if (el && el !== window && (el.src || el.href)) show('load failed', el.src || el.href);
    else show('error', (e.message || 'error') + (e.filename ? ' (' + e.filename.split('/').pop().split('?')[0] + ':' + e.lineno + ')' : ''));
  }, true);
  addEventListener('unhandledrejection', function (e) { var r = e.reason; show('rejection', (r && (r.stack || r.message)) || r); });
})();
