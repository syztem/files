:root{color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#000;overflow:hidden}
body{font:400 15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#cfd3dc;-webkit-font-smoothing:antialiased}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
#shell{position:fixed;inset:0;display:grid;place-items:center;z-index:2;pointer-events:none;transition:background .8s ease}
.st{display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;padding:24px;pointer-events:auto;animation:in 1.2s cubic-bezier(.2,.7,.2,1) both}

.msg{font:400 11px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#5c6170;letter-spacing:.2em;min-height:1em}
.go{appearance:none;cursor:pointer;font:500 12px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.36em;text-transform:uppercase;color:#fff;padding:19px 36px 19px 41px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:rgba(10,6,6,.4);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:inset 0 0 18px rgba(255,120,70,.12);transition:border-color .3s,box-shadow .3s,transform .3s}
.go:hover,.go:focus-visible{border-color:#fff;outline:none;box-shadow:0 0 38px rgba(255,130,80,.3),inset 0 0 24px rgba(255,130,80,.22);transform:translateY(-1px)}
.fine{font:400 10px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.24em;color:#747988;text-transform:uppercase}
.gate{align-self:end;margin-bottom:max(8vh,36px)}
.play{pointer-events:none}
.hint{position:fixed;left:0;right:0;bottom:24px;animation:hint 3.4s ease forwards}
.one p{font:300 17px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#c9cfdb;max-width:40ch}
#cap{position:fixed;left:0;right:0;top:max(7vh,28px);z-index:3;display:flex;justify-content:center;pointer-events:none}
.cap{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:0 24px;animation:cap 8.5s ease both}
.cap h2{font:200 clamp(18px,3vw,32px)/1.1 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.42em;margin-right:-.42em;text-transform:uppercase;color:#efe6da;text-shadow:0 0 18px rgba(0,0,0,.9)}
.cap p{font:400 10px/1.7 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.2em;text-transform:uppercase;color:#9aa0ae;max-width:64ch;text-shadow:0 0 10px #000}
.cap[data-i="8"]{animation-duration:11s}
html[data-phase="play"],html[data-phase="play"] *{cursor:none}
html[data-phase="load"] #shell,html[data-phase="end"] #shell,html[data-phase="nogpu"] #shell,html[data-phase="fail"] #shell{background:#000}
html[data-phase="gate"] #shell{background:radial-gradient(120% 90% at 50% 40%,transparent 40%,rgba(0,0,0,.6))}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes hint{0%,55%{opacity:.75}100%{opacity:0}}
@keyframes cap{0%{opacity:0;filter:blur(6px)}12%{opacity:1;filter:none}80%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.st,.hint,.bar i,.cap{animation:none;transition:none}}

<script type="text/plain" id="wk">
class FR extends AudioWorkletProcessor {
  constructor(o) {
    super();
    const po = o.processorOptions;
    this.x = new WebAssembly.Instance(new WebAssembly.Module(po.b), {}).exports;
    this.x.s_init(sampleRate);
    this.bar = po.bar | 0;
    this.x.s_seek(this.bar);
    this.mx = this.x.s_max();
    this.p = this.x.s_out();
    this.n = 0;
    this.on = !!po.go;
    this.sent = false;
    this.port.onmessage = e => {
      if (e.data === "go") { this.x.s_seek(0); this.on = true; this.sent = false; }
      else if (e.data === "stop") { this.on = false; }
    };
  }
  views(n) {
    this.n = n;
    this.l = new Float32Array(this.x.memory.buffer, this.p, n);
    this.r = new Float32Array(this.x.memory.buffer, this.p + this.mx * 4, n);
  }
  process(i, o) {
    const out = o[0];
    if (!this.on || !out || !out[0]) return true;
    const L = out[0];
    const n = L.length;
    if (n !== this.n) this.views(n);
    if (!this.sent) { this.sent = true; this.port.postMessage(currentFrame); }
    this.x.s_render(n);
    L.set(this.l);
    if (out[1]) out[1].set(this.r);
    return true;
  }
}
registerProcessor("proc", FR);
</script>

<script type="text/plain" id="w-common">
@group(0) @binding(0) var<uniform> u: U;
@group(0) @binding(1) var nt: texture_3d<f32>;
@group(0) @binding(2) var sr: sampler;
const PI = 3.14159265;
const TAU = 6.2831853;
fn h1(n: f32) -> f32 { return fract(sin(n * 127.1 + 0.37) * 43758.5453); }
fn h21(p: vec2f) -> f32 { var p3 = fract(vec3f(p.x, p.y, p.x) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
fn n3(p: vec3f) -> vec4f { return textureSampleLevel(nt, sr, p, 0.0); }
fn r2(a: f32) -> mat2x2f { let c = cos(a); let s = sin(a); return mat2x2f(c, s, -s, c); }
fn sech2(x: f32) -> f32 { let t = tanh(x); return 1.0 - t * t; }
fn tpos(s: f32) -> vec3f {
  let a = u.tp[0]; let b = u.tp[1]; let c = u.tp[2]; let d = u.tp[3];
  let x = a.x * (sin(a.y * s + a.z) - sin(a.z)) + a.w * sin(b.x * s);
  let y = b.y * s + b.z * sin(b.w * s) + c.x * 0.5 * (1.0 + tanh((s - c.y) / c.z)) + c.w * 0.5 * (1.0 + tanh((s - d.x) / d.y));
  return vec3f(x, y, -s);
}
fn tder(s: f32) -> vec3f {
  let a = u.tp[0]; let b = u.tp[1]; let c = u.tp[2]; let d = u.tp[3];
  let x = a.x * a.y * cos(a.y * s + a.z) + a.w * b.x * cos(b.x * s);
  let y = b.y + b.z * b.w * cos(b.w * s) + c.x * 0.5 * sech2((s - c.y) / c.z) / c.z + c.w * 0.5 * sech2((s - d.x) / d.y) / d.y;
  return vec3f(x, y, -1.0);
}
fn tf(p: vec3f) -> vec3f {
  var s = -p.z;
  for (var i = 0; i < 2; i++) {
    let D = tder(s);
    s += dot(p - tpos(s), D) / dot(D, D);
  }
  let P = tpos(s);
  let T = normalize(tder(s));
  let R = normalize(vec3f(-T.z, 0.0, T.x));
  let N = cross(R, T);
  let d = p - P;
  return vec3f(dot(d, R), dot(d, N), s);
}
fn rose(c: vec2f) -> f32 {
  let r = length(c);
  if (r > 1.0) { return 0.0; }
  let a = atan2(c.y, c.x);
  let sa = fract(a / TAU * 12.0 + 0.5) - 0.5;
  var m = smoothstep(0.012, 0.03, abs(sa) * r * 0.52) + step(r, 0.2);
  m = min(m, 1.0);
  m *= smoothstep(0.012, 0.03, abs(r - 0.2)) * smoothstep(0.012, 0.03, abs(r - 0.62));
  let a2 = sa * TAU / 12.0;
  let pc = r * vec2f(cos(a2), sin(a2)) - vec2f(0.82, 0.0);
  m *= smoothstep(0.01, 0.026, abs(length(pc) - 0.13));
  m *= smoothstep(1.0, 0.95, r);
  return m;
}
fn cookie(k: i32, v: vec3f, dir: vec3f, tn: f32) -> f32 {
  let up = select(vec3f(0.0, 1.0, 0.0), vec3f(1.0, 0.0, 0.0), abs(dir.y) > 0.9);
  let rr = normalize(cross(up, dir));
  let uu = cross(dir, rr);
  let z = max(dot(v, dir), 1e-3);
  let c = vec2f(dot(v, rr), dot(v, uu)) / (z * tn);
  if (k == 1) { return rose(c) * 1.3 + 0.03; }
  if (k == 2) { let n = n3(vec3f(c * 0.55 + vec2f(0.31, 0.17), 0.5 + u.cam.w * 0.004)).x; return smoothstep(0.52, 0.66, n); }
  if (k == 3) { let a = atan2(c.y, c.x) + u.cam.w * 0.35; let r = length(c); return clamp(smoothstep(-0.25, 0.25, sin(a * 6.0)) * smoothstep(0.12, 0.2, r) + step(r, 0.08), 0.0, 1.0); }
  if (k == 4) { return smoothstep(0.25, 0.4, abs(fract(c.y * 3.5) - 0.5)); }
  if (k == 5) { return smoothstep(0.08, 0.18, abs(fract(c.x * 4.0) - 0.5)) * smoothstep(0.06, 0.14, abs(fract(c.y * 1.5) - 0.5)); }
  return 1.0;
}
struct LS { c: vec3f, l: vec3f, d: f32 }
fn lightAt(i: i32, x: vec3f) -> LS {
  let a = u.L[i * 3]; let b = u.L[i * 3 + 1]; let c = u.L[i * 3 + 2];
  let dv = a.xyz - x;
  let d2 = dot(dv, dv);
  let d = sqrt(d2);
  let l = dv / max(d, 1e-4);
  var att = 1.0 / (d2 + 0.04);
  let w = clamp(1.0 - d2 / (a.w * a.w), 0.0, 1.0);
  att *= w * w;
  if (b.w > -1.5 && att > 0.0) {
    let cs = dot(-l, c.xyz);
    att *= smoothstep(b.w, mix(b.w, 1.0, 0.3), cs);
    let ck = i32(c.w) % 10;
    if (ck > 0 && cs > b.w) {
      let tn = sqrt(max(1.0 - b.w * b.w, 1e-4)) / max(b.w, 1e-3);
      att *= cookie(ck, -dv, c.xyz, tn);
    }
  }
  return LS(b.rgb * att, l, d);
}
fn ign(p: vec2f) -> f32 { return fract(52.9829189 * fract(dot(p, vec2f(0.06711056, 0.00583715)))); }

<script type="text/plain" id="w-scene">
fn sdBox(p: vec3f, b: vec3f) -> f32 { let q = abs(p) - b; return length(max(q, vec3f(0.0))) + min(max(q.x, max(q.y, q.z)), 0.0); }
fn sdB2(p: vec2f, b: vec2f) -> f32 { let q = abs(p) - b; return length(max(q, vec2f(0.0))) + min(max(q.x, q.y), 0.0); }
fn sdRB(p: vec3f, b: vec3f, r: f32) -> f32 { return sdBox(p, b - vec3f(r)) - r; }
fn sdCap(p: vec3f, a: vec3f, b: vec3f, r: f32) -> f32 { let pa = p - a; let ba = b - a; let h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0); return length(pa - ba * h) - r; }
fn smin(a: f32, b: f32, k: f32) -> f32 { let h = max(k - abs(a - b), 0.0) / k; return min(a, b) - h * h * k * 0.25; }
fn um(a: vec2f, b: vec2f) -> vec2f { return select(a, b, b.x < a.x); }
fn rep(x: f32, c: f32) -> f32 { return x - c * round(x / c); }
fn par(i: f32) -> bool { return (i32(i) & 1) == 0; }

fn rails(q: vec3f) -> vec2f {
  let rd = sdB2(vec2f(abs(q.x) - 0.55, q.y + 0.07), vec2f(0.03, 0.07));
  let sl = sdBox(vec3f(q.x, q.y + 0.19, rep(q.z, 0.75)), vec3f(0.8, 0.045, 0.11));
  return um(vec2f(rd, 3.0), vec2f(sl, 4.0));
}
fn portal(q: vec3f) -> vec2f {
  let e = u.misc.y;
  if (e <= 0.0) { return vec2f(1e3, 0.0); }
  let z = q.z - e;
  if (abs(z) > 3.0) { return vec2f(abs(z) - 2.5, 0.0); }
  let hole = sdB2(vec2f(q.x, q.y - 1.7), vec2f(1.35, 2.1));
  let wall = max(max(abs(z) - 0.3, -hole), sdB2(vec2f(q.x, q.y - 4.0), vec2f(18.0, 14.0)));
  let o = u.misc.z;
  let dr = sdBox(vec3f(abs(q.x) - 0.68 - o * 1.38, q.y - 1.7, z), vec3f(0.67, 2.08, 0.07));
  let r = um(vec2f(wall, 5.0), vec2f(dr, 14.0));
  let lp = length(vec3f(abs(q.x) - 1.75, q.y - 4.1, z + 0.38)) - 0.11;
  return um(r, vec2f(lp, 20.0));
}
fn car(p: vec3f) -> vec2f {
  let d = p - u.cam.xyz;
  let c = vec3f(dot(d, u.cx.xyz), dot(d, u.cy.xyz), dot(d, u.cz.xyz));
  let b = sdBox(c - vec3f(0.0, -0.95, 0.95), vec3f(1.0, 0.7, 1.0));
  if (b > 0.25) { return vec2f(b, 1.0); }
  var hull = sdRB(c - vec3f(0.0, -1.05, 1.0), vec3f(0.8, 0.36, 0.62), 0.22);
  hull = smin(hull, sdCap(c, vec3f(-0.6, -0.8, 1.42), vec3f(0.6, -0.8, 1.42), 0.2), 0.18);
  hull = max(hull, -sdRB(c - vec3f(0.0, -0.62, 0.22), vec3f(0.64, 0.3, 0.42), 0.12));
  var r = vec2f(hull, 1.0);
  let bar = min(sdCap(c, vec3f(-0.5, -0.36, 0.62), vec3f(0.5, -0.36, 0.62), 0.03), sdCap(vec3f(abs(c.x), c.y, c.z), vec3f(0.5, -0.36, 0.62), vec3f(0.56, -0.74, 0.74), 0.028));
  let trim = sdCap(vec3f(abs(c.x), c.y, c.z), vec3f(0.79, -0.7, 0.45), vec3f(0.79, -0.7, 1.4), 0.025);
  r = um(r, vec2f(min(bar, trim), 2.0));
  r = um(r, vec2f(length(c - vec3f(0.0, -0.62, 1.63)) - 0.045, 19.0));
  return r;
}
fn gear(v: vec2f, R: f32, n: f32, ang: f32) -> f32 {
  let r = length(v);
  let a0 = atan2(v.y, v.x) + ang;
  let sec = TAU / n;
  let a = a0 - sec * round(a0 / sec);
  let w = vec2f(cos(a), sin(a)) * r;
  var g = min(r - R, sdB2(w - vec2f(R, 0.0), vec2f(0.3, 0.2)));
  let s2 = TAU / 6.0;
  let a3 = a0 - s2 * round(a0 / s2);
  let w2 = vec2f(cos(a3), sin(a3)) * r;
  g = max(g, -(length(w2 - vec2f(R * 0.56, 0.0)) - R * 0.25));
  return max(g, -(r - 0.3));
}

fn s0(p: vec3f, q: vec3f) -> vec2f {
  var r = rails(q);
  r = um(r, vec2f(p.y + 0.3, 5.0));
  r = um(r, vec2f(sdBox(p - vec3f(-4.6, 0.25, -4.0), vec3f(3.2, 0.55, 20.0)), 5.0));
  r = um(r, vec2f(sdBox(p - vec3f(-1.45, 0.8, -4.0), vec3f(0.07, 0.015, 20.0)), 18.0));
  r = um(r, vec2f(min(9.0 - abs(p.x), 8.6 - p.y), 6.0));
  let z6 = rep(p.z - 3.0, 6.0);
  r = um(r, vec2f(sdBox(vec3f(abs(p.x) - 5.2, p.y - 4.0, z6), vec3f(0.32, 5.0, 0.32)), 15.0));
  r = um(r, vec2f(sdBox(vec3f(p.x, p.y - 7.7, z6), vec3f(9.0, 0.28, 0.16)), 14.0));
  let lq = vec3f(p.x, p.y - 5.4, rep(p.z, 6.0));
  let rr = length(lq.xz);
  let cable = max(rr - 0.012, -lq.y);
  let shade = max(abs(rr - (0.1 - lq.y * 0.85)) / 1.31 - 0.012, abs(lq.y + 0.2) - 0.2);
  r = um(r, vec2f(min(cable, shade), 14.0));
  r = um(r, vec2f(length(lq - vec3f(0.0, -0.22, 0.0)) - 0.065, 9.0));
  return r;
}
fn s1(p: vec3f, q: vec3f) -> vec2f {
  var r = rails(q);
  r = um(r, vec2f(sdRB(vec3f(q.x, q.y + 0.02, rep(q.z - u.cz.w, 0.32)), vec3f(0.035, 0.03, 0.13), 0.02), 14.0));
  let inner = sdB2(vec2f(q.x, q.y - 1.5), vec2f(0.9, 1.1)) - 1.1;
  var wall = min(-inner, max(-(inner + 0.16), abs(rep(q.z, 3.2)) - 0.22));
  let wz = q.z - 21.0;
  wall = max(wall, -sdBox(vec3f(q.x - 41.6, q.y - 41.1, wz), vec3f(40.0, 40.0, 3.0)));
  r = um(r, vec2f(wall, 6.0));
  let bars = max(max(sdB2(vec2f(q.x - 2.0, rep(wz, 0.6)), vec2f(0.05, 0.04)), abs(wz) - 3.0), q.y - 3.6);
  r = um(r, vec2f(bars, 14.0));
  let lz = rep(q.z - 3.0, 7.0);
  r = um(r, vec2f(length(vec3f(q.x + 1.8, q.y - 2.45, lz)) - 0.08, 21.0));
  r = um(r, vec2f(sdBox(vec3f(q.x + 1.95, q.y - 2.45, lz), vec3f(0.1, 0.035, 0.035)), 14.0));
  return r;
}
fn s2(p: vec3f, q: vec3f) -> vec2f {

    case 24: { o.alb = vec3f(0.0); o.em = vec3f(1.0, 0.82, 0.62) * u.sp[1].y; }
    case 25: { o.alb = vec3f(0.6, 0.56, 0.48); o.ro = 0.5; }
    case 26: { o.alb = vec3f(0.5, 0.48, 0.45) * (0.75 + 0.35 * nz.x); o.ro = 0.4; }

}
fn shade(p: vec3f, n: vec3f, rd: vec3f, m: f32, full: bool) -> vec3f {
  let mt = mat(m, p, n);

  for (var i = 0; i < 12; i++) {
    if (i >= nl) { break; }

    let ndl = dot(n, ls.l);
    if (ndl <= 0.0 || max(ls.c.r, max(ls.c.g, ls.c.b)) < 1e-5) { continue; }

    let nh = max(dot(n, h), 0.0);
    let vh = max(dot(v, h), 0.0);
    let dd = nh * nh * (a2 - 1.0) + 1.0;
    let D = a2 / (PI * dd * dd);
    let vis = 0.5 / max(ndl * sqrt(nv * nv * (1.0 - a2) + a2) + nv * sqrt(ndl * ndl * (1.0 - a2) + a2), 1e-4);

fn sky(rd: vec3f) -> vec3f {

    let k = max(dot(rd, md), 0.0);
    c = vec3f(0.008, 0.012, 0.03) + vec3f(0.7, 0.8, 1.0) * smoothstep(0.9993, 0.9996, k) * 6.0 + vec3f(0.2, 0.3, 0.6) * pow(k, 12.0) * 0.12;

fn fogm(ro: vec3f, rd: vec3f, tm: f32, j: f32) -> vec4f {
  let n = 20;

  var T = 1.0;
  var acc = vec3f(0.0);
  let g = u.fogc.w;
  let nl = i32(u.misc.x);
  let t = u.cam.w;
  let amb = u.fogc.rgb * u.fog.w * 0.3;
  for (var i = 0; i < 20; i++) {
    let s = (f32(i) + j) * dt;

}
struct FO { @location(0) c: vec4f, @builtin(frag_depth) d: f32 }
@vertex fn vs(@builtin(vertex_index) i: u32) -> @builtin(position) vec4f {
  let x = f32(i32(i & 1u) * 4 - 1);
  let y = f32(i32(i >> 1u) * 4 - 1);
  return vec4f(x, y, 0.0, 1.0);
}
@fragment fn fs(@builtin(position) fp: vec4f) -> FO {
  let ndc = vec2f(fp.x / u.res.x * 2.0 - 1.0, 1.0 - fp.y / u.res.y * 2.0);
  let a = u.ivp * vec4f(ndc, 0.0, 1.0);
  let b = u.ivp * vec4f(ndc, 1.0, 1.0);
  let ro = u.cam.xyz;
  let rd = normalize(b.xyz / b.w - a.xyz / a.w);
  let h = march(ro, rd, 170.0, 150);

  var td = 1e4;
  var dep = 1.0;
  var cr = false;
  if (h.y > 0.5) {
    let p = ro + rd * h.x;
    var n = nor(p, h.x);
    if (h.y == 8.0) {
      let w = n3(vec3f(p.x * 0.25, u.cam.w * 0.03, p.z * 0.25));
      n = normalize(n + vec3f(w.x - 0.5, 0.0, w.z - 0.5) * 0.06);
    }
    col = shade(p, n, rd, h.y, true);
    if (h.y == 8.0 || h.y == 13.0 || h.y == 1.0) {
      var rr = reflect(rd, n);
      if (h.y == 8.0) { rr = normalize(vec3f(rr.x, max(rr.y, 0.03), rr.z)); }
      let fr = 0.02 + 0.98 * pow(1.0 - max(dot(n, -rd), 0.0), 5.0);

      if (h2.y > 0.5) {

        rc = shade(p2, nor(p2, h2.x), rr, h2.y, false) * exp(-h2.x * u.fog.x * 0.6);

      col += rc * select(fr, 0.15 + 0.85 * fr, h.y == 8.0);
    }
    td = h.x;
    let cp = u.vp * vec4f(p, 1.0);
    dep = clamp(cp.z / cp.w, 0.0, 1.0);
    cr = h.y == 1.0 || h.y == 2.0 || h.y == 19.0;
  } else {
    col = sky(rd);
  }
  let j = fract(ign(fp.xy) + u.res.z * 0.618034);
  let fg = fogm(ro, rd, min(td, 70.0), j);
  col = col * fg.w + fg.rgb;
  col = select(max(col, vec3f(0.0)), vec3f(0.0), col != col);
  col = min(col, vec3f(400.0));
  var o: FO;
  o.c = vec4f(col, select(td, -td, cr));
  o.d = dep;
  return o;
}

<script type="text/plain" id="w-part">
@group(0) @binding(3) var<storage, read> parts: array<vec4f>;
struct PO { @builtin(position) p: vec4f, @location(0) q: vec2f, @location(1) c: vec3f }
@vertex fn pvs(@builtin(vertex_index) vi: u32, @builtin(instance_index) ii: u32) -> PO {
  let P = parts[ii * 2u];
  let V = parts[ii * 2u + 1u];
  var o: PO;
  let rel = P.xyz - u.cam.xyz;
  let B = u.pm.w;
  let edge = max(abs(rel.x), max(abs(rel.y), abs(rel.z)));
  let fade = smoothstep(B, B * 0.75, edge) * smoothstep(0.35, 0.9, length(rel));
  var cp = u.vp * vec4f(P.xyz, 1.0);
  var cs = array<vec2f, 6>(vec2f(-1.0, -1.0), vec2f(1.0, -1.0), vec2f(-1.0, 1.0), vec2f(-1.0, 1.0), vec2f(1.0, -1.0), vec2f(1.0, 1.0));
  let c = cs[vi];
  let hs = fract(V.w * 91.7);
  let sz0 = u.pm.z * (0.5 + hs);
  let mn = 1.6 / u.res.y * cp.w;
  let sz = max(sz0, mn);
  let k = (sz0 / sz) * (sz0 / sz);
  cp = vec4f(cp.xy + c * sz * vec2f(u.res.y / u.res.x, 1.0) * 1.0, cp.zw);
  var li = vec3f(0.0);
  let nl = i32(u.misc.x);
  for (var i = 0; i < 12; i++) {
    if (i >= nl) { break; }
    li += lightAt(i, P.xyz).c;
  }
  let em = u.pc.rgb * u.pm.y * (0.3 + 0.7 * pow(0.5 + 0.5 * sin(u.cam.w * (1.0 + hs * 2.0) + V.w * 40.0), 3.0));
  o.p = cp;
  o.q = c;
  o.c = (li * 0.03 + em) * fade * k;
  return o;
}
@fragment fn pfs(o: PO) -> @location(0) vec4f {
  let r2 = dot(o.q, o.q);
  let a = max(exp(-r2 * 4.0) - 0.018, 0.0);
  return vec4f(o.c * a, 0.0);
}

<script type="text/plain" id="w-sim">
@group(0) @binding(0) var<uniform> u: U;
@group(0) @binding(1) var<storage, read_write> P: array<vec4f>;
fn fld(p: vec3f, t: f32) -> vec3f {
  return vec3f(sin(p.y * 1.3 + t) + sin(p.z * 0.7 - t * 0.6), sin(p.z * 1.1 + t * 0.8) + sin(p.x * 0.9 + t * 0.5), sin(p.x * 1.2 - t * 0.7) + sin(p.y * 0.8 + t * 0.4));
}
@compute @workgroup_size(64) fn sim(@builtin(global_invocation_id) g: vec3u) {
  let i = g.x;
  if (i >= arrayLength(&P) / 2u) { return; }
  var p = P[i * 2u];
  var v = P[i * 2u + 1u];
  let dt = u.pc.w;
  let t = u.cam.w;
  let mode = i32(u.pm.x);
  let sd = v.w;
  var acc = fld(p.xyz * 0.4 + sd, t * 0.25) * 0.08 - v.xyz * 0.5;
  if (mode == 1) { acc += vec3f(0.0, -0.25 + 0.2 * fract(sd * 7.3), 0.0); }
  if (mode == 2) {
    let c = p.xyz - u.cam.xyz;
    acc += vec3f(-c.z, 0.0, c.x) * 0.02 + vec3f(0.0, 0.12, 0.0) + fld(p.xyz * 0.9, t) * 0.12;
  }
  if (mode == 3) { acc = -v.xyz * 4.0; }
  v = vec4f(v.xyz + acc * dt, sd);
  var x = p.xyz + v.xyz * dt;
  let B = u.pm.w;
  let c = u.cam.xyz;
  x = c + (fract((x - c) / (2.0 * B) + 0.5) - 0.5) * 2.0 * B;
  P[i * 2u] = vec4f(x, p.w);
  P[i * 2u + 1u] = v;
}

<script type="text/plain" id="w-taa">
@group(0) @binding(3) var cur: texture_2d<f32>;
@group(0) @binding(4) var hist: texture_2d<f32>;
@group(0) @binding(5) var sl: sampler;
struct QO { @builtin(position) p: vec4f, @location(0) uv: vec2f }
@vertex fn vq(@builtin(vertex_index) i: u32) -> QO {
  var o: QO;
  let x = f32(i32(i & 1u) * 4 - 1);
  let y = f32(i32(i >> 1u) * 4 - 1);
  o.p = vec4f(x, y, 0.0, 1.0);
  o.uv = vec2f(x * 0.5 + 0.5, 0.5 - y * 0.5);
  return o;
}
fn ycc(c: vec3f) -> vec3f { return vec3f(dot(c, vec3f(0.25, 0.5, 0.25)), dot(c, vec3f(0.5, 0.0, -0.5)), dot(c, vec3f(-0.25, 0.5, -0.25))); }
fn rgb(c: vec3f) -> vec3f { return vec3f(c.x + c.y - c.z, c.x + c.z, c.x - c.y - c.z); }
fn tm(c: vec3f) -> vec3f { return c / (1.0 + max(c.r, max(c.g, c.b))); }
fn itm(c: vec3f) -> vec3f { return c / max(1.0 - max(c.r, max(c.g, c.b)), 1e-3); }
fn reproj(uv: vec2f, t: f32) -> vec2f {
  let ndc = vec2f(uv.x * 2.0 - 1.0, 1.0 - uv.y * 2.0);
  let a = u.uivp * vec4f(ndc, 0.0, 1.0);
  let b = u.uivp * vec4f(ndc, 1.0, 1.0);
  let rd = normalize(b.xyz / b.w - a.xyz / a.w);
  let w = u.cam.xyz + rd * min(t, 3000.0);
  let pc = u.pvp * vec4f(w, 1.0);
  let pn = pc.xy / pc.w;
  return vec2f(pn.x * 0.5 + 0.5, 0.5 - pn.y * 0.5);
}
@fragment fn taa(o: QO) -> @location(0) vec4f {
  let uv = o.uv;
  let sc = u.res.xy / u.post2.xy;
  let ts = 1.0 / u.post2.xy;
  let lim = sc - ts * 0.5;
  let cuv = clamp(uv * sc, ts * 0.5, lim);
  let c0 = textureSampleLevel(cur, sl, cuv, 0.0);
  var m1 = vec3f(0.0);
  var m2 = vec3f(0.0);
  for (var k = 0; k < 9; k++) {
    let off = vec2f(f32(k % 3) - 1.0, f32(k / 3) - 1.0) * ts;
    let s = ycc(tm(textureSampleLevel(cur, sl, clamp(cuv + off, ts * 0.5, lim), 0.0).rgb));
    m1 += s;
    m2 += s * s;
  }
  m1 /= 9.0;
  let sg = sqrt(max(m2 / 9.0 - m1 * m1, vec3f(0.0)));
  let mn = m1 - sg * 1.25;
  let mx = m1 + sg * 1.25;
  let t = abs(c0.a);
  var puv = reproj(uv, t);
  if (c0.a < 0.0) { puv = uv; }
  let ok = all(puv >= vec2f(0.0)) && all(puv <= vec2f(1.0)) && u.post3.w < 0.5;
  var h = ycc(tm(textureSampleLevel(hist, sl, puv, 0.0).rgb));
  h = clamp(h, mn, mx);
  let cc = ycc(tm(c0.rgb));
  let al = select(1.0, 0.1, ok);
  let r = itm(rgb(mix(h, cc, al)));
  return vec4f(max(r, vec3f(0.0)), c0.a);
}

<script type="text/plain" id="w-comp">
@group(0) @binding(3) var img: texture_2d<f32>;
@group(0) @binding(4) var blm: texture_2d<f32>;
@group(0) @binding(5) var sl: sampler;
struct QO { @builtin(position) p: vec4f, @location(0) uv: vec2f }
@vertex fn vq(@builtin(vertex_index) i: u32) -> QO {
  var o: QO;
  let x = f32(i32(i & 1u) * 4 - 1);
  let y = f32(i32(i >> 1u) * 4 - 1);
  o.p = vec4f(x, y, 0.0, 1.0);
  o.uv = vec2f(x * 0.5 + 0.5, 0.5 - y * 0.5);
  return o;
}
fn reproj(uv: vec2f, t: f32) -> vec2f {
  let ndc = vec2f(uv.x * 2.0 - 1.0, 1.0 - uv.y * 2.0);
  let a = u.uivp * vec4f(ndc, 0.0, 1.0);
  let b = u.uivp * vec4f(ndc, 1.0, 1.0);
  let rd = normalize(b.xyz / b.w - a.xyz / a.w);
  let w = u.cam.xyz + rd * min(t, 3000.0);
  let pc = u.pvp * vec4f(w, 1.0);
  let pn = pc.xy / pc.w;

}
fn agx(v: vec3f) -> vec3f {
  let m = mat3x3f(0.842479062253094, 0.0423282422610123, 0.0423756549057051, 0.0784335999999992, 0.878468636469772, 0.0784336, 0.0792237451477643, 0.0791661274605434, 0.879142973793104);
  let lo = -12.47393;
  let hi = 4.026069;
  var x = m * max(v, vec3f(1e-10));
  x = clamp(log2(x), vec3f(lo), vec3f(hi));

  let x4 = x2 * x2;

}
fn hq(p: vec2f) -> f32 { var p3 = fract(vec3f(p.x, p.y, p.x) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }

  let ca = ctr * u.post3.z * (0.3 + dot(ctr, ctr) * 3.0);
  let cr = textureSampleLevel(img, sl, uv + ca, 0.0).r;
  let cb = textureSampleLevel(img, sl, uv - ca, 0.0).b;

  col += textureSampleLevel(blm, sl, uv, 0.0).rgb * u.post.w;
  col *= u.post2.z;
  var c = agx(col);
  c = pow(max(c, vec3f(0.0)), vec3f(1.18));
  let vq = ctr * vec2f(asp, 1.0);
  c *= 1.0 - u.post3.y * smoothstep(0.3, 1.15, length(vq));
  let gr = hq(o.p.xy * 1.37 + fract(u.cam.w * 13.7) * 1000.0) + nz - 1.0;
  let lum = dot(c, vec3f(0.3, 0.6, 0.1));
  c += gr * u.post3.x * (0.25 + 0.75 * (1.0 - lum)) * (0.4 + lum);
  c *= u.post2.w;
  c += (hq(o.p.xy + 0.5) - 0.5) / 255.0;
  return vec4f(clamp(c, vec3f(0.0), vec3f(1.0)), 1.0);
}
</script>
<script type="text/plain" id="w-post">
struct PU { a: vec4f, b: vec4f, c: vec4f, e: vec4f }
@group(0) @binding(0) var<uniform> pu: PU;

  BGSIM = dev.createBindGroup({ layout: PSIM.getBindGroupLayout(0), entries: [{ binding: 0, resource: { buffer: UB } }, { binding: 1, resource: { buffer: PARTB } }] });
  prog(0.8, "warming up the ride");
  for (let i = 0; i < 8; i++) {
    draw(SCN[i] + 3, 1 / 60, false);
    await done();
    prog(0.8 + 0.2 * (i + 1) / 8, "warming up the ride");
  }
  resetParts();
  ready = true;
  prog(1, "ready");
  next("gate");
}
boot().catch(() => next("fail"));
</script>
