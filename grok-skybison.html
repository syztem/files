<style>
:root{color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#0b0a10;overflow:hidden}
body{font:400 15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#e9e1d2;-webkit-font-smoothing:antialiased}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
#shell{position:fixed;inset:0;display:grid;place-items:center;z-index:2;pointer-events:none;transition:background .8s ease}
.st{display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;padding:24px;pointer-events:auto;animation:in 1.2s cubic-bezier(.2,.7,.2,1) both}
.ttl{font:400 clamp(38px,8vw,100px)/1 ui-serif,Georgia,"Times New Roman",serif;letter-spacing:.28em;text-transform:uppercase;margin-right:-.28em;color:#f6ecd8;text-shadow:0 2px 0 rgba(20,10,8,.6),0 0 22px rgba(20,10,8,.55),0 0 44px rgba(242,163,58,.22)}
.sub{font:400 11px/1.7 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.3em;text-transform:uppercase;color:#d8cbb2;text-shadow:0 1px 6px rgba(0,0,0,.8)}
.bar{width:min(340px,62vw);height:2px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:14px;border-radius:2px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#3a6ea5,#f2a33a);transform-origin:0 50%;transform:scaleX(0);transition:transform .3s ease}
.msg{font:400 11px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8a8273;letter-spacing:.2em;min-height:1em}
.card{max-width:min(46ch,84vw);padding:22px 26px;border-radius:14px;background:rgba(18,14,12,.62);border:1px solid rgba(242,214,160,.22);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);display:flex;flex-direction:column;gap:10px;text-align:left}
.card p{font:400 15px/1.6 ui-serif,Georgia,"Times New Roman",serif;color:#efe6d4}
.go{appearance:none;cursor:pointer;font:500 12px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.36em;text-transform:uppercase;color:#fff8ea;padding:19px 36px 19px 41px;border-radius:999px;border:1px solid rgba(255,236,200,.4);background:rgba(120,44,14,.45);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:inset 0 0 18px rgba(242,163,58,.18);transition:border-color .3s,box-shadow .3s,transform .3s}
.go:hover,.go:focus-visible{border-color:#fff;outline:none;box-shadow:0 0 38px rgba(242,163,58,.35),inset 0 0 24px rgba(242,163,58,.3);transform:translateY(-1px)}
.go.alt{background:rgba(30,60,96,.45);box-shadow:inset 0 0 18px rgba(120,180,240,.18)}
.fine{font:400 10px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.24em;color:#cfc4ad;text-transform:uppercase;text-shadow:0 1px 6px rgba(0,0,0,.9)}
.gate{align-self:end;margin-bottom:max(8vh,36px);padding:48px 12vw 40px;background:radial-gradient(closest-side,rgba(24,14,10,.55),rgba(24,14,10,.32) 55%,transparent)}
.play{pointer-events:none}
.hint{position:fixed;left:0;right:0;bottom:24px;animation:hint 3.4s ease forwards}
.one p{font:300 17px/1.6 ui-serif,Georgia,serif;color:#e9e1d2;max-width:40ch}
#cap{position:fixed;left:0;right:0;top:max(9vh,34px);z-index:3;display:flex;justify-content:center;pointer-events:none}
.cap{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:0 24px;animation:cap 9s ease both}
.cap h2{font:400 clamp(20px,3.2vw,36px)/1.1 ui-serif,Georgia,"Times New Roman",serif;letter-spacing:.36em;margin-right:-.36em;text-transform:uppercase;color:#fbf3e2;text-shadow:0 2px 0 rgba(20,10,8,.6),0 0 18px rgba(0,0,0,.7)}
.cap p{font:400 10px/1.7 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.2em;text-transform:uppercase;color:#efe4cc;max-width:64ch;text-shadow:0 1px 8px #000,0 0 2px #000}
.cap[data-i="5"]{animation-duration:10s}
html[data-phase="play"],html[data-phase="play"] *{cursor:none}
html[data-phase="load"] #shell,html[data-phase="end"] #shell,html[data-phase="nogpu"] #shell,html[data-phase="fail"] #shell{background:#0b0a10}
html[data-phase="brief"] #shell{background:radial-gradient(120% 90% at 50% 45%,rgba(11,10,16,.25) 30%,rgba(11,10,16,.82))}
html[data-phase="gate"] #shell{background:radial-gradient(120% 90% at 50% 40%,transparent 40%,rgba(11,10,16,.55))}
.hud,.dbg{position:fixed;z-index:5;margin:0;padding:10px 12px;font:400 11px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#ffe9c2;background:rgba(0,0,0,.66);border-radius:4px;pointer-events:none;white-space:pre}
.hud{left:12px;top:12px}
.dbg{right:12px;top:12px}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes hint{0%,55%{opacity:.75}100%{opacity:0}}
@keyframes cap{0%{opacity:0;filter:blur(6px)}10%{opacity:1;filter:none}80%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.st,.hint,.bar i,.cap{animation:none;transition:none}}
</style>

<script type="text/plain" id="wk">
class FR extends AudioWorkletProcessor {
  constructor(o) {
    super();
    const po = o.processorOptions;
    this.x = new WebAssembly.Instance(new WebAssembly.Module(po.b), {}).exports;
    this.x.s_init(sampleRate);
    this.bar = po.bar | 0;
    this.x.s_seek(this.bar);
    this.mx = this.x.s_max();
    this.p = this.x.s_out();
    this.n = 0;
    this.on = !!po.go;
    this.sent = false;
    this.port.onmessage = e => {
      if (e.data === "go") { this.x.s_seek(0); this.on = true; this.sent = false; }
      else if (e.data === "stop") { this.on = false; }
    };
  }
  views(n) {
    this.n = n;
    this.l = new Float32Array(this.x.memory.buffer, this.p, n);
    this.r = new Float32Array(this.x.memory.buffer, this.p + this.mx * 4, n);
  }
  process(i, o) {
    const out = o[0];
    if (!this.on || !out || !out[0]) return true;
    const L = out[0];
    const n = L.length;
    if (n !== this.n) this.views(n);
    if (!this.sent) { this.sent = true; this.port.postMessage(currentFrame); }
    this.x.s_render(n);
    L.set(this.l);
    if (out[1]) out[1].set(this.r);
    return true;
  }
}
registerProcessor("proc", FR);
</script>

<script type="text/plain" id="w-common">
@group(0) @binding(0) var<uniform> u: U;
@group(0) @binding(1) var nt: texture_3d<f32>;
@group(0) @binding(2) var sr: sampler;
const PI = 3.14159265;
const TAU = 6.2831853;
fn h1(n: f32) -> f32 { return fract(sin(n * 127.1 + 0.37) * 43758.5453); }
fn h21(p: vec2f) -> f32 { var p3 = fract(vec3f(p.x, p.y, p.x) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
var<private> FPV: f32 = 0.0;
fn n3(p: vec3f) -> vec4f { return textureSampleLevel(nt, sr, p, 0.0); }
fn nk(x: vec3f, k: f32) -> vec4f { return textureSampleLevel(nt, sr, x, clamp(log2(max(FPV * k * 64.0, 1.0)), 0.0, 6.0)); }
fn nw(p: vec3f, k: f32) -> vec4f { return nk(p * k, k); }
fn aaf(k: f32) -> f32 { return clamp(1.0 - FPV * k * 1.5, 0.0, 1.0); }
fn stripe(x: f32, duty: f32, k: f32) -> f32 {
  let w = max(FPV * k, 1e-4);
  let tw = abs(fract(x) - 0.5) * 2.0;
  let v = smoothstep(duty - w, duty + w, tw);
  return mix(v, 1.0 - duty, smoothstep(0.2, 0.45, w));
}
fn wasp() -> f32 { return u.res.x / u.res.y; }
fn wfwd(n: vec2f) -> vec2f {
  let K = u.post3.z;
  let a = wasp();
  let h = vec2f(a, 1.0) * 0.5;
  let p = n * h;
  let z = 1.0 / (1.0 + K * a * a * 0.25);
  return p * (1.0 + K * dot(p, p)) * z / h;
}
fn wbwd(m: vec2f) -> vec2f {
  let K = u.post3.z;
  let a = wasp();
  let h = vec2f(a, 1.0) * 0.5;
  let q = m * h;
  let z = 1.0 / (1.0 + K * a * a * 0.25);
  let qr = length(q);
  if (qr < 1e-6) { return m; }
  var r = qr;
  for (var i = 0; i < 4; i++) { r -= (z * r * (1.0 + K * r * r) - qr) / (z * (1.0 + 3.0 * K * r * r)); }
  return q / qr * r / h;
}
fn wreproj(uv: vec2f, t: f32) -> vec2f {
  let ndc = wfwd(vec2f(uv.x * 2.0 - 1.0, 1.0 - uv.y * 2.0));
  let a = u.uivp * vec4f(ndc, 0.0, 1.0);
  let b = u.uivp * vec4f(ndc, 1.0, 1.0);
  let rd = normalize(b.xyz / b.w - a.xyz / a.w);
  let w = u.cam.xyz + rd * min(t, 3000.0);
  let pc = u.pvp * vec4f(w, 1.0);
  let pn = wbwd(pc.xy / max(pc.w, 1e-4));
  return vec2f(pn.x * 0.5 + 0.5, 0.5 - pn.y * 0.5);
}
fn r2(a: f32) -> mat2x2f { let c = cos(a); let s = sin(a); return mat2x2f(c, s, -s, c); }
fn th(x: f32) -> f32 { return tanh(clamp(x, -12.0, 12.0)); }
fn sech2(x: f32) -> f32 { let t = th(x); return 1.0 - t * t; }
fn tpos(s: f32) -> vec3f {
  let a = u.tp[0]; let b = u.tp[1]; let c = u.tp[2]; let d = u.tp[3];
  let x = a.x * (sin(a.y * s + a.z) - sin(a.z)) + a.w * sin(b.x * s);
  var y = b.y * s + b.z * sin(b.w * s) + c.x * 0.5 * (1.0 + th((s - c.y) / c.z)) + c.w * 0.5 * (1.0 + th((s - d.x) / d.y)) + d.z;
  var xx = x;
  for (var i = 0; i < 8; i++) { let m = u.bm[i]; if (m.z <= 0.0) { break; } let g = (s - m.x) / m.z; let e = exp(-g * g); xx += m.y * e; y += m.w * e; }
  return vec3f(xx, y, -s);
}
fn tder(s: f32) -> vec3f {
  let a = u.tp[0]; let b = u.tp[1]; let c = u.tp[2]; let d = u.tp[3];
  let x = a.x * a.y * cos(a.y * s + a.z) + a.w * b.x * cos(b.x * s);
  var y = b.y + b.z * b.w * cos(b.w * s) + c.x * 0.5 * sech2((s - c.y) / c.z) / c.z + c.w * 0.5 * sech2((s - d.x) / d.y) / d.y;
  var xx = x;
  for (var i = 0; i < 8; i++) { let m = u.bm[i]; if (m.z <= 0.0) { break; } let g = (s - m.x) / m.z; let e = -2.0 * g * exp(-g * g) / m.z; xx += m.y * e; y += m.w * e; }
  return vec3f(xx, y, -1.0);
}
fn tf(p: vec3f) -> vec3f {
  var s = -p.z;
  for (var i = 0; i < 2; i++) {
    let D = vec3f(tder(s).x, 0.0, -1.0);
    let P = tpos(s);
    s += dot(vec3f(p.x - P.x, 0.0, p.z - P.z), D) / dot(D, D);
  }
  let P = tpos(s);
  let T = normalize(vec3f(tder(s).x, 0.0, -1.0));
  let R = vec3f(-T.z, 0.0, T.x);
  let d = p - P;
  return vec3f(dot(d, R), d.y, s);
}
struct LS { c: vec3f, l: vec3f, d: f32 }
fn lightAt(i: i32, x: vec3f) -> LS {
  let a = u.L[i * 3]; let b = u.L[i * 3 + 1];
  let dv = a.xyz - x;
  let d2 = dot(dv, dv);
  let d = sqrt(d2);
  let l = dv / max(d, 1e-4);
  var att = 1.0 / (d2 + 0.25);
  let w = clamp(1.0 - d2 / (a.w * a.w), 0.0, 1.0);
  att *= w * w;
  return LS(b.rgb * att, l, d);
}
fn ign(p: vec2f) -> f32 { return fract(52.9829189 * fract(dot(p, vec2f(0.06711056, 0.00583715)))); }
fn band(x: f32) -> f32 { return 0.32 + 0.38 * smoothstep(-0.04, 0.04, x) + 0.3 * smoothstep(0.42, 0.5, x); }
</script>
<script type="text/plain" id="w-scene">
fn sdBox(p: vec3f, b: vec3f) -> f32 { let q = abs(p) - b; return length(max(q, vec3f(0.0))) + min(max(q.x, max(q.y, q.z)), 0.0); }

@group(0) @binding(3) var<storage, read> parts: array<vec4f>;

@group(0) @binding(3) var cur: texture_2d<f32>;
@group(0) @binding(4) var gbf: texture_2d<f32>;
@group(0) @binding(5) var sl: sampler;
struct QO { @builtin(position) p: vec4f, @location(0) uv: vec2f }
@vertex fn vq(@builtin(vertex_index) i: u32) -> QO {

  o.uv = vec2f(x * 0.5 + 0.5, 0.5 - y * 0.5);

}
fn emis(id: f32) -> bool { return id == 20.0 || id == 22.0 || id == 25.0 || id == 26.0 || id == 40.0 || id == 9.0; }
@fragment fn ink(o: QO) -> @location(0) vec4f {
  let ip = vec2i(o.p.xy);

  let g = textureLoad(gbf, ip, 0);

  let lt0 = log(t0 + 0.3);

    var d = vec2i(1, 0);

    let dz = log(abs(s.a) + 0.3) - lt0;
    var ed = smoothstep(0.07, 0.16, dz);

      ed = max(ed, smoothstep(0.25, 0.45, nd) * 0.85);

  let lum = dot(c.rgb, vec3f(0.3, 0.6, 0.1));
  let inkc = vec3f(0.05, 0.04, 0.06) * min(lum, 1.0);
  let col = mix(c.rgb, inkc, k * 0.92);

}

<script type="text/plain" id="w-taa">
@group(0) @binding(3) var cur: texture_2d<f32>;
@group(0) @binding(4) var hist: texture_2d<f32>;
@group(0) @binding(5) var sl: sampler;
struct QO { @builtin(position) p: vec4f, @location(0) uv: vec2f }
@vertex fn vq(@builtin(vertex_index) i: u32) -> QO {
  var o: QO;
  let x = f32(i32(i & 1u) * 4 - 1);
  let y = f32(i32(i >> 1u) * 4 - 1);
  o.p = vec4f(x, y, 0.0, 1.0);
  o.uv = vec2f(x * 0.5 + 0.5, 0.5 - y * 0.5);
  return o;
}
fn ycc(c: vec3f) -> vec3f { return vec3f(dot(c, vec3f(0.25, 0.5, 0.25)), dot(c, vec3f(0.5, 0.0, -0.5)), dot(c, vec3f(-0.25, 0.5, -0.25))); }
fn rgb(c: vec3f) -> vec3f { return vec3f(c.x + c.y - c.z, c.x + c.z, c.x - c.y - c.z); }
fn tm(c: vec3f) -> vec3f { return c / (1.0 + max(c.r, max(c.g, c.b))); }

@fragment fn taa(o: QO) -> @location(0) vec4f {
  let uv = o.uv;
  let sc = u.res.xy / u.post2.xy;
  let ts = 1.0 / u.post2.xy;
  let lim = sc - ts * 0.5;
  let cuv = clamp(uv * sc, ts * 0.5, lim);
  let c0 = textureSampleLevel(cur, sl, cuv, 0.0);
  var m1 = vec3f(0.0);
  var m2 = vec3f(0.0);
  for (var k = 0; k < 9; k++) {
    let off = vec2f(f32(k % 3) - 1.0, f32(k / 3) - 1.0) * ts;
    let s = ycc(tm(textureSampleLevel(cur, sl, clamp(cuv + off, ts * 0.5, lim), 0.0).rgb));
    m1 += s;
    m2 += s * s;
  }
  m1 /= 9.0;
  let sg = sqrt(max(m2 / 9.0 - m1 * m1, vec3f(0.0)));
  let mn = m1 - sg * 1.1;
  let mx = m1 + sg * 1.1;
  let t = abs(c0.a);
  var puv = wreproj(uv, t);
  if (c0.a < 0.0) { puv = uv; }
  let ok = all(puv >= vec2f(0.0)) && all(puv <= vec2f(1.0)) && u.post3.w < 0.5;

  let mpx = length((puv - uv) * u.post2.xy);
  let al = select(1.0, mix(0.07, 0.2, smoothstep(2.0, 24.0, mpx)), ok);
  let r = itm(rgb(mix(h, cc, al)));
  return vec4f(max(r, vec3f(0.0)), c0.a);
}
</script>
<script type="text/plain" id="w-comp">
@group(0) @binding(3) var img: texture_2d<f32>;
@group(0) @binding(4) var blm: texture_2d<f32>;

struct QO { @builtin(position) p: vec4f, @location(0) uv: vec2f }
@vertex fn vq(@builtin(vertex_index) i: u32) -> QO {
  var o: QO;

  let y = f32(i32(i >> 1u) * 4 - 1);

  let J = S(uv + t * vec2f(1.0, 1.0));
  let K = S(uv + t * vec2f(-2.0, 2.0));

<script type="text/plain" id="w-noise">
@group(0) @binding(0) var dst: texture_storage_3d<rgba8unorm, write>;
fn hu(p: vec3u) -> f32 {

}
fn wor(x: vec3f, per: u32) -> f32 {
