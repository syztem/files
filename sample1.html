const causticPattern = Fn(([p, t]) => {
  const q1 = p.mul(0.85).add(vec2(t.mul(0.14), t.mul(-0.09)));
  const q2 = p.mul(1.32).add(vec2(t.mul(-0.11), t.mul(0.16)));
  const q3 = p.mul(0.55).add(vec2(t.mul(0.07), t.mul(0.08)));
  const w1 = sin(q1.x.add(sin(q1.y.mul(1.25).add(t.mul(0.35)))));
  const w2 = cos(q2.y.add(cos(q2.x.mul(1.15).sub(t.mul(0.28)))));
  const w3 = sin(q3.x.add(q3.y).add(t.mul(0.22)));
  const ridge = float(1.0).sub(abs(w1.add(w2).mul(0.5)));
  const c = pow(clamp(ridge, 0.0, 1.0), 5.0).mul(0.75).add(pow(clamp(w3.mul(0.5).add(0.5), 0.0, 1.0), 4.0).mul(0.25));
  return c;
});

const softNoise3 = Fn(([p]) => {
  const a = sin(p.x.mul(1.7).add(p.z.mul(1.1))).mul(cos(p.y.mul(1.9).sub(p.z.mul(0.8))));
  const b = sin(p.x.mul(3.1).sub(p.y.mul(2.3)).add(p.z.mul(2.7))).mul(0.5);
  return a.add(b).mul(0.5).add(0.5);
});

const skyMat = new THREE.MeshBasicNodeMaterial({

skyMat.colorNode = Fn(() => {
  const dir = normalize(positionWorld.sub(cameraPosition));
  const h = clamp(dir.y, -1.0, 1.0);
  const horizonBand = exp(abs(h.sub(0.02)).mul(-7.5));
  const zenith = vec3(0.055, 0.068, 0.088);
  const mid = vec3(0.14, 0.165, 0.195);
  const mist = mix(vec3(0.32, 0.35, 0.38), vec3(0.38, 0.34, 0.31), uScrollProgress);
  const lower = vec3(0.07, 0.082, 0.098);
  const base = mix(lower, mix(mid, zenith, smoothstep(0.0, 0.72, h)), smoothstep(-0.25, 0.04, h));
  const breath = sin(time.mul(0.18).add(dir.x.mul(1.8))).mul(0.025).add(0.975);
  return mix(base, mist, horizonBand.mul(0.88)).mul(breath);
})();

  const causticTint = mix(vec3(0.76, 0.82, 0.88), vec3(0.92, 0.84, 0.74), uScrollProgress);
  return base.add(causticTint.mul(c).mul(prox).mul(radialFade).mul(0.24));
})();

})();
floorMat.emissiveNode = Fn(() => {
  const wp = positionWorld;

})();

function createMemoryMaterial(baseHex, warmTintHex, chapterZ, roughnessVal = 0.68, emissiveBoost = 0.22) {
  const mat = new THREE.MeshStandardNodeMaterial({
    roughness: roughnessVal,
    metalness: 0.05,
    transparent: true,
    depthWrite: true
  });
  const cBase = new THREE.Color(baseHex);
  const cTint = new THREE.Color(warmTintHex);
  const baseVec = vec3(cBase.r, cBase.g, cBase.b);
  const tintVec = vec3(cTint.r, cTint.g, cTint.b);
  const zTarget = float(chapterZ);

  const proximityNode = Fn(() => {
    const dz = abs(uFocusZ.sub(zTarget));
    return smoothstep(23.0, 4.5, dz);
  });

  mat.colorNode = Fn(() => {
    const p = proximityNode();
    const n = softNoise3(positionWorld.mul(1.4).add(vec3(0.0, time.mul(0.08), 0.0)));
    const up = clamp(normalWorld.y, 0.0, 1.0);
    const c = causticPattern(positionWorld.xz.mul(1.6), time.mul(0.9));
    return mix(baseVec, tintVec, n.mul(0.35)).add(tintVec.mul(c).mul(up).mul(0.18).mul(p));
  })();

  mat.emissiveNode = Fn(() => {
    const p = proximityNode();
    const viewDir = normalize(cameraPosition.sub(positionWorld));
    const fresnel = pow(float(1.0).sub(clamp(abs(dot(normalWorld, viewDir)), 0.0, 1.0)), 2.8);
    const n = softNoise3(positionWorld.mul(1.9).add(vec3(0.0, time.mul(0.15), 0.0)));
    const edgeGlow = smoothstep(0.12, 0.55, p).mul(float(1.0).sub(smoothstep(0.55, 0.98, p))).mul(n);
    const breath = sin(time.mul(0.45).add(zTarget.mul(0.2))).mul(0.15).add(0.85);
    return tintVec.mul(fresnel.mul(emissiveBoost).add(edgeGlow.mul(0.42))).mul(p).mul(breath);
  })();

  mat.opacityNode = Fn(() => {
    const p = proximityNode();
    const n = softNoise3(positionWorld.mul(1.6).sub(vec3(0.0, time.mul(0.12), 0.0)));
    const reveal = smoothstep(n.mul(0.55), n.mul(0.55).add(0.42), p);
    return clamp(reveal.mul(0.94), 0.0, 0.94);
  })();

  return mat;
}

function createLuminousPlaneMaterial(colorHex, intensity = 1.0, fadePower = 2.0, chapterZ = null) {
  const mat = new THREE.MeshBasicNodeMaterial({
    transparent: true,
    depthWrite: false,
    side: THREE.DoubleSide,
    blending: THREE.AdditiveBlending
  });
  const col = new THREE.Color(colorHex);
  const colVec = vec3(col.r, col.g, col.b);

  mat.colorNode = Fn(() => {
    const st = uv();
    const breath = sin(time.mul(0.32).add(st.y.mul(1.5))).mul(0.08).add(0.92);
    const grad = mix(vec3(0.75, 0.82, 0.9), colVec, smoothstep(0.0, 1.0, st.y));
    return grad.mul(intensity).mul(breath);
  })();

  mat.opacityNode = Fn(() => {
    const st = uv();
    const ex = sin(st.x.mul(Math.PI));
    const ey = sin(st.y.mul(Math.PI));
    const softEdge = pow(clamp(ex.mul(ey), 0.0, 1.0), fadePower);
    const viewDir = normalize(cameraPosition.sub(positionWorld));
    const facing = pow(clamp(abs(dot(normalWorld, viewDir)), 0.0, 1.0), 0.75);
    const dist = abs(positionWorld.z.sub(cameraPosition.z));
    const nearFade = smoothstep(1.2, 5.5, dist);
    const farFade = smoothstep(75.0, 14.0, dist);
    let prox = float(1.0);
    if (chapterZ !== null) {
      prox = smoothstep(38.0, 7.0, abs(uFocusZ.sub(float(chapterZ)))).mul(0.75).add(0.25);
    }
    return softEdge.mul(facing).mul(nearFade).mul(farFade).mul(prox).mul(0.42);
  })();

  return mat;
}

function createCurtainMaterial(colorHex, chapterZ) {
  const mat = new THREE.MeshStandardNodeMaterial({
    roughness: 0.85,
    metalness: 0.0,
    transparent: true,
    depthWrite: false,
    side: THREE.DoubleSide
  });
  const col = new THREE.Color(colorHex);
  const colVec = vec3(col.r, col.g, col.b);
  const zTarget = float(chapterZ);

  mat.positionNode = Fn(() => {
    const pos = positionLocal.toVar();
    const sway = sin(pos.y.mul(1.4).add(time.mul(0.55)).add(pos.x.mul(2.1))).mul(0.09);
    const factor = smoothstep(1.8, -1.8, pos.y);
    pos.z.addAssign(sway.mul(factor));
    return pos;
  })();

  mat.colorNode = colVec;
  mat.emissiveNode = Fn(() => {
    const p = smoothstep(26.0, 5.0, abs(uFocusZ.sub(zTarget)));
    return colVec.mul(0.28).mul(p);
  })();
  mat.opacityNode = Fn(() => {
    const st = uv();
    const p = smoothstep(25.0, 5.0, abs(uFocusZ.sub(zTarget)));
    const edge = sin(st.x.mul(Math.PI)).mul(smoothstep(0.0, 0.22, st.y));
    return clamp(edge.mul(p).mul(0.46), 0.0, 0.46);
  })();

  return mat;
}

function addAreaLight(color, intensity, w, h, pos, lookTarget) {

function sampleMemoryParticles(totalCount) {
  const homePos = new Float32Array(totalCount * 3);
  const initPos = new Float32Array(totalCount * 3);
  const initVel = new Float32Array(totalCount * 3);
  const seeds = new Float32Array(totalCount * 4);

  const triangles = [];
  let totalArea = 0;

  const vA = new THREE.Vector3();
  const vB = new THREE.Vector3();
  const vC = new THREE.Vector3();
  const ab = new THREE.Vector3();
  const ac = new THREE.Vector3();
  const cross = new THREE.Vector3();

  for (const entry of memoryGroups) {
    entry.group.updateMatrixWorld(true);
    entry.group.traverse((obj) => {
      if (!obj.isMesh || !obj.geometry) return;
      const geom = obj.geometry;
      const posAttr = geom.attributes.position;
      if (!posAttr) return;
      const idx = geom.index;
      const matW = obj.matrixWorld;
      const triCount = idx ? idx.count / 3 : posAttr.count / 3;

      for (let i = 0; i < triCount; i++) {
        const i0 = idx ? idx.getX(i * 3) : i * 3;
        const i1 = idx ? idx.getX(i * 3 + 1) : i * 3 + 1;
        const i2 = idx ? idx.getX(i * 3 + 2) : i * 3 + 2;

        vA.fromBufferAttribute(posAttr, i0).applyMatrix4(matW);
        vB.fromBufferAttribute(posAttr, i1).applyMatrix4(matW);
        vC.fromBufferAttribute(posAttr, i2).applyMatrix4(matW);

        ab.subVectors(vB, vA);
        ac.subVectors(vC, vA);
        cross.crossVectors(ab, ac);
        const area = cross.length() * 0.5;
        if (area > 0.00001) {
          totalArea += area;
          triangles.push({
            cumArea: totalArea,
            ax: vA.x, ay: vA.y, az: vA.z,
            bx: vB.x, by: vB.y, bz: vB.z,
            cx: vC.x, cy: vC.y, cz: vC.z,
            czChapter: entry.z
          });
        }
      }
    });
  }

  const memoryCount = Math.floor(totalCount * 0.72);

  for (let i = 0; i < totalCount; i++) {
    const i3 = i * 3;
    const i4 = i * 4;

    if (i < memoryCount && triangles.length > 0) {
      const rArea = Math.random() * totalArea;
      let lo = 0;
      let hi = triangles.length - 1;
      while (lo < hi) {
        const mid = (lo + hi) >> 1;
        if (triangles[mid].cumArea < rArea) lo = mid + 1;
        else hi = mid;
      }
      const tri = triangles[lo];
      let r1 = Math.random();
      let r2 = Math.random();
      if (r1 + r2 > 1) {
        r1 = 1 - r1;
        r2 = 1 - r2;
      }
      const r0 = 1 - r1 - r2;

      const jitter = (Math.random() - 0.5) * 0.035;
      const hx = tri.ax * r0 + tri.bx * r1 + tri.cx * r2 + jitter;
      const hy = tri.ay * r0 + tri.by * r1 + tri.cy * r2 + jitter;
      const hz = tri.az * r0 + tri.bz * r1 + tri.cz * r2 + jitter;

      homePos[i3] = hx;
      homePos[i3 + 1] = hy;
      homePos[i3 + 2] = hz;

      initPos[i3] = hx + (Math.random() - 0.5) * 3.8;
      initPos[i3 + 1] = hy + Math.random() * 2.6;
      initPos[i3 + 2] = hz + (Math.random() - 0.5) * 3.8;

      seeds[i4] = Math.random() * Math.PI * 2;
      seeds[i4 + 1] = 0.45 + Math.random() * 0.85;
      seeds[i4 + 2] = tri.czChapter;
      seeds[i4 + 3] = 0.0;
    } else {
      const ax = (Math.random() - 0.5) * 18.0;
      const ay = 0.2 + Math.random() * 6.8;
      const az = 2.0 - Math.random() * 144.0;

      homePos[i3] = ax;
      homePos[i3 + 1] = ay;
      homePos[i3 + 2] = az;

      initPos[i3] = ax;
      initPos[i3 + 1] = ay;
      initPos[i3 + 2] = az;

      seeds[i4] = Math.random() * Math.PI * 2;
      seeds[i4 + 1] = 0.5 + Math.random() * 1.1;
      seeds[i4 + 2] = az;
      seeds[i4 + 3] = 1.0;
    }

    initVel[i3] = 0;
    initVel[i3 + 1] = 0;
    initVel[i3 + 2] = 0;
  }

  return { homePos, initPos, initVel, seeds };
}

const PARTICLE_COUNT = 36000;
const pData = sampleMemoryParticles(PARTICLE_COUNT);

const homeBuffer = instancedArray(pData.homePos, 'vec3');
const posBuffer = instancedArray(pData.initPos, 'vec3');
const velBuffer = instancedArray(pData.initVel, 'vec3');
const seedBuffer = instancedArray(pData.seeds, 'vec4');

const computeParticles = Fn(() => {
  const pos = posBuffer.element(instanceIndex);
  const vel = velBuffer.element(instanceIndex);
  const home = homeBuffer.element(instanceIndex);
  const seed = seedBuffer.element(instanceIndex);

  const phase = seed.x;
  const chapterZ = seed.z;
  const kind = seed.w;

  const dt = min(deltaTime, float(0.033));
  const dz = abs(uFocusZ.sub(chapterZ));
  const materialize = smoothstep(26.0, 5.5, dz);
  const dissolve = float(1.0).sub(materialize);

  const swirlX = sin(time.mul(0.32).add(phase).add(pos.y.mul(0.85))).mul(0.28);
  const swirlY = cos(time.mul(0.24).add(phase.mul(1.3)).add(pos.x.mul(0.7))).mul(0.18).add(0.14);
  const swirlZ = cos(time.mul(0.29).add(phase.mul(0.7)).add(pos.y.mul(0.65))).mul(0.28);
  const driftForce = vec3(swirlX, swirlY, swirlZ);

  If(kind.lessThan(0.5), () => {
    const breathOffset = vec3(
      sin(time.mul(0.6).add(phase)).mul(0.018),
      cos(time.mul(0.5).add(phase.mul(1.2))).mul(0.018),
      sin(time.mul(0.45).add(phase.mul(0.8))).mul(0.018)
    );
    const target = home.add(breathOffset);
    const toHome = target.sub(pos);
    const springStrength = mix(0.22, 3.6, materialize);
    const scatter = driftForce.mul(dissolve.mul(2.1).add(uScrollSpeed.mul(0.95)));

    vel.addAssign(toHome.mul(springStrength).add(scatter).mul(dt));
    vel.mulAssign(mix(0.965, 0.87, materialize));
    pos.addAssign(vel.mul(dt));

    const distFromHome = length(pos.sub(home));
    If(distFromHome.greaterThan(6.5), () => {
      pos.assign(home.add(vec3(swirlX, swirlY, swirlZ).mul(2.4)));
      vel.mulAssign(0.2);
    });
  }).Else(() => {
    const ambientTarget = home.add(vec3(
      sin(time.mul(0.22).add(phase)).mul(1.2),
      cos(time.mul(0.18).add(phase.mul(1.4))).mul(0.7),
      sin(time.mul(0.16).add(phase.mul(0.9))).mul(1.2)
    ));
    const pull = ambientTarget.sub(pos).mul(0.45);
    vel.addAssign(pull.add(driftForce.mul(0.35)).mul(dt));
    vel.mulAssign(0.94);
    pos.addAssign(vel.mul(dt));
  });
})().compute(PARTICLE_COUNT);

const particleMat = new THREE.SpriteNodeMaterial({
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending
});

const posAttr = posBuffer.toAttribute();
const homeAttr = homeBuffer.toAttribute();
const seedAttr = seedBuffer.toAttribute();

particleMat.positionNode = posAttr;

particleMat.scaleNode = Fn(() => {
  const dz = abs(uFocusZ.sub(seedAttr.z));
  const prox = smoothstep(28.0, 5.0, dz);
  const kind = seedAttr.w;
  const baseSize = mix(float(0.042), float(0.068), kind).mul(seedAttr.y);
  const pulse = sin(time.mul(0.9).add(seedAttr.x)).mul(0.16).add(0.92);
  return baseSize.mul(mix(1.35, 0.82, prox)).mul(pulse);
})();

particleMat.colorNode = Fn(() => {
  const dz = abs(uFocusZ.sub(seedAttr.z));
  const prox = smoothstep(26.0, 4.5, dz);
  const cool = vec3(0.68, 0.77, 0.88);
  const warm = vec3(0.95, 0.88, 0.78);
  const tone = mix(cool, warm, sin(seedAttr.z.mul(0.07).add(seedAttr.x.mul(0.25))).mul(0.5).add(0.5));
  return tone.mul(mix(0.62, 1.25, prox));
})();

particleMat.opacityNode = Fn(() => {
  const d = length(uv().sub(0.5)).mul(2.0);
  const softDisc = exp(d.mul(d).mul(-4.2)).mul(smoothstep(1.0, 0.15, d));
  const camDist = length(posAttr.sub(uCameraPos));
  const nearFade = smoothstep(0.8, 3.8, camDist);
  const farFade = smoothstep(54.0, 12.0, camDist);
  const dz = abs(uFocusZ.sub(seedAttr.z));
  const prox = smoothstep(30.0, 6.0, dz);
  const baseAlpha = mix(mix(0.14, 0.58, prox), float(0.24), seedAttr.w);
  const twinkle = sin(time.mul(1.1).add(seedAttr.x)).mul(0.15).add(0.85);
  return softDisc.mul(nearFade).mul(farFade).mul(baseAlpha).mul(twinkle);
})();

const particles = new THREE.Sprite(particleMat);
particles.count = PARTICLE_COUNT;
particles.frustumCulled = false;
scene.add(particles);

const renderPipeline = new THREE.RenderPipeline(renderer);
const scenePass = pass(scene, camera);
const scenePassColor = scenePass.getTextureNode('output');
const scenePassViewZ = scenePass.getViewZNode();

const dofPass = dof(scenePassColor, scenePassViewZ, uFocusDistance, uFocalLength, uBokehScale);
const bloomPass = bloom(dofPass);
bloomPass.strength.value = 0.34;
bloomPass.radius.value = 0.68;
bloomPass.threshold.value = 0.56;

const filmComposite = Fn(() => {
  const col = dofPass.add(bloomPass);
  const uvScreen = screenUV;
  const centered = uvScreen.sub(0.5);
  const vig = smoothstep(0.98, 0.28, length(centered));
  const grainSeed = uvScreen.mul(vec2(1280.0, 720.0)).add(vec2(time.mul(37.1), time.mul(19.7)));
  const n = fract(sin(dot(grainSeed, vec2(12.9898, 78.233))).mul(43758.5453)).sub(0.5);
  const graded = col.rgb.mul(mix(0.76, 1.0, vig)).add(vec3(n.mul(0.024)));
  return vec4(graded, float(1.0));
})();

renderPipeline.outputNode = filmComposite;

let targetScroll = 0;
let smoothScroll = 0;
let pointerX = 0;
let pointerY = 0;
let smoothPtrX = 0;
let smoothPtrY = 0;
let lastTime = performance.now();

function updateScrollTarget() {
  const maxScroll = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
  targetScroll = Math.min(1, Math.max(0, window.scrollY / maxScroll));
}

window.addEventListener('scroll', updateScrollTarget, { passive: true });
window.addEventListener('pointermove', (e) => {
  pointerX = (e.clientX / window.innerWidth) * 2 - 1;
  pointerY = (e.clientY / window.innerHeight) * 2 - 1;
}, { passive: true });

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

updateScrollTarget();

await renderer.init();

const isWebGPU = Boolean(renderer.backend && renderer.backend.isWebGPUBackend);

if (!isWebGPU) {
  particleMat.positionNode = Fn(() => {
    const dz = abs(uFocusZ.sub(seedAttr.z));
    const materialize = smoothstep(26.0, 5.5, dz);
    const dissolve = float(1.0).sub(materialize);
    const drift = vec3(
      sin(time.mul(0.35).add(seedAttr.x)).mul(1.8),
      cos(time.mul(0.28).add(seedAttr.x.mul(1.3))).mul(1.2).add(0.6),
      cos(time.mul(0.31).add(seedAttr.x.mul(0.8))).mul(1.8)
    ).mul(dissolve.mul(1.6).add(seedAttr.w.mul(0.8)));
    return homeAttr.add(drift);
  })();
}

renderer.setAnimationLoop(() => {
  const now = performance.now();
  const dt = Math.min((now - lastTime) * 0.001, 0.05);
  lastTime = now;
  const elapsed = now * 0.001;

  const prevScroll = smoothScroll;
  smoothScroll += (targetScroll - smoothScroll) * Math.min(1, dt * 3.8);
  const speed = Math.min(3.0, Math.abs(smoothScroll - prevScroll) / Math.max(dt, 0.001) * 28.0);

  smoothPtrX += (pointerX - smoothPtrX) * Math.min(1, dt * 2.2);
  smoothPtrY += (pointerY - smoothPtrY) * Math.min(1, dt * 2.2);

  const camZ = 4.0 - smoothScroll * 130.0;
  const swayX = Math.sin(elapsed * 0.21) * 0.14 + smoothPtrX * 0.48;
  const swayY = 1.85 + Math.cos(elapsed * 0.17) * 0.06 - smoothPtrY * 0.24;

  camera.position.set(swayX, swayY, camZ);
  camera.lookAt(swayX * 0.35, 1.55 - smoothPtrY * 0.12, camZ - 14.0);

  skyDome.position.copy(camera.position);

  uScrollProgress.value = smoothScroll;
  uScrollSpeed.value = speed;
  uFocusZ.value = camZ - 11.5;
  uCameraPos.value.copy(camera.position);
  uFocusDistance.value = 11.5 + speed * 1.4;
  uBokehScale.value = 2.5 + speed * 0.45;

  if (isWebGPU) {
    renderer.compute(computeParticles);
  }

  renderPipeline.render();
});
