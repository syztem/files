<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>AETHER — a field of light</title>
<meta name="description" content="A WebAssembly particle field rendered with three.js, narrated by htmx." />
<meta name="color-scheme" content="dark" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@200;300;400;500&display=swap" />
<style>
  *,*::before,*::after { box-sizing: border-box; }
  * { margin: 0; padding: 0; }

  :root{
    --ink:   #eaeefb;
    --dim:   rgba(234,238,251,.53);
    --faint: rgba(234,238,251,.30);
    --line:  rgba(255,255,255,.09);
    --accent:#8fe3ff;
    --serif: 'Instrument Serif', ui-serif, Georgia, 'Times New Roman', serif;
    --sans:  'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --ease:  cubic-bezier(.16,1,.3,1);
  }

  html, body { height: 100%; }

  body{
    background: #04050a;
    color: var(--ink);
    font-family: var(--sans);
    font-weight: 300;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
  }

  /* ---------------------------------------------------------------- */
  /*  Layer 0 — the WebGL field                                        */
  /* ---------------------------------------------------------------- */
  #field{
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    display: block; z-index: 0;
    opacity: 0;
    transition: opacity 2.2s ease 0.15s;
  }
  #field.ready { opacity: 1; }

  /* ---------------------------------------------------------------- */
  /*  Layer 1 — vignette + filmic edge                                 */
  /* ---------------------------------------------------------------- */
  .vignette{
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background:
      radial-gradient(130% 100% at 50% 42%,
        rgba(0,0,0,0) 32%,
        rgba(2,3,8,.50) 70%,
        rgba(1,1,4,.92) 100%);
  }
  .vignette::after{
    content:'';
    position:absolute; inset:0;
    background-image:
      repeating-linear-gradient(0deg, rgba(255,255,255,.012) 0 1px, transparent 1px 3px);
    opacity:.5;
    mix-blend-mode: overlay;
  }

  /* ---------------------------------------------------------------- */
  /*  Layer 2 — the interface                                          */
  /* ---------------------------------------------------------------- */
  .ui{
    position: fixed; inset: 0; z-index: 2;
    display: grid;
    grid-template-rows: auto 1fr auto;
    gap: clamp(14px, 2.6vh, 34px);
    padding: clamp(18px, 3.2vw, 46px);
    pointer-events: none;
  }

  /* ---- top bar ---------------------------------------------------- */
  .top{
    display:flex; align-items:center; justify-content:space-between; gap:24px;
    opacity:0; animation: fadeDown 1.4s var(--ease) .1s forwards;
  }
  .brand{
    display:flex; align-items:center; gap:11px;
    font-size:10.5px; font-weight:400;
    letter-spacing:.34em; text-transform:uppercase;
    color:var(--dim);
    white-space:nowrap;
  }
  .brand i{
    width:6px; height:6px; border-radius:50%;
    background:var(--accent);
    box-shadow:
      0 0 12px 2px rgba(143,227,255,.85),
      0 0 44px 8px rgba(143,227,255,.28);
    animation: breathe 3.8s ease-in-out infinite;
  }

  .nav{ display:flex; gap: clamp(6px, 1.6vw, 22px); flex-wrap: wrap; justify-content:flex-end; }
  .nav button{
    pointer-events:auto;
    appearance:none; background:none; border:0;
    font-family:inherit; font-size:10.5px; font-weight:400;
    letter-spacing:.22em; text-transform:uppercase;
    color:var(--faint); cursor:pointer;
    padding:8px 2px; position:relative;
    transition: color .45s ease;
  }
  .nav button::after{
    content:''; position:absolute; left:0; right:0; bottom:2px; height:1px;
    background:currentColor;
    transform: scaleX(0); transform-origin:left;
    transition: transform .6s var(--ease);
  }
  .nav button:hover,
  .nav button.is-active{ color: var(--ink); }
  .nav button:hover::after,
  .nav button.is-active::after{ transform: scaleX(1); }
  .nav button:focus-visible{ outline:1px solid var(--accent); outline-offset:4px; border-radius:2px; }

  /* ---- hero ------------------------------------------------------- */
  .hero{
    align-self:center; justify-self:center;
    text-align:center;
    font-family: var(--serif);
    font-weight:400;
    font-size: clamp(40px, 8.4vw, 120px);
    line-height:.94;
    letter-spacing:-.028em;
    max-width: 15ch;
    margin-top:-2vh;
  }
  .hero .ln{
    display:block;
    opacity:0;
    transform: translateY(.45em);
    filter: blur(16px);
    animation: rise 1.7s var(--ease) forwards;
  }
  .hero .ln:nth-child(1){ animation-delay:.30s; }
  .hero .ln:nth-child(2){ animation-delay:.46s; }
  .hero .ln:nth-child(3){ animation-delay:.62s; }

  .hero em{
    font-style: italic;
    background: linear-gradient(104deg,#a9f0ff 0%,#d9bcff 46%,#ffcfae 100%);
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color: transparent; color: transparent;
    padding-right:.06em;
  }

  /* ---- bottom row -------------------------------------------------- */
  .bottom{
    display:flex; align-items:flex-end; justify-content:space-between; gap:26px;
    opacity:0; animation: fadeUp 1.6s var(--ease) .85s forwards;
  }

  .panel{
    pointer-events:auto;
    width: min(432px, 100%);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 20px 22px 18px;
    background: linear-gradient(165deg, rgba(255,255,255,.058), rgba(255,255,255,.014));
    backdrop-filter: blur(22px) saturate(150%);
    -webkit-backdrop-filter: blur(22px) saturate(150%);
    box-shadow:
      0 34px 80px -30px rgba(0,0,0,.96),
      0 0 0 1px rgba(255,255,255,.02) inset,
      inset 0 1px 0 rgba(255,255,255,.075);
  }

  #panel-body{ min-height: 106px; transition: opacity .28s ease; }
  #panel-body.htmx-request{ opacity:.30; }

  #panel-body > *{ animation: fadeUp .8s var(--ease) both; }
  #panel-body > *:nth-child(2){ animation-delay:.06s; }

  #panel-body h2{
    font-family: var(--serif); font-weight:400;
    font-size: 24px; letter-spacing:-.015em; line-height:1.1;
    margin-bottom: 8px;
  }
  #panel-body p{
    font-size: 12.8px; line-height: 1.72;
    color: var(--dim); font-weight:300;
    max-width: 48ch;
  }
  #panel-body p + p{ margin-top: .7em; }

  .stats{
    display:flex; gap:18px;
    margin-top:18px; padding-top:15px;
    border-top:1px solid var(--line);
  }
  .stat{ flex:1 1 0; min-width:0; }
  .stat b{
    display:block;
    font-family: var(--serif); font-weight:400;
    font-size: 21px; letter-spacing:-.01em; color:#fff;
    font-variant-numeric: tabular-nums;
    line-height:1.1;
  }
  .stat b small{ font-size:11px; font-family:var(--sans); font-weight:300; opacity:.45; margin-left:2px; letter-spacing:.02em; }
  .stat span{
    display:block; margin-top:3px;
    font-size: 9px; letter-spacing:.22em; text-transform:uppercase;
    color: var(--faint); white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis;
  }

  .hint{
    font-size: 10px; letter-spacing:.26em; text-transform:uppercase;
    color: var(--faint); text-align:right; line-height:2.1;
    padding-bottom: 4px;
    white-space: nowrap;
  }
  .hint b{ font-weight:400; color: var(--dim); }

  /* ---- keyframes --------------------------------------------------- */
  @keyframes rise{
    to { opacity:1; transform: translateY(0); filter: blur(0); }
  }
  @keyframes fadeUp{
    from{ opacity:0; transform: translateY(12px); }
    to  { opacity:1; transform: translateY(0); }
  }
  @keyframes fadeDown{
    from{ opacity:0; transform: translateY(-10px); }
    to  { opacity:1; transform: translateY(0); }
  }
  @keyframes breathe{
    0%,100%{ opacity:.5; transform: scale(.82); }
    50%    { opacity:1;  transform: scale(1);   }
  }

  /* ---- responsive -------------------------------------------------- */
  @media (max-width: 860px){
    .ui{ padding: 20px; gap: 18px; }
    .bottom{ flex-direction: column; align-items: stretch; gap:16px; }
    .panel{ width:100%; padding:17px 18px 15px; }
    .hint{ text-align:left; white-space:normal; }
    .hero{ font-size: clamp(34px, 10.5vw, 62px); max-width: 13ch; }
    .brand span{ display:none; }
    #panel-body{ min-height: 92px; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
    .hero .ln, .top, .bottom, #panel-body > *{ opacity:1 !important; transform:none !important; filter:none !important; }
  }
</style>
</head>
<body>

<canvas id="field" aria-hidden="true"></canvas>
<div class="vignette" aria-hidden="true"></div>

<div class="ui">

  <header class="top">
    <div class="brand">
      <i aria-hidden="true"></i>
      <span>Aether&nbsp;/&nbsp;MMXXV</span>
    </div>
    <nav class="nav" aria-label="Sections">
      <button data-nav hx-get="/api/notes/field"     hx-target="#panel-body" hx-swap="innerHTML" hx-indicator="#panel-body">The Field</button>
      <button data-nav hx-get="/api/notes/wasm"      hx-target="#panel-body" hx-swap="innerHTML" hx-indicator="#panel-body">WebAssembly</button>
      <button data-nav hx-get="/api/notes/htmx"      hx-target="#panel-body" hx-swap="innerHTML" hx-indicator="#panel-body">htmx</button>
      <button data-nav hx-get="/api/notes/method"    hx-target="#panel-body" hx-swap="innerHTML" hx-indicator="#panel-body">Method</button>
    </nav>
  </header>

  <h1 class="hero">
    <span class="ln">A field of light</span>
    <span class="ln">that <em>bends</em> to</span>
    <span class="ln">your attention.</span>
  </h1>

  <footer class="bottom">
    <aside class="panel" id="panel">
      <div id="panel-body"
           hx-get="/api/notes/field"
           hx-trigger="load"
           hx-swap="innerHTML"></div>
      <div id="panel-stats"
           hx-get="/api/stats"
           hx-trigger="load, every 2s"
           hx-swap="innerHTML"></div>
    </aside>
    <div class="hint">
      move your cursor &middot; <b>the light follows</b>
    </div>
  </footer>

</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
/* ==================================================================== *
 *  AETHER
 *  ------------------------------------------------------------------
 *  1. A WebAssembly module, assembled at runtime from raw bytes.
 *  2. A three.js point cloud reading directly out of WASM linear memory.
 *  3. An htmx-narrated interface, served by an in-page mock backend.
 * ==================================================================== */


/* ==================================================================== *
 *  1.  ASSEMBLING THE WEBASSEMBLY MODULE
 * ==================================================================== *
 *
 *  We build the .wasm binary by hand, byte by byte, in the page.
 *  Here is the module we are producing, in WAT:
 *
 *    (module
 *      (memory (export "memory") 33)          ;; 2 MiB, exactly
 *      (func (export "step")
 *            (param $dt f32) (param $ax f32) (param $ay f32) (param $n i32)
 *        (local $i i32) (local $p i32)
 *        (local $x f32) (local $y f32) (local $vx f32) (local $vy f32)
 *        (local $dx f32) (local $dy f32) (local $d2 f32) (local $inv f32)
 *        (local $tvx f32) (local $tvy f32)
 *        ;; ... see buildSimulationModule() below ...
 *      )
 *    )
 *
 *  Memory layout:
 *      [0 .. 1 MiB)        positions   (x, y) as f32 pairs, interleaved
 *      [1 MiB .. 2 MiB)    velocities  (vx, vy) as f32 pairs, interleaved
 * ==================================================================== */

const PARTICLE_CAPACITY = 131072;          // 2^17
const OFF_VELOCITY      = PARTICLE_CAPACITY * 8;   // = 1 048 576 bytes
const MEMORY_PAGES      = 33;              // 33 × 64 KiB = 2 162 688 bytes

function buildSimulationModule() {
  /* ---- tiny encoders ---------------------------------------------- */
  const f32le = (v) => {
    const dv = new DataView(new ArrayBuffer(4));
    dv.setFloat32(0, v, true);
    return [dv.getUint8(0), dv.getUint8(1), dv.getUint8(2), dv.getUint8(3)];
  };
  const uleb = (n) => {
    const out = [];
    do { let b = n & 0x7f; n >>>= 7; if (n) b |= 0x80; out.push(b); } while (n);
    return out;
  };

  /* ---- pre-computed memory offsets (LEB128) ------------------------ */
  const O_0    = [0x00];
  const O_4    = [0x04];
  const O_VEL  = [0x80, 0x80, 0x40];   // 1 048 576
  const O_VEL4 = [0x84, 0x80, 0x40];   // 1 048 580

  /* ---- opcodes ----------------------------------------------------- */
  const I32_GE_S = 0x4e, I32_ADD = 0x6a, I32_SHL = 0x74;
  const F32_SQRT = 0x91, F32_ADD = 0x92, F32_SUB = 0x93,
        F32_MUL  = 0x94, F32_DIV = 0x95;
  const BLOCK = 0x02, LOOP = 0x03, END = 0x0b, BR = 0x0c, BR_IF = 0x0d;
  const LOCAL_GET = 0x20, LOCAL_SET = 0x21;
  const F32_LOAD = 0x28, F32_STORE = 0x38;
  const I32_CONST = 0x41, F32_CONST = 0x43;
  const VOID_BLOCK = 0x40;

  /* ---- an emitter -------------------------------------------------- */
  const code = [];
  const op   = (o)      => code.push(o);
  const get  = (i)      => code.push(LOCAL_GET, i);
  const set  = (i)      => code.push(LOCAL_SET, i);
  const ic   = (v)      => code.push(I32_CONST, ...uleb(v));
  const fc   = (v)      => code.push(F32_CONST, ...f32le(v));
  const load = (off)    => code.push(F32_LOAD, 0x02, ...off);   // align = 2^2
  const store= (off)    => code.push(F32_STORE, 0x02, ...off);

  /* ---- local index map ---------------------------------------------
   *   0 dt | 1 ax | 2 ay | 3 n            (params)
   *   4 i  | 5 p                          (i32 locals)
   *   6 x  | 7 y  | 8 vx | 9 vy | 10 dx | 11 dy
   *  12 d2 | 13 inv| 14 tvx| 15 tvy        (f32 locals)
   * ------------------------------------------------------------------ */

  ic(0); set(4);                              // i = 0

  op(BLOCK); op(VOID_BLOCK);                  // block $done
  op(LOOP);  op(VOID_BLOCK);                  // loop  $loop

    /* if (i >= n) break */
    get(4); get(3); op(I32_GE_S); op(BR_IF); op(0x01);

    /* p = i << 3  (byte offset of particle i) */
    get(4); ic(3); op(I32_SHL); set(5);

    /* gather state */
    get(5); load(O_0);    set(6);             // x
    get(5); load(O_4);    set(7);             // y
    get(5); load(O_VEL);  set(8);             // vx
    get(5); load(O_VEL4); set(9);             // vy

    /* dx = ax - x ;  dy = ay - y */
    get(1); get(6); op(F32_SUB); set(10);
    get(2); get(7); op(F32_SUB); set(11);

    /* d2 = dx² + dy² + 4   (softened, so the core never explodes) */
    get(10); get(10); op(F32_MUL);
    get(11); get(11); op(F32_MUL);
    op(F32_ADD);
    fc(4.0); op(F32_ADD);
    set(12);

    /* inv = 1 / sqrt(d2) */
    fc(1.0); get(12); op(F32_SQRT); op(F32_DIV); set(13);

    /* target velocity: mostly tangential, slightly inward — a vortex */
    /* tvx = (dx * 0.34 - dy * 0.94) * inv * 15 */
    get(10); fc(0.34); op(F32_MUL);
    get(11); fc(0.94); op(F32_MUL);
    op(F32_SUB);
    get(13); op(F32_MUL);
    fc(15.0); op(F32_MUL);
    set(14);

    /* tvy = (dy * 0.34 + dx * 0.94) * inv * 15 */
    get(11); fc(0.34); op(F32_MUL);
    get(10); fc(0.94); op(F32_MUL);
    op(F32_ADD);
    get(13); op(F32_MUL);
    fc(15.0); op(F32_MUL);
    set(15);

    /* steer velocity toward the target (exponential approach) */
    /* vx += (tvx - vx) * 2.2 * dt */
    get(8);
    get(14); get(8); op(F32_SUB);
    fc(2.2); op(F32_MUL);
    get(0);  op(F32_MUL);
    op(F32_ADD);
    set(8);

    /* vy += (tvy - vy) * 2.2 * dt */
    get(9);
    get(15); get(9); op(F32_SUB);
    fc(2.2); op(F32_MUL);
    get(0);  op(F32_MUL);
    op(F32_ADD);
    set(9);

    /* integrate */
    get(6); get(8); get(0); op(F32_MUL); op(F32_ADD); set(6);   // x += vx·dt
    get(7); get(9); get(0); op(F32_MUL); op(F32_ADD); set(7);   // y += vy·dt

    /* scatter back into linear memory */
    get(5); get(6); store(O_0);
    get(5); get(7); store(O_4);
    get(5); get(8); store(O_VEL);
    get(5); get(9); store(O_VEL4);

    /* i++ */
    get(4); ic(1); op(I32_ADD); set(4);

    op(BR); op(0x00);                         // continue loop

  op(END);                                    // end loop
  op(END);                                    // end block
  op(END);                                    // end function

  /* ---- locals declaration: 2 × i32, 10 × f32 ----------------------- */
  const locals = [0x02, 0x02, 0x7f, 0x0a, 0x7d];
  const body   = [...locals, ...code];

  /* ---- sections ---------------------------------------------------- */
  const HEADER = [0x00,0x61,0x73,0x6d, 0x01,0x00,0x00,0x00];

  const TYPE_SECTION = [
    0x01, 0x08, 0x01,
    0x60, 0x04, 0x7d, 0x7d, 0x7d, 0x7f, 0x00
  ];

  const FUNCTION_SECTION = [0x03, 0x02, 0x01, 0x00];

  const MEMORY_SECTION = [0x05, 0x03, 0x01, 0x00, MEMORY_PAGES];

  const EXPORT_SECTION = [
    0x07, 0x11, 0x02,
      0x06, 0x6d,0x65,0x6d,0x6f,0x72,0x79, 0x02, 0x00,   // "memory" -> mem 0
      0x04, 0x73,0x74,0x65,0x70,           0x00, 0x00    // "step"   -> fn  0
  ];

  const bodySize = uleb(body.length);
  const CODE_SECTION = [
    0x0a,
    ...uleb(1 + bodySize.length + body.length),
    0x01,
    ...bodySize,
    ...body
  ];

  return new Uint8Array([
    ...HEADER,
    ...TYPE_SECTION,
    ...FUNCTION_SECTION,
    ...MEMORY_SECTION,
    ...EXPORT_SECTION,
    ...CODE_SECTION
  ]);
}


/* ==================================================================== *
 *  2.  THE IN-PAGE MOCK BACKEND
 * ==================================================================== *
 *  htmx expects a server. There isn't one — so we intercept fetch()
 *  and answer /api/* ourselves with real HTML fragments. Everything
 *  else (fonts, three.js, htmx itself) falls through untouched.
 * ==================================================================== */

const STATS = { fps: 0, particles: 0, simMs: 0, frames: 0 };

const fmt = (n) => n.toLocaleString('en-US');

const NOTES = {
  field: () => `
    <h2>The Field</h2>
    <p>${fmt(STATS.particles)} points of light, each one chasing a centre that refuses
    to sit still. They are pulled toward it and they swing past it — and that
    argument between gravity and momentum is the whole of the picture.</p>`,

  wasm: () => `
    <h2>WebAssembly</h2>
    <p>The simulation is a <em>.wasm</em> module assembled at runtime, in this page,
    from raw bytes — no toolchain, no fetch, no binary blob. Sixty-four opcodes,
    written out by hand.</p>
    <p>JavaScript writes particle state into linear memory. WebAssembly moves it.
    The renderer reads the very same memory, with no copy in between.</p>`,

  htmx: () => `
    <h2>htmx</h2>
    <p>The words you are reading arrived as HTML. htmx asked for a fragment,
    the page handed one back, and the panel swapped it in. No virtual tree,
    no reconciliation — just attributes on elements.</p>
    <p>Even the numbers below are a fragment, re-fetched every two seconds.</p>`,

  method: () => `
    <h2>Method</h2>
    <p>Three primitives, stacked: a byte array compiled into a WebAssembly
    instance, a point cloud reading straight out of its memory, and an
    interface that speaks plain HTML over the wire.</p>
    <p>Nothing is hidden. View source.</p>`
};

function renderStats() {
  const k = Math.round(STATS.particles / 1024);
  return `
    <div class="stats">
      <div class="stat"><b>${STATS.fps}</b><span>frames / sec</span></div>
      <div class="stat"><b>${k}k</b><span>particles</span></div>
      <div class="stat"><b>${STATS.simMs.toFixed(1)}<small>ms</small></b><span>wasm / frame</span></div>
    </div>`;
}

(function installMockBackend() {
  const nativeFetch = window.fetch.bind(window);

  const ROUTES = {
    '/api/stats': renderStats,
    '/api/notes/field':  NOTES.field,
    '/api/notes/wasm':   NOTES.wasm,
    '/api/notes/htmx':   NOTES.htmx,
    '/api/notes/method': NOTES.method
  };

  window.fetch = async function (input, init) {
    let url;
    try {
      url = typeof input === 'string' ? input
          : (input instanceof Request ? input.url : String(input));
      const path = new URL(url, location.href).pathname;

      if (Object.prototype.hasOwnProperty.call(ROUTES, path)) {
        // A little latency, so the swap animation has room to breathe.
        await new Promise((r) => setTimeout(r, 90 + Math.random() * 140));
        return new Response(ROUTES[path](), {
          status: 200,
          statusText: 'OK',
          headers: {
            'Content-Type': 'text/html; charset=utf-8',
            'Cache-Control': 'no-store'
          }
        });
      }
    } catch (_) { /* fall through */ }

    return nativeFetch(input, init);
  };
})();


/* ==================================================================== *
 *  3.  THREE.JS — THE VISIBLE HALF
 * ==================================================================== */

const canvas = document.getElementById('field');

let THREE;
try {
  THREE = await import('three');
} catch (err) {
  console.warn('[aether] three.js unavailable — running interface only.', err);
}

if (THREE && canvas) {
  try {
    await boot(THREE);
  } catch (err) {
    console.error('[aether] boot failed:', err);
  }
}

async function boot(THREE) {

  /* ---- 3a. compile + instantiate the wasm ------------------------- */
  const wasmBytes = buildSimulationModule();
  const { instance } = await WebAssembly.instantiate(wasmBytes, {});
  const memory   = instance.exports.memory;
  const simStep  = instance.exports.step;

  const capacity = PARTICLE_CAPACITY;

  // Choose an active count appropriate to the device.
  const cores    = navigator.hardwareConcurrency || 4;
  const small    = Math.min(innerWidth, innerHeight) < 700;
  const active   = (small || cores <= 4) ? 49152 : capacity;

  const positions  = new Float32Array(memory.buffer, 0, capacity * 2);
  const velocities = new Float32Array(memory.buffer, OFF_VELOCITY, capacity * 2);

  /* ---- 3b. seed the field ----------------------------------------- */
  for (let i = 0; i < capacity; i++) {
    const a = Math.random() * Math.PI * 2;
    const r = Math.pow(Math.random(), 0.62) * 62 + 2;
    const x = Math.cos(a) * r;
    const y = Math.sin(a) * r;

    positions[i * 2]     = x;
    positions[i * 2 + 1] = y;

    // A gentle tangential kick, so the first frame is already alive.
    velocities[i * 2]     = -Math.sin(a) * 7;
    velocities[i * 2 + 1] =  Math.cos(a) * 7;
  }

  /* ---- 3c. renderer ------------------------------------------------ */
  const renderer = new THREE.WebGLRenderer({
    canvas,
    antialias: false,
    alpha: false,
    powerPreference: 'high-performance',
    stencil: false,
    depth: true
  });
  renderer.setClearColor(0x04050a, 1);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(innerWidth, innerHeight, false);

  const scene  = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(52, innerWidth / innerHeight, 0.5, 3000);
  camera.position.set(0, 0, 62);

  /* ---- 3d. backdrop ------------------------------------------------ */
  const backdrop = new THREE.Mesh(
    new THREE.SphereGeometry(1200, 32, 24),
    new THREE.ShaderMaterial({
      side: THREE.BackSide,
      depthWrite: false,
      depthTest: false,
      vertexShader: /* glsl */`
        varying vec3 vDir;
        void main() {
          vDir = position;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: /* glsl */`
        varying vec3 vDir;
        void main() {
          vec3 d = normalize(vDir);
          float h = d.y * 0.5 + 0.5;

          vec3 bottom = vec3(0.006, 0.006, 0.018);
          vec3 middle = vec3(0.030, 0.021, 0.070);
          vec3 top    = vec3(0.011, 0.015, 0.044);

          vec3 c = mix(bottom, middle, smoothstep(0.0, 0.55, h));
          c = mix(c, top, smoothstep(0.55, 1.0, h));

          // a soft nebular bloom near the horizon
          float g = pow(max(0.0, 1.0 - length(d.xy * vec2(0.5, 1.0))), 3.0);
          c += vec3(0.048, 0.031, 0.082) * g;

          gl_FragColor = vec4(c, 1.0);
        }
      `
    })
  );
  backdrop.renderOrder = -1;
  backdrop.frustumCulled = false;
  scene.add(backdrop);

  /* ---- 3e. the point cloud ---------------------------------------- */
  const geometry = new THREE.BufferGeometry();

  const posAttr = new THREE.BufferAttribute(positions, 2);
  posAttr.setUsage(THREE.DynamicDrawUsage);
  geometry.setAttribute('aPos', posAttr);

  const zArr    = new Float32Array(capacity);
  const seedArr = new Float32Array(capacity);
  for (let i = 0; i < capacity; i++) {
    // z is depth-only scenery: it never moves, it just gives the cloud volume
    zArr[i]    = (Math.random() * 2 - 1) * 36 * (0.30 + 0.70 * Math.random());
    seedArr[i] = Math.random();
  }
  geometry.setAttribute('aZ',    new THREE.BufferAttribute(zArr, 1));
  geometry.setAttribute('aSeed', new THREE.BufferAttribute(seedArr, 1));
  geometry.setDrawRange(0, active);

  const material = new THREE.ShaderMaterial({
    uniforms: {
      uSize: { value: 2.05 },
      uDpr:  { value: renderer.getPixelRatio() },
      uTime: { value: 0 }
    },
    vertexShader: /* glsl */`
      attribute vec2  aPos;
      attribute float aZ;
      attribute float aSeed;

      uniform float uSize;
      uniform float uDpr;
      uniform float uTime;

      varying float vSeed;
      varying float vGlow;

      void main() {
        vSeed = aSeed;

        vec3 p = vec3(aPos, aZ);
        vec4 mv = modelViewMatrix * vec4(p, 1.0);
        gl_Position = projectionMatrix * mv;

        float dist = -mv.z;

        // perspective sizing, with a per-particle size seed
        float size = uSize * uDpr * (0.55 + aSeed * 1.55) * (62.0 / max(dist, 1.0));
        gl_PointSize = clamp(size, 0.55, 30.0);

        // near particles burn brighter
        vGlow = smoothstep(200.0, 34.0, dist) * 0.78 + 0.22;
      }
    `,
    fragmentShader: /* glsl */`
      varying float vSeed;
      varying float vGlow;

      vec3 palette(float t) {
        vec3 c0 = vec3(0.08, 0.30, 1.00);   // deep cobalt
        vec3 c1 = vec3(0.42, 0.93, 1.00);   // cyan
        vec3 c2 = vec3(0.73, 0.53, 1.00);   // violet
        vec3 c3 = vec3(1.00, 0.85, 0.63);   // warm gold
        vec3 c4 = vec3(1.00, 0.52, 0.75);   // rose

        t = clamp(t, 0.0, 1.0) * 4.0;
        if (t < 1.0) return mix(c0, c1, t);
        if (t < 2.0) return mix(c1, c2, t - 1.0);
        if (t < 3.0) return mix(c2, c3, t - 2.0);
        return mix(c3, c4, t - 3.0);
      }

      void main() {
        vec2 uv = gl_PointCoord - 0.5;
        float r2 = dot(uv, uv);
        if (r2 > 0.25) discard;

        float r = sqrt(r2) * 2.0;              // 0 at centre, 1 at rim
        float core = pow(1.0 - r, 3.0);
        float halo = pow(1.0 - r, 1.15) * 0.34;

        float a = (core + halo) * vGlow;

        vec3 col = palette(vSeed) * (0.68 + core * 0.95);
        gl_FragColor = vec4(col, a);
      }
    `,
    transparent: true,
    depthWrite: false,
    depthTest: false,
    blending: THREE.AdditiveBlending
  });

  const points = new THREE.Points(geometry, material);
  points.frustumCulled = false;
  scene.add(points);

  /* ---- 3f. optional bloom ------------------------------------------ */
  let composer = null;
  try {
    const [{ EffectComposer }, { RenderPass }, { UnrealBloomPass }, { OutputPass }] =
      await Promise.all([
        import('three/addons/postprocessing/EffectComposer.js'),
        import('three/addons/postprocessing/RenderPass.js'),
        import('three/addons/postprocessing/UnrealBloomPass.js'),
        import('three/addons/postprocessing/OutputPass.js')
      ]);

    composer = new EffectComposer(renderer);
    composer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
    composer.setSize(innerWidth, innerHeight);
    composer.addPass(new RenderPass(scene, camera));
    composer.addPass(new UnrealBloomPass(
      new THREE.Vector2(innerWidth, innerHeight),
      0.82,   // strength
      0.72,   // radius
      0.09    // threshold
    ));
    composer.addPass(new OutputPass());
  } catch (err) {
    console.warn('[aether] bloom unavailable — rendering direct.', err);
  }

  /* ---- 3g. pointer → world ----------------------------------------- */
  const ndc      = new THREE.Vector2(0, 0);
  const raycaster = new THREE.Raycaster();
  const planeZ0  = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
  const hitPoint = new THREE.Vector3();

  let pointerX = 0, pointerY = 0;
  let lastPointerAt = performance.now() - 4000;

  function setPointer(clientX, clientY) {
    ndc.x =  (clientX / innerWidth)  * 2 - 1;
    ndc.y = -(clientY / innerHeight) * 2 + 1;
    lastPointerAt = performance.now();
  }

  addEventListener('pointermove', (e) => setPointer(e.clientX, e.clientY), { passive: true });
  addEventListener('touchmove',  (e) => {
    if (e.touches[0]) setPointer(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: true });

  /* ---- 3h. resize --------------------------------------------------- */
  let resizeTimer = 0;
  function onResize() {
    const w = innerWidth, h = innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(w, h, false);
    material.uniforms.uDpr.value = renderer.getPixelRatio();
    if (composer) {
      composer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
      composer.setSize(w, h);
    }
  }
  addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(onResize, 120);
  });

  /* ---- 3i. the loop -------------------------------------------------- */
  const clock = new THREE.Clock();
  let attractorX = 0, attractorY = 0;

  let fpsFrames = 0, fpsAccum = 0, simMs = 0;
  let lastStatsPush = performance.now();

  STATS.particles = active;

  function frame() {
    requestAnimationFrame(frame);

    const dt = Math.min(clock.getDelta(), 1 / 30);
    const t  = clock.elapsedTime;
    const now = performance.now();

    /* --- camera drift: a slow, tidal parallax --------------------- */
    camera.position.x = Math.sin(t * 0.100) * 5.2;
    camera.position.y = Math.cos(t * 0.083) * 3.4;
    camera.position.z = 62 + Math.sin(t * 0.061) * 3.2;
    camera.lookAt(0, 0, 0);
    camera.updateMatrixWorld();

    /* --- where does the cursor land in the world? ------------------ */
    raycaster.setFromCamera(ndc, camera);
    let targetX = 0, targetY = 0;
    if (raycaster.ray.intersectPlane(planeZ0, hitPoint)) {
      targetX = hitPoint.x;
      targetY = hitPoint.y;
    }

    /* --- when the cursor is idle, the attractor wanders on its own -- */
    const idle = Math.min(1, (now - lastPointerAt) / 2800);
    const wanderX = Math.sin(t * 0.41) * 26 + Math.sin(t * 0.17) * 12;
    const wanderY = Math.cos(t * 0.33) * 19 + Math.cos(t * 0.23) *  8;

    const goalX = targetX * (1 - idle) + wanderX * idle;
    const goalY = targetY * (1 - idle) + wanderY * idle;

    const follow = 1 - Math.pow(0.14, dt);
    attractorX += (goalX - attractorX) * follow;
    attractorY += (goalY - attractorY) * follow;

    /* --- run the simulation --------------------------------------- */
    const t0 = performance.now();
    simStep(dt, attractorX, attractorY, active);
    const t1 = performance.now();
    simMs = simMs * 0.90 + (t1 - t0) * 0.10;

    posAttr.needsUpdate = true;
    material.uniforms.uTime.value = t;

    /* --- present --------------------------------------------------- */
    if (composer) composer.render();
    else renderer.render(scene, camera);

    /* --- housekeeping ---------------------------------------------- */
    fpsFrames++;
    fpsAccum += dt;
    if (fpsAccum >= 0.5) {
      STATS.fps    = Math.round(fpsFrames / fpsAccum);
      STATS.simMs  = simMs;
      fpsFrames = 0;
      fpsAccum  = 0;
    }

    // make the panel stats tick at a human rate
    if (now - lastStatsPush > 500) {
      lastStatsPush = now;
      window.__AETHER__ = STATS;
    }
  }

  /* ---- 3j. go -------------------------------------------------------- */
  frame();

  // Let the canvas fade in once there is something to see.
  requestAnimationFrame(() => {
    requestAnimationFrame(() => canvas.classList.add('ready'));
  });

  window.__AETHER__ = STATS;
  window.__AETHER_READY__ = true;
}


/* ==================================================================== *
 *  4.  HTMX
 * ==================================================================== */

const HTMX_SOURCES = [
  'https://unpkg.com/htmx.org@4/dist/htmx.min.js',
  'https://cdn.jsdelivr.net/npm/htmx.org@4/dist/htmx.min.js',
  'https://unpkg.com/htmx.org@2/dist/htmx.min.js',
  'https://cdn.jsdelivr.net/npm/htmx.org@2/dist/htmx.min.js'
];

async function loadHtmx() {
  for (const src of HTMX_SOURCES) {
    try {
      await new Promise((resolve, reject) => {
        const el = document.createElement('script');
        el.src = src;
        el.async = false;
        el.onload = resolve;
        el.onerror = () => reject(new Error('404 ' + src));
        document.head.appendChild(el);
      });
      if (window.htmx) {
        window.htmx.process(document.body);
        return true;
      }
    } catch (_) { /* try the next mirror */ }
  }
  return false;
}

/* ---- active-state bookkeeping for the nav ------------------------- */
document.querySelectorAll('[data-nav]').forEach((btn) => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-nav]').forEach((other) => {
      other.classList.toggle('is-active', other === btn);
    });
  });
});

/* ---- go ------------------------------------------------------------ */
const htmxReady = await loadHtmx();

if (!htmxReady) {
  /* Graceful degradation: paint the panel ourselves. */
  console.warn('[aether] htmx unavailable — falling back to local rendering.');
  const body  = document.getElementById('panel-body');
  const stats = document.getElementById('panel-stats');
  if (body)  body.innerHTML  = NOTES.field();
  if (stats) stats.innerHTML = renderStats();

  document.querySelectorAll('[data-nav]').forEach((btn) => {
    btn.addEventListener('click', () => {
      const key = (btn.getAttribute('hx-get') || '').split('/').pop();
      if (NOTES[key] && body) {
        body.innerHTML = NOTES[key]();
      }
    });
  });
} else {
  /* Mark the first nav item active once the initial fragment lands. */
  document.body.addEventListener('htmx:afterSwap', (evt) => {
    if (evt.detail && evt.detail.target && evt.detail.target.id === 'panel-body') {
      const navs = [...document.querySelectorAll('[data-nav]')];
      if (!navs.some((n) => n.classList.contains('is-active')) && navs[0]) {
        navs[0].classList.add('is-active');
      }
    }
  });
}
</script>
