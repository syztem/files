<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fast Food Horse v2</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Balsamiq+Sans:wght@700&display=swap');

        body {
            font-family: 'Balsamiq Sans', cursive;
            background-color: #f0e6d2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        #game-container {
            width: 1200px;
            height: 900px;
            background-color: #fff1e0;
            border: 12px solid #4a3f35;
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.25);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* --- BACKGROUND & SCENE --- */
        #scene {
            flex-grow: 1;
            background: linear-gradient(to top, #e6c28f 0%, #e6c28f 30%, #d8b684 30%, #d8b684 100%);
            position: relative;
            z-index: 1;
        }

        .counter {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 30%;
            background-color: #f5dca8;
            border-top: 15px solid #c9a87c;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        #player-tray {
            display: flex;
            gap: 15px;
            padding: 20px;
            min-height: 100px;
            align-items: flex-end;
        }

        .tray-item {
            font-size: 4em;
            transition: transform 0.2s ease;
        }

        /* --- HORSE CHARACTER & ANIMATION --- */
        #horse-character {
            position: absolute;
            bottom: 25%;
            left: 50%;
            width: 400px;
            /* Default transform-origin is center, which is fine */
            transform: translateX(-50%);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        #horse-character.happy {
            transform: translateX(-50%) translateY(-15px) rotate(4deg) scale(1.05);
        }

        #horse-character.sad {
            transform: translateX(-50%) translateY(15px) rotate(-4deg);
        }

        /* SVG Expression Styling */
        #horse-character .expression-part { display: none; }
        #horse-character.neutral #eyes-neutral, #horse-character.neutral #mouth-neutral { display: block; }
        #horse-character.happy #eyes-happy, #horse-character.happy #mouth-happy { display: block; }
        #horse-character.sad #eyes-sad, #horse-character.sad #mouth-sad { display: block; }


        /* --- UI ELEMENTS --- */
        #ui-top {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            z-index: 10;
            align-items: flex-start;
        }

        #order-ticket {
            width: 300px;
            background-color: #fff;
            border: 3px solid #555;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 5px 5px 8px rgba(0,0,0,0.15);
        }

        #order-ticket h3 {
            margin: 0 0 15px;
            text-align: center;
            border-bottom: 3px dashed #ccc;
            padding-bottom: 10px;
            font-size: 1.8em;
        }

        #order-list {
            list-style: none;
            padding: 0;
            margin: 0;
            font-size: 1.8em;
        }

        #game-info {
            background-color: rgba(0,0,0,0.6);
            color: white;
            padding: 15px 25px;
            border-radius: 30px;
            font-size: 2em;
            text-align: right;
        }
        #strikes-container {
            font-size: 2.5em;
            margin-top: 10px;
        }

        /* --- INTERACTIVE AREA --- */
        #kitchen-area {
            background-color: #4a3f35;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            z-index: 5;
            position: relative;
        }

        .food-item {
            width: 120px;
            height: 120px;
            background-color: #f5dca8;
            border: 5px solid #c9a87c;
            border-radius: 15px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 5em;
            transition: all 0.1s ease-in-out;
            user-select: none;
        }

        .food-item:hover {
            transform: scale(1.1);
            background-color: #fff9e8;
        }
        .food-item:active {
            transform: scale(0.95);
            background-color: #c9a87c;
        }

        #serve-button {
            background-color: #4CAF50;
            color: white;
            font-family: 'Balsamiq Sans', cursive;
            border: none;
            padding: 20px 40px;
            border-radius: 12px;
            font-size: 2.2em;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        #serve-button:hover {
            background-color: #45a049;
        }

        /* --- MESSAGE OVERLAYS --- */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.7);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            text-align: center;
        }
        .overlay h1 {
            font-size: 6em;
            margin: 0;
            text-shadow: 4px 4px 8px #000;
        }
        .overlay p {
            font-size: 2.2em;
        }
        .overlay button {
            font-family: 'Balsamiq Sans', cursive;
            font-size: 2.2em;
            padding: 20px 40px;
            border-radius: 15px;
            border: none;
            cursor: pointer;
            background-color: #5d9cec;
            color: white;
            margin-top: 30px;
            transition: transform 0.2s;
        }
        .overlay button:hover {
            transform: scale(1.05);
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- Start Screen -->
        <div id="start-screen" class="overlay">
            <h1>Fast Food Horse</h1>
            <p>Assemble the orders correctly. You get 3 strikes!</p>
            <button id="start-button">Start Shift</button>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over-screen" class="overlay hidden">
            <h1>Shift Over!</h1>
            <p>You served <span id="final-score">0</span> customers.</p>
            <button id="restart-button">Start New Shift</button>
        </div>
        
        <!-- Main Game Scene -->
        <div id="scene">
            <div id="ui-top">
                <div id="order-ticket">
                    <h3>Customer Order</h3>
                    <ul id="order-list"></ul>
                </div>
                <div id="game-info">
                    <div>Score: <span id="score">0</span></div>
                    <div id="strikes-container"></div>
                </div>
            </div>
            
            <!-- NEW SVG Horse -->
            <svg id="horse-character" class="neutral" viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg">
                <g id="horse-body" stroke="#402D1D" stroke-width="8" stroke-linejoin="round" stroke-linecap="round">
                    <!-- Apron -->
                    <path d="M100 350 H 300" stroke="#8234F7" stroke-width="70"/>
                    <circle cx="200" cy="380" r="25" fill="#FFF" stroke="#8234F7" stroke-width="8"/>
                    <!-- Body -->
                    <path d="M290 280 Q 380 280, 380 370 V 430 H 20 V 370 Q 50 200 200 200 Z" fill="#AD6934"/>
                    <!-- Head Group -->
                    <g id="horse-head" transform="translate(200, 200)">
                        <!-- Head Shape -->
                        <path d="M -50 30 Q -100 -60, 30 -130 T 90 -50 Q 80 40, 20 60 T -50 30 Z" fill="#AD6934"/>
                        <path d="M 5 10 V -120 H -1 V -120 Z" fill="#FFF"/> <!-- Blaze -->
                        <!-- Ears -->
                        <path d="M 70 -120 L 110 -150 L 90 -110 Z" fill="#AD6934"/>
                        <path d="M -40 -115 L -80 -145 L -60 -105 Z" fill="#AD6934"/>
                        <!-- Mane -->
                        <path d="M -10 -140 Q 20 -180, 70 -130" fill="#6D4424"/>
                        
                        <!-- Visor/Hat -->
                        <path d="M -65 -90 H 105 Q 115 -90, 115 -80 V -50 H -75 V -80 Q -75 -90 -65 -90 Z" fill="#8234F7"/>
                        <circle cx="20" cy="-105" r="8" fill="#FFF" stroke="#8234F7" stroke-width="4"/>

                        <!-- EXPRESSIONS (Controlled by CSS) -->
                        <g id="eyes-neutral" class="expression-part">
                            <ellipse cx="-45" cy="-20" rx="12" ry="18" fill="#222"/>
                            <ellipse cx="60" cy="-25" rx="12" ry="18" fill="#222"/>
                        </g>
                        <g id="eyes-happy" class="expression-part">
                            <path d="M-55 -20 Q -45 -35 -35 -20" fill="none" stroke="#222"/>
                            <path d="M 50 -25 Q 60 -40 70 -25" fill="none" stroke="#222"/>
                        </g>
                        <g id="eyes-sad" class="expression-part">
                            <path d="M-60 -20 H -30 M 45 -25 H 75" fill="none" stroke="#222"/>
                        </g>
                        
                        <g id="mouth-neutral" class="expression-part">
                             <path d="M 5 65 Q 20 70 35 65" fill="none"/>
                        </g>
                         <g id="mouth-happy" class="expression-part">
                            <path d="M 0 65 Q 20 85 40 65" fill="none"/>
                        </g>
                         <g id="mouth-sad" class="expression-part">
                            <path d="M 0 70 Q 20 55 40 70" fill="none"/>
                        </g>
                    </g>
                </g>
            </svg>

            <div class="counter">
                <div id="player-tray"></div>
            </div>
        </div>
        
        <!-- Kitchen Area -->
        <div id="kitchen-area">
            <div class="food-item" data-item="taco">🌮</div>
            <div class="food-item" data-item="burrito">🌯</div>
            <div class="food-item" data-item="drink">🥤</div>
            <button id="serve-button">Serve!</button>
        </div>
    </div>

    <script>
        // --- DOM Elements ---
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const startButton = document.getElementById('start-button');
        const restartButton = document.getElementById('restart-button');
        
        const scoreDisplay = document.getElementById('score');
        const finalScoreDisplay = document.getElementById('final-score');
        const strikesContainer = document.getElementById('strikes-container');
        const orderList = document.getElementById('order-list');
        const foodItems = document.querySelectorAll('.food-item');
        const serveButton = document.getElementById('serve-button');
        const horseCharacter = document.getElementById('horse-character');
        const playerTray = document.getElementById('player-tray');

        // --- Game Constants & State ---
        const MAX_STRIKES = 3;
        const availableItems = [
            { id: 'taco', emoji: '🌮' },
            { id: 'burrito', emoji: '🌯' },
            { id: 'drink', emoji: '🥤' }
        ];

        let score = 0;
        let strikes = 0;
        let currentOrder = {};
        let playerOrder = {};

        // --- Sound Manager ---
        const SoundManager = {
            audioCtx: null,
            init() {
                this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            },
            playSound(type) {
                if (!this.audioCtx) return;

                const oscillator = this.audioCtx.createOscillator();
                const gainNode = this.audioCtx.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(this.audioCtx.destination);

                gainNode.gain.setValueAtTime(0.1, this.audioCtx.currentTime);

                if (type === 'click') {
                    oscillator.type = 'triangle';
                    oscillator.frequency.setValueAtTime(800, this.audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.00001, this.audioCtx.currentTime + 0.1);
                } else if (type === 'success') {
                    oscillator.type = 'sine';
                    oscillator.frequency.setValueAtTime(600, this.audioCtx.currentTime);
                    oscillator.frequency.exponentialRampToValueAtTime(1200, this.audioCtx.currentTime + 0.1);
                    gainNode.gain.exponentialRampToValueAtTime(0.00001, this.audioCtx.currentTime + 0.2);
                } else if (type === 'fail') {
                    oscillator.type = 'square';
                    oscillator.frequency.setValueAtTime(400, this.audioCtx.currentTime);
                    oscillator.frequency.exponentialRampToValueAtTime(100, this.audioCtx.currentTime + 0.2);
                    gainNode.gain.exponentialRampToValueAtTime(0.00001, this.audioCtx.currentTime + 0.3);
                }

                oscillator.start(this.audioCtx.currentTime);
                oscillator.stop(this.audioCtx.currentTime + 0.3);
            }
        };

        // --- Game Logic ---
        function generateOrder() {
            currentOrder = {};
            const orderSize = Math.floor(Math.random() * 3) + 1; // 1 to 3 items
            for (let i = 0; i < orderSize; i++) {
                const randomItem = availableItems[Math.floor(Math.random() * availableItems.length)];
                currentOrder[randomItem.id] = (currentOrder[randomItem.id] || 0) + 1;
            }
            displayOrder();
            resetPlayerOrder();
        }

        function displayOrder() {
            orderList.innerHTML = '';
            for (const item in currentOrder) {
                const li = document.createElement('li');
                const itemInfo = availableItems.find(i => i.id === item);
                li.textContent = `${itemInfo.emoji} ${item.charAt(0).toUpperCase() + item.slice(1)} x ${currentOrder[item]}`;
                orderList.appendChild(li);
            }
        }
        
        function resetPlayerOrder() {
            playerOrder = {};
            updatePlayerTray();
        }

        function updatePlayerTray() {
            playerTray.innerHTML = '';
            for (const item in playerOrder) {
                const itemInfo = availableItems.find(i => i.id === item);
                for(let i=0; i < playerOrder[item]; i++) {
                    const trayDiv = document.createElement('div');
                    trayDiv.classList.add('tray-item');
                    trayDiv.textContent = itemInfo.emoji;
                    playerTray.appendChild(trayDiv);
                }
            }
        }
        
        function updateStrikesDisplay() {
            strikesContainer.innerHTML = '';
            for(let i=0; i < strikes; i++) {
                strikesContainer.innerHTML += '🌮';
            }
             for(let i=0; i < MAX_STRIKES - strikes; i++) {
                strikesContainer.innerHTML += '⚪️';
            }
        }

        function handleFoodClick(e) {
            SoundManager.playSound('click');
            const item = e.currentTarget.dataset.item;
            playerOrder[item] = (playerOrder[item] || 0) + 1;
            updatePlayerTray();
        }

        function checkOrder() {
            const currentKeys = Object.keys(currentOrder).sort();
            const playerKeys = Object.keys(playerOrder).sort();

            if (currentKeys.length !== playerKeys.length) return false;
            
            return currentKeys.every(key => currentOrder[key] === playerOrder[key]);
        }

        function handleServeClick() {
            if (checkOrder()) {
                // Correct Order
                SoundManager.playSound('success');
                score++;
                scoreDisplay.textContent = score;
                setHorseExpression('happy');
                setTimeout(generateOrder, 400); // Wait for animation
            } else {
                // Wrong Order
                SoundManager.playSound('fail');
                strikes--;
                updateStrikesDisplay();
                setHorseExpression('sad');
                
                if (strikes <= 0) {
                    setTimeout(endGame, 1000);
                } else {
                    // Reset tray so they can try the same order again
                    setTimeout(resetPlayerOrder, 500);
                }
            }
        }
        
        function setHorseExpression(emotion, duration = 800) {
            horseCharacter.className = emotion; // Set class e.g., 'happy'
            setTimeout(() => {
                horseCharacter.className = 'neutral'; // Return to neutral
            }, duration);
        }

        function startGame() {
            score = 0;
            strikes = MAX_STRIKES;
            scoreDisplay.textContent = score;
            updateStrikesDisplay();
            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            horseCharacter.className = 'neutral';
            generateOrder();
        }

        function endGame() {
            finalScoreDisplay.textContent = score;
            gameOverScreen.classList.remove('hidden');
        }

        // --- Event Listeners ---
        startButton.addEventListener('click', () => {
            SoundManager.init(); // Initialize audio on first user interaction
            startGame();
        });
        restartButton.addEventListener('click', startGame);
        serveButton.addEventListener('click', handleServeClick);
        foodItems.forEach(item => item.addEventListener('click', handleFoodClick));

    </script>
</body>
</html>
