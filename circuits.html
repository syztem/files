<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CIRCUIT</title>
<style>
body{margin:0;overflow:hidden;background:#000}
canvas{width:100vw;height:100vh;display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas=document.getElementById('c');
(async()=>{
if(!navigator.gpu)return;
const adapter=await navigator.gpu.requestAdapter();
const device=await adapter.requestDevice();
const context=canvas.getContext('webgpu');
const format=navigator.gpu.getPreferredCanvasFormat();
context.configure({device,format,alphaMode:'opaque'});
const code=`
struct U{t:f32,pad:f32,r:vec2f}
@group(0)@binding(0)var<uniform>u:U;
fn sdBox(p:vec3f,b:vec3f)->f32{let q=abs(p)-b;return length(max(q,vec3f(0.)))+min(max(q.x,max(q.y,q.z)),0.);}
fn hash(p:vec2f)->f32{return fract(sin(dot(p,vec2f(127.1,311.7)))*43758.5453);}
fn map(p:vec3f)->f32{
let id=floor(p.xz);
let f=fract(p.xz)-0.5;
let h=hash(id);
var d=p.y;
d=min(d,abs(p.y-1.8));
let th=sdBox(vec3f(f.x,p.y-0.08,0.),vec3f(0.48,0.012,0.03));
let tv=sdBox(vec3f(0.,p.y-0.08,f.y),vec3f(0.03,0.012,0.48));
if(h>0.3)d=min(d,th);
if(h<0.7)d=min(d,tv);
if(h>0.75){
let ch=sdBox(vec3f(f.x*0.4,p.y-0.22,f.y*0.4),vec3f(0.18,0.08,0.18));
d=min(d,ch);
}
let via=sdBox(vec3f(f.x,p.y-0.9,f.y),vec3f(0.035,0.9,0.035));
if(fract(h*13.)>0.85)d=min(d,via);
let pulsepos=vec3f(id.x+sin(u.t*1.5+h*6.28)*0.3,0.15+sin(u.t*2.+h)*0.05,id.y+cos(u.t*1.5+h*6.28)*0.3);
let el=length(p-pulsepos)-0.022;
d=min(d,el);
return d;
}
fn norm(p:vec3f)->vec3f{let e=vec2f(0.001,0.);return normalize(vec3f(map(p+e.xyy)-map(p-e.xyy),map(p+e.yxy)-map(p-e.yxy),map(p+e.yyx)-map(p-e.yyx)));}
@vertex
fn vs(@builtin(vertex_index)i:u32)->@builtin(position)vec4f{
var p=array<vec2f,3>(vec2f(-1.,-1.),vec2f(3.,-1.),vec2f(-1.,3.));
return vec4f(p[i],0.,1.);
}
@fragment
fn fs(@builtin(position)fc:vec4f)->@location(0)vec4f{
let uv=(fc.xy/u.r-0.5)*vec2f(u.r.x/u.r.y,1.);
let t=u.t*0.25;
let ro=vec3f(sin(t*0.7)*1.5,0.6+sin(t*1.3)*0.25,t*5.);
let ta=ro+vec3f(sin(t*0.4)*0.8,-0.15,5.);
let ww=normalize(ta-ro);
let uu=normalize(cross(ww,vec3f(0.,1.,0.)));
let vv=cross(uu,ww);
let rd=normalize(uu*uv.x+vv*uv.y+ww*1.2);
var dist=0.;
var hit=false;
for(var i=0;i<96;i++){
let p=ro+rd*dist;
let d=map(p);
if(d<0.0008){hit=true;break;}
dist+=d*0.9;
if(dist>60.)break;
}
var col=vec3f(0.01,0.02,0.04);
if(hit){
let p=ro+rd*dist;
let n=norm(p);
let id=floor(p.xz);
let h=hash(id);
var base=vec3f(0.08,0.12,0.18);
if(p.y>0.05&&p.y<0.2)base=vec3f(0.1,0.85,1.0);
if(p.y>0.15)base=vec3f(0.15,0.2,0.12);
let light=normalize(vec3f(0.5,1.,-0.3));
let diff=max(dot(n,light),0.);
col=base*(0.3+diff*0.7);
let pulse=pow(max(sin(p.z*1.5+u.t*4.+h*10.),0.),6.);
col+=vec3f(1.,0.6,0.2)*pulse*1.5;
let epos=vec3f(id.x+sin(u.t*1.5+h*6.28)*0.3,0.15+sin(u.t*2.+h)*0.05,id.y+cos(u.t*1.5+h*6.28)*0.3);
if(length(p-epos)<0.04)col=vec3f(1.,0.95,0.6);
}
col*=exp(-dist*0.025);
col=pow(col,vec3f(0.85));
return vec4f(col,1.);
}
`;
const module=device.createShaderModule({code});
const pipeline=device.createRenderPipeline({
layout:'auto',
vertex:{module,entryPoint:'vs'},
fragment:{module,entryPoint:'fs',targets:[{format}]},
primitive:{topology:'triangle-list'}
});
const ub=device.createBuffer({size:16,usage:GPUBufferUsage.UNIFORM|GPUBufferUsage.COPY_DST});
const bg=device.createBindGroup({layout:pipeline.getBindGroupLayout(0),entries:[{binding:0,resource:{buffer:ub}}]});
const audio=new AudioContext();
const master=audio.createGain();
master.gain.value=0.08;
master.connect(audio.destination);
const osc1=audio.createOscillator();
osc1.type='sawtooth';
osc1.frequency.value=55;
const g1=audio.createGain();
g1.gain.value=0.4;
osc1.connect(g1).connect(master);
osc1.start();
const osc2=audio.createOscillator();
osc2.type='square';
osc2.frequency.value=220;
const g2=audio.createGain();
g2.gain.value=0.15;
osc2.connect(g2).connect(master);
osc2.start();
const lfo=audio.createOscillator();
lfo.frequency.value=0.1;
const lg=audio.createGain();
lg.gain.value=20;
lfo.connect(lg).connect(osc2.frequency);
lfo.start();
const filter=audio.createBiquadFilter();
filter.type='lowpass';
filter.frequency.value=800;
filter.Q.value=5;
master.disconnect();
master.connect(filter);
filter.connect(audio.destination);
function frame(now){
const dpr=window.devicePixelRatio||1;
canvas.width=canvas.clientWidth*dpr;
canvas.height=canvas.clientHeight*dpr;
device.queue.writeBuffer(ub,0,new Float32Array([now*0.001,0,canvas.width,canvas.height]));
const enc=device.createCommandEncoder();
const pass=enc.beginRenderPass({colorAttachments:[{view:context.getCurrentTexture().createView(),loadOp:'clear',storeOp:'store',clearValue:{r:0,g:0,b:0,a:1}}]});
pass.setPipeline(pipeline);
pass.setBindGroup(0,bg);
pass.draw(3);
pass.end();
device.queue.submit([enc.finish()]);
requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
