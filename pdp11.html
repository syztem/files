<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDP-Gary's Visualizer</title>
    <!-- Three.js via CDN because compiling shaders by hand is masochism -->
    <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
    <!-- HTMX for the interactivity without the JavaScript bloat -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #050505; font-family: 'Courier New', monospace; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        .overlay {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 10; color: #0f0; text-align: center; pointer-events: none;
            text-shadow: 0 0 10px #0f0; font-size: 2rem; mix-blend-mode: screen;
        }
        .controls {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            z-index: 10; pointer-events: auto;
        }
        button {
            background: transparent; border: 1px solid #0f0; color: #0f0;
            padding: 10px 20px; cursor: pointer; font-family: inherit;
            transition: all 0.3s;
        }
        button:hover { background: #0f0; color: #000; box-shadow: 0 0 15px #0f0; }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    
    <div class="overlay">
        <h1>PDP-11/70</h1>
        <p id="status">SYSTEM IDLE</p>
    </div>

    <div class="controls">
        <button hx-post="/api/pulse" hx-swap="innerHTML" hx-target="#status">
            INJECT PULSE
        </button>
    </div>

    <script>
        // Setup Scene
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // The "Beauty": A rotating icosahedron wireframe, glowing amber/green
        const geometry = new THREE.IcosahedronGeometry(2, 1);
        const material = new THREE.MeshBasicMaterial({ 
            color: 0x00ff00, 
            wireframe: true,
            transparent: true,
            opacity: 0.6
        });
        const mesh = new THREE.Mesh(geometry, material);
        scene.add(mesh);

        // Add some points for starfield effect
        const starGeo = new THREE.BufferGeometry();
        const starCount = 5000;
        const posArray = new Float32Array(starCount * 3);
        for(let i = 0; i < starCount * 3; i++) {
            posArray[i] = (Math.random() - 0.5) * 100;
        }
        starGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const starMat = new THREE.PointsMaterial({ color: 0xaaaaaa, size: 0.1 });
        const starMesh = new THREE
        .add(starMesh);

        camera.position.z = 5;

        // Animation Loop
        let pulseIntensity = 0;
        
        function animate() {
            requestAnimationFrame(animate);
            
            // Rotate the core
            mesh.rotation.x += 0.005;
            mesh.rotation.y += 0.005;
            
            // Pulse effect triggered by HTMX
            if (pulseIntensity > 0) {
                material.color.setHSL(0.33, 1.0, 0.5 + pulseIntensity * 0.5); // Brighter green
                pulseIntensity -= 0.02;
            } else {
                material.color.setHex(0x00ff00);
            }

            renderer.render(scene, camera);
        }
        
        animate();

        // Handle Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // HTMX Event Hook: When the server responds, we trigger the visual pulse
        document.body.addEventListener('htmx:afterOnLoad', (evt) => {
            pulseIntensity = 1.0;
            // You could also read server stats here if your backend returns JSON
        });
    </script>
</body>
</html>
